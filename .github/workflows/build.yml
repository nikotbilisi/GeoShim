                  [root stringByAppendingPathComponent:@"var/mobile/Library/Preferences/xyz.regulad.geoshim.plist"],
                  @"/var/jb/var/mobile/Library/Preferences/xyz.regulad.geoshim.plist",
                  @"/var/mobile/Library/Preferences/xyz.regulad.geoshim.plist"
              ];
              for (NSString *p in cands) {
                  if (access(p.fileSystemRepresentation, R_OK) == 0) return p;
              }
              return cands.firstObject;
          }

          static int gsRunCLI(NSArray<NSString *> *args) {
              NSString *cli = gsCLIPath();
              if (!cli || access(cli.fileSystemRepresentation, X_OK) != 0) return -1;
              NSUInteger count = args.count + 1;
              char **argv = (char **)calloc(count + 1, sizeof(char *));
              if (!argv) return -2;
              argv[0] = strdup("geoshim");
              for (NSUInteger i = 0; i < args.count; i++) {
                  argv[i + 1] = strdup(args[i].UTF8String);
              }
              argv[count] = NULL;
              pid_t pid = 0;
              int rc = posix_spawn(&pid, cli.fileSystemRepresentation, NULL, NULL, argv, environ);
              int exitCode = -3;
              if (rc == 0 && pid > 0) {
                  int status = 0;
                  waitpid(pid, &status, 0);
                  if (WIFEXITED(status)) exitCode = WEXITSTATUS(status);
              }
              for (NSUInteger i = 0; i < count; i++) free(argv[i]);
              free(argv);
              return exitCode;
          }

          static BOOL gsReadRealCoord(CLLocationCoordinate2D *outCoord) {
              int tok = -1;
              if (notify_register_check("xyz.regulad.geoshim.real", &tok) != NOTIFY_STATUS_OK || tok == -1) return NO;
              uint64_t rv = 0;
              notify_get_state(tok, &rv);
              notify_cancel(tok);
              if (rv == 0) return NO;
              int32_t ilat = (int32_t)(uint32_t)(rv & 0xFFFFFFFFULL);
              int32_t ilon = (int32_t)(uint32_t)((rv >> 32) & 0xFFFFFFFFULL);
              double lat = ilat / 10000.0, lon = ilon / 10000.0;
              if (fabs(lat) > 90.0 || fabs(lon) > 180.0 || (fabs(lat) < 0.05 && fabs(lon) < 0.05)) return NO;
              if (outCoord) *outCoord = CLLocationCoordinate2DMake(lat, lon);
              return YES;
          }

          static BOOL gsReadDaemonStatus(BOOL *outEnabled, uint32_t *outBlobs) {
              int tok = -1;
              uint64_t xv = 0;
              if (notify_register_check("xyz.regulad.geoshim.xpc", &tok) == NOTIFY_STATUS_OK && tok != -1) {
                  notify_get_state(tok, &xv);
                  notify_cancel(tok);
              }
              if (outBlobs) *outBlobs = (uint32_t)((xv >> 20) & 0xFFFFF);
              NSDictionary *prefs = [NSDictionary dictionaryWithContentsOfFile:gsPrefsPath()];
              if (outEnabled) *outEnabled = [prefs[@"enabled"] boolValue];
              return ((xv >> 63) & 1) == 1;
          }

          static BOOL gsParseCoordinateText(NSString *text, CLLocationCoordinate2D *outCoord) {
              if (!text.length) return NO;
              NSError *err = nil;
              NSRegularExpression *rx = [NSRegularExpression regularExpressionWithPattern:@"(-?\\d{1,2}\\.\\d+)\\s*[,;\\s]+\\s*(-?\\d{1,3}\\.\\d+)"
                                                                                  options:0
                                                                                    error:&err];
              if (!rx) return NO;
              NSArray<NSTextCheckingResult *> *matches = [rx matchesInString:text options:0 range:NSMakeRange(0, text.length)];
              for (NSTextCheckingResult *m in matches) {
                  if (m.numberOfRanges < 3) continue;
                  double lat = [[text substringWithRange:[m rangeAtIndex:1]] doubleValue];
                  double lon = [[text substringWithRange:[m rangeAtIndex:2]] doubleValue];
                  if (lat >= -90.0 && lat <= 90.0 && lon >= -180.0 && lon <= 180.0 &&
                      (fabs(lat) > 0.0001 || fabs(lon) > 0.0001)) {
                      if (outCoord) *outCoord = CLLocationCoordinate2DMake(lat, lon);
                      return YES;
                  }
              }
              return NO;
          }

          // --- Pure UIKit + NSURLSession Web Mercator Tile Map (zero geod/MapKit) ---
          static inline double gsWorldSize(double z) { return 256.0 * pow(2.0, z); }

          static inline double gsLonToX(double lon, double z) {
              return (lon + 180.0) / 360.0 * gsWorldSize(z);
          }

          static inline double gsLatToY(double lat, double z) {
              double clat = fmax(-85.05112878, fmin(85.05112878, lat));
              double rad = clat * M_PI / 180.0;
              return (1.0 - log(tan(rad) + 1.0 / cos(rad)) / M_PI) * 0.5 * gsWorldSize(z);
          }

          static inline double gsXToLon(double x, double z) {
              return x / gsWorldSize(z) * 360.0 - 180.0;
          }

          static inline double gsYToLat(double y, double z) {
              double n = M_PI - 2.0 * M_PI * y / gsWorldSize(z);
              return 180.0 / M_PI * atan(0.5 * (exp(n) - exp(-n)));
          }

          @interface GSTileMapView : UIView <UIGestureRecognizerDelegate>
          @property (nonatomic, assign) double centerLat;
          @property (nonatomic, assign) double centerLon;
          @property (nonatomic, assign) double zoom;
          @property (nonatomic, assign) CLLocationCoordinate2D pinCoord;
          @property (nonatomic, assign) CLLocationCoordinate2D realCoord;
          @property (nonatomic, assign) BOOL hasRealCoord;
          @property (nonatomic, assign) BOOL spoofActive;
          @property (nonatomic, assign) NSInteger styleIndex; // 0=Carto, 1=Satellite, 2=OSM
          @property (nonatomic, copy) void (^onPinChanged)(CLLocationCoordinate2D coord);
          @property (nonatomic, copy) void (^onTileError)(NSString * _Nullable msg);
          @property (nonatomic, copy) void (^onInteraction)(void);

          @property (nonatomic, strong) UIView *tilesContainer;
          @property (nonatomic, strong) UIView *realDotView;
          @property (nonatomic, strong) UIImageView *pinView;
          @property (nonatomic, strong) NSMutableDictionary<NSString *, UIImageView *> *visibleTiles;
          @property (nonatomic, strong) NSCache<NSString *, UIImage *> *tileCache;
          @property (nonatomic, strong) NSMutableSet<NSString *> *inFlightKeys;
          @property (nonatomic, strong) NSURLSession *session;

          @property (nonatomic, assign) double pinchStartZoom;
          @property (nonatomic, assign) double pinchAnchorLat;
          @property (nonatomic, assign) double pinchAnchorLon;
          - (void)reloadTiles;
          - (void)zoomBy:(double)delta;
          @end

          @implementation GSTileMapView

          - (instancetype)initWithFrame:(CGRect)frame {
              self = [super initWithFrame:frame];
              if (self) {
                  self.backgroundColor = [UIColor colorWithRed:0.89 green:0.91 blue:0.93 alpha:1.0];
                  self.clipsToBounds = YES;
                  self.multipleTouchEnabled = YES;

                  _zoom = 14.5;
                  _visibleTiles = [NSMutableDictionary dictionary];
                  _tileCache = [[NSCache alloc] init];
                  _tileCache.countLimit = 450;
                  _inFlightKeys = [NSMutableSet set];

                  NSURLSessionConfiguration *cfg = [NSURLSessionConfiguration defaultSessionConfiguration];
                  cfg.timeoutIntervalForRequest = 12.0;
                  cfg.HTTPMaximumConnectionsPerHost = 8;
                  cfg.HTTPAdditionalHeaders = @{@"User-Agent": @"GeoShimApp/1.1 (iOS; Mobile)"};
                  _session = [NSURLSession sessionWithConfiguration:cfg];

                  _tilesContainer = [[UIView alloc] initWithFrame:self.bounds];
                  _tilesContainer.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
                  _tilesContainer.userInteractionEnabled = NO;
                  [self addSubview:_tilesContainer];

                  _realDotView = [[UIView alloc] initWithFrame:CGRectMake(0, 0, 16, 16)];
                  _realDotView.backgroundColor = UIColor.systemBlueColor;
                  _realDotView.layer.cornerRadius = 8;
                  _realDotView.layer.borderColor = UIColor.whiteColor.CGColor;
                  _realDotView.layer.borderWidth = 2.5;
                  _realDotView.layer.shadowColor = UIColor.blackColor.CGColor;
                  _realDotView.layer.shadowOpacity = 0.3;
                  _realDotView.layer.shadowRadius = 3;
                  _realDotView.hidden = YES;
                  _realDotView.userInteractionEnabled = NO;
                  [self addSubview:_realDotView];

                  _pinView = [[UIImageView alloc] initWithFrame:CGRectMake(0, 0, 40, 40)];
                  UIImageSymbolConfiguration *pcfg = [UIImageSymbolConfiguration configurationWithPointSize:34 weight:UIImageSymbolWeightBold];
                  _pinView.image = [UIImage systemImageNamed:@"mappin.circle.fill" withConfiguration:pcfg];
                  _pinView.contentMode = UIViewContentModeScaleAspectFit;
                  _pinView.tintColor = UIColor.systemRedColor;
                  _pinView.layer.shadowColor = UIColor.blackColor.CGColor;
                  _pinView.layer.shadowOpacity = 0.4;
                  _pinView.layer.shadowRadius = 4;
                  _pinView.layer.shadowOffset = CGSizeMake(0, 2);
                  _pinView.userInteractionEnabled = NO;
                  [self addSubview:_pinView];

                  UIPanGestureRecognizer *pan = [[UIPanGestureRecognizer alloc] initWithTarget:self action:@selector(handlePan:)];
                  pan.maximumNumberOfTouches = 2;
                  pan.delegate = self;
                  [self addGestureRecognizer:pan];

                  UIPinchGestureRecognizer *pinch = [[UIPinchGestureRecognizer alloc] initWithTarget:self action:@selector(handlePinch:)];
                  pinch.delegate = self;
                  [self addGestureRecognizer:pinch];

                  UITapGestureRecognizer *tap = [[UITapGestureRecognizer alloc] initWithTarget:self action:@selector(handleTap:)];
                  tap.delegate = self;
                  [self addGestureRecognizer:tap];
              }
              return self;
          }

          - (BOOL)gestureRecognizer:(UIGestureRecognizer *)a shouldRecognizeSimultaneouslyWithGestureRecognizer:(UIGestureRecognizer *)b {
              return ([a isKindOfClass:[UIPanGestureRecognizer class]] && [b isKindOfClass:[UIPinchGestureRecognizer class]]) ||
                     ([b isKindOfClass:[UIPanGestureRecognizer class]] && [a isKindOfClass:[UIPinchGestureRecognizer class]]);
          }

          - (void)layoutSubviews {
              [super layoutSubviews];
              [self reloadTiles];
          }

          - (CGPoint)screenPointForLat:(double)lat lon:(double)lon {
              double cx = gsLonToX(self.centerLon, self.zoom);
              double cy = gsLatToY(self.centerLat, self.zoom);
              double px = gsLonToX(lon, self.zoom);
              double py = gsLatToY(lat, self.zoom);
              double w = gsWorldSize(self.zoom);
              double dx = px - cx;
              if (dx > w * 0.5) dx -= w;
              if (dx < -w * 0.5) dx += w;
              return CGPointMake(self.bounds.size.width * 0.5 + dx, self.bounds.size.height * 0.5 + (py - cy));
          }

          - (CLLocationCoordinate2D)coordForScreenPoint:(CGPoint)pt {
              double cx = gsLonToX(self.centerLon, self.zoom);
              double cy = gsLatToY(self.centerLat, self.zoom);
              double w = gsWorldSize(self.zoom);
              double wx = fmod(cx + (pt.x - self.bounds.size.width * 0.5), w);
              if (wx < 0) wx += w;
              double wy = fmax(0.0, fmin(w, cy + (pt.y - self.bounds.size.height * 0.5)));
              return CLLocationCoordinate2DMake(gsYToLat(wy, self.zoom), gsXToLon(wx, self.zoom));
          }

          - (NSURL *)tileURLForStyle:(NSInteger)style z:(int)z x:(int)x y:(int)y {
              if (style == 1) {
                  // Esri World Imagery uses /tile/{z}/{y}/{x}
                  NSString *s = [NSString stringWithFormat:@"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/%d/%d/%d", z, y, x];
                  return [NSURL URLWithString:s];
              } else if (style == 2) {
                  NSString *s = [NSString stringWithFormat:@"https://tile.openstreetmap.org/%d/%d/%d.png", z, x, y];
                  return [NSURL URLWithString:s];
              } else {
                  const char *subs = "abcd";
                  char sub = subs[(x + y) & 3];
                  NSString *s = [NSString stringWithFormat:@"https://%c.basemaps.cartocdn.com/rastertiles/voyager/%d/%d/%d@2x.png", sub, z, x, y];
                  return [NSURL URLWithString:s];
              }
          }

          - (void)updateMarkers {
              CGPoint pp = [self screenPointForLat:self.pinCoord.latitude lon:self.pinCoord.longitude];
              self.pinView.center = CGPointMake(pp.x, pp.y - 16.0);
              self.pinView.tintColor = self.spoofActive ? UIColor.systemGreenColor : UIColor.systemRedColor;

              if (self.hasRealCoord) {
                  CGPoint rp = [self screenPointForLat:self.realCoord.latitude lon:self.realCoord.longitude];
                  self.realDotView.center = rp;
                  self.realDotView.hidden = NO;
              } else {
                  self.realDotView.hidden = YES;
              }
          }

          - (void)reloadTiles {
              CGSize sz = self.bounds.size;
              if (sz.width < 10 || sz.height < 10) return;

              int maxZ = (self.styleIndex == 1) ? 18 : 19;
              int tz = (int)floor(self.zoom);
              if (tz < 2) tz = 2;
              if (tz > maxZ) tz = maxZ;
              int n = 1 << tz;

              double scale = pow(2.0, self.zoom - tz);
              double tilePx = 256.0 * scale;
              double cx = gsLonToX(self.centerLon, self.zoom);
              double cy = gsLatToY(self.centerLat, self.zoom);
              double leftWorld = cx - sz.width * 0.5;
              double topWorld  = cy - sz.height * 0.5;

              int tx0 = (int)floor(leftWorld / tilePx) - 1;
              int tx1 = (int)floor((leftWorld + sz.width) / tilePx) + 1;
              int ty0 = (int)floor(topWorld / tilePx) - 1;
              int ty1 = (int)floor((topWorld + sz.height) / tilePx) + 1;

              NSMutableSet<NSString *> *needed = [NSMutableSet set];

              for (int ty = ty0; ty <= ty1; ty++) {
                  if (ty < 0 || ty >= n) continue;
                  for (int tx = tx0; tx <= tx1; tx++) {
                      int wx = ((tx % n) + n) % n;
                      NSString *viewKey = [NSString stringWithFormat:@"%ld:%d:%d:%d", (long)self.styleIndex, tz, tx, ty];
                      NSString *cacheKey = [NSString stringWithFormat:@"%ld:%d:%d:%d", (long)self.styleIndex, tz, wx, ty];
                      [needed addObject:viewKey];

                      CGRect frame = CGRectMake(floor(tx * tilePx - leftWorld),
                                                floor(ty * tilePx - topWorld),
                                                ceil(tilePx) + 1.0,
                                                ceil(tilePx) + 1.0);

                      UIImageView *iv = self.visibleTiles[viewKey];
                      if (!iv) {
                          iv = [[UIImageView alloc] initWithFrame:frame];
                          iv.contentMode = UIViewContentModeScaleToFill;
                          iv.backgroundColor = [UIColor colorWithWhite:0.90 alpha:1.0];
                          UIImage *cached = [self.tileCache objectForKey:cacheKey];
                          if (cached) {
                              iv.image = cached;
                          } else {
                              [self fetchTileKey:cacheKey style:self.styleIndex z:tz x:wx y:ty];
                          }
                          [self.tilesContainer addSubview:iv];
                          self.visibleTiles[viewKey] = iv;
                      } else {
                          iv.frame = frame;
                          if (!iv.image) {
                              UIImage *cached = [self.tileCache objectForKey:cacheKey];
                              if (cached) iv.image = cached;
                          }
                      }
                  }
              }

              NSArray<NSString *> *existing = self.visibleTiles.allKeys;
              for (NSString *k in existing) {
                  if (![needed containsObject:k]) {
                      UIImageView *iv = self.visibleTiles[k];
                      [iv removeFromSuperview];
                      [self.visibleTiles removeObjectForKey:k];
                  }
              }

              [self updateMarkers];
          }

          - (void)fetchTileKey:(NSString *)cacheKey style:(NSInteger)style z:(int)z x:(int)x y:(int)y {
              if ([self.inFlightKeys containsObject:cacheKey]) return;
              [self.inFlightKeys addObject:cacheKey];
              NSURL *url = [self tileURLForStyle:style z:z x:x y:y];
              if (!url) return;

              __weak typeof(self) weakSelf = self;
              NSURLSessionDataTask *task = [self.session dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *resp, NSError *err) {
                  UIImage *img = (data.length > 100 && !err) ? [UIImage imageWithData:data] : nil;
                  NSInteger httpCode = [resp isKindOfClass:[NSHTTPURLResponse class]] ? ((NSHTTPURLResponse *)resp).statusCode : 0;
                  dispatch_async(dispatch_get_main_queue(), ^{
                      __strong typeof(weakSelf) self = weakSelf;
                      if (!self) return;
                      [self.inFlightKeys removeObject:cacheKey];
                      if (img) {
                          [self.tileCache setObject:img forKey:cacheKey];
                          if (self.onTileError) self.onTileError(nil);
                          [self reloadTiles];
                      } else if (self.onTileError) {
                          NSString *m = err ? [NSString stringWithFormat:@"Нет сети (%ld)", (long)err.code]
                                            : [NSString stringWithFormat:@"Ошибка тайла HTTP %ld", (long)httpCode];
                          self.onTileError(m);
                      }
                  });
              }];
              [task resume];
          }

          - (void)zoomBy:(double)delta {
              self.zoom = fmax(2.0, fmin(19.0, self.zoom + delta));
              [self reloadTiles];
          }

          - (void)handlePan:(UIPanGestureRecognizer *)gr {
              if (self.onInteraction) self.onInteraction();
              CGPoint tr = [gr translationInView:self];
              [gr setTranslation:CGPointZero inView:self];
              double w = gsWorldSize(self.zoom);
              double cx = fmod(gsLonToX(self.centerLon, self.zoom) - tr.x, w);
              if (cx < 0) cx += w;
              double cy = fmax(0.0, fmin(w, gsLatToY(self.centerLat, self.zoom) - tr.y));
              self.centerLon = gsXToLon(cx, self.zoom);
              self.centerLat = gsYToLat(cy, self.zoom);
              [self reloadTiles];
          }

          - (void)handlePinch:(UIPinchGestureRecognizer *)gr {
              if (self.onInteraction) self.onInteraction();
              CGPoint loc = [gr locationInView:self];
              if (gr.state == UIGestureRecognizerStateBegan) {
                  self.pinchStartZoom = self.zoom;
                  CLLocationCoordinate2D anchor = [self coordForScreenPoint:loc];
                  self.pinchAnchorLat = anchor.latitude;
                  self.pinchAnchorLon = anchor.longitude;
              } else if (gr.state == UIGestureRecognizerStateChanged) {
                  double newZ = fmax(2.0, fmin(19.0, self.pinchStartZoom + log2(fmax(0.1, gr.scale))));
                  double w = gsWorldSize(newZ);
                  double ax = gsLonToX(self.pinchAnchorLon, newZ);
                  double ay = gsLatToY(self.pinchAnchorLat, newZ);
                  double cx = fmod(ax - (loc.x - self.bounds.size.width * 0.5), w);
                  if (cx < 0) cx += w;
                  double cy = fmax(0.0, fmin(w, ay - (loc.y - self.bounds.size.height * 0.5)));
                  self.zoom = newZ;
                  self.centerLon = gsXToLon(cx, newZ);
                  self.centerLat = gsYToLat(cy, newZ);
                  [self reloadTiles];
              }
          }

          - (void)handleTap:(UITapGestureRecognizer *)gr {
              if (self.onInteraction) self.onInteraction();
              CGPoint pt = [gr locationInView:self];
              CLLocationCoordinate2D c = [self coordForScreenPoint:pt];
              if (CLLocationCoordinate2DIsValid(c)) {
                  self.pinCoord = c;
                  [self updateMarkers];
                  if (self.onPinChanged) self.onPinChanged(c);
              }
          }

          @end

