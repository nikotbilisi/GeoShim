          static SInt32 gs_cfmp_send(CFMessagePortRef remote, SInt32 msgid, CFDataRef data,
                                     CFTimeInterval sendTimeout, CFTimeInterval rcvTimeout,
                                     CFStringRef replyMode, CFDataRef *returnData) {
              CFDataRef patchedRef = NULL;
              uint8_t *buf = NULL;
              if (!gInXpcHook && data && atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) {
                  gInXpcHook = 1;
                  double rlat = gLastRealLat, rlon = gLastRealLon;
                  double flat = 0.0, flon = 0.0;
                  if (gs_refresh_fake_coord(rlat, rlon, &flat, &flon)) {
                      const uint8_t *p = CFDataGetBytePtr(data);
                      CFIndex clen = CFDataGetLength(data);
                      if (p && clen >= 16) {
                          uint32_t pairs = 0;
                          bool na = false, rad = false, f32 = false;
                          buf = gs_make_patched_blob(p, (size_t)clen, rlat, rlon, flat, flon, &pairs, &na, &rad, &f32);
                          if (buf) {
                              patchedRef = CFDataCreate(kCFAllocatorDefault, buf, clen);
                              if (patchedRef) atomic_fetch_add(&gIpcCfmpRewritten, 1);
                          }
                      }
                  }
                  gInXpcHook = 0;
              }
              SInt32 ret = gOrigCFMPSend ? gOrigCFMPSend(remote, msgid, patchedRef ? patchedRef : data, sendTimeout, rcvTimeout, replyMode, returnData) : kCFMessagePortTransportError;
              if (patchedRef) CFRelease(patchedRef);
              if (buf) free(buf);
              return ret;
          }

          static void gs_dmach_send(void *dm, void *dmsg, mach_msg_option_t opt) {
              if (!gInXpcHook && dmsg) { gInXpcHook = 1; gs_handle_outbound_dmach(dmsg); gInXpcHook = 0; }
              if (gOrigDmachSend) gOrigDmachSend(dm, dmsg, opt);
          }

          static void gs_dmach_send_res(void *dm, void *dmsg, mach_msg_option_t opt,
                                        uint32_t flags, unsigned long *res, mach_error_t *err) {
              if (!gInXpcHook && dmsg) { gInXpcHook = 1; gs_handle_outbound_dmach(dmsg); gInXpcHook = 0; }
              if (gOrigDmachSendRes) gOrigDmachSendRes(dm, dmsg, opt, flags, res, err);
          }

          static void *gs_dmach_send_wait(void *dm, void *dmsg, mach_msg_option_t opt) {
              if (!gInXpcHook && dmsg) { gInXpcHook = 1; gs_handle_outbound_dmach(dmsg); gInXpcHook = 0; }
              return gOrigDmachSendWait ? gOrigDmachSendWait(dm, dmsg, opt) : NULL;
          }

          static void *gs_dmach_send_res_wait(void *dm, void *dmsg, mach_msg_option_t opt,
                                              uint32_t flags, unsigned long *res, mach_error_t *err) {
              if (!gInXpcHook && dmsg) { gInXpcHook = 1; gs_handle_outbound_dmach(dmsg); gInXpcHook = 0; }
              return gOrigDmachSendResWait ? gOrigDmachSendResWait(dm, dmsg, opt, flags, res, err) : NULL;
          }

          __attribute__((constructor)) static void gs_diag_init(void) {
              gInXpcHook = 1;
              gBootTime = CFAbsoluteTimeGetCurrent();
              gDaemonPid = (uint32_t)getpid();

              // Persist last known real coordinate across locationd restarts (zero startup leak window)
              int rtok = -1;
              if (notify_register_check(GS_REAL_NOTIFY, &rtok) == NOTIFY_STATUS_OK && rtok != -1) {
                  uint64_t rv = 0;
                  if (notify_get_state(rtok, &rv) == NOTIFY_STATUS_OK && rv != 0) {
                      int32_t ilat = (int32_t)(uint32_t)(rv & 0xFFFFFFFFULL);
                      int32_t ilon = (int32_t)(uint32_t)((rv >> 32) & 0xFFFFFFFFULL);
                      double rlat = ilat / 10000.0, rlon = ilon / 10000.0;
                      if (isfinite(rlat) && isfinite(rlon) && fabs(rlat) <= 90.0 && fabs(rlon) <= 180.0 &&
                          (fabs(rlat) > 0.1 || fabs(rlon) > 0.1)) {
                          gLastRealLat = rlat;
                          gLastRealLon = rlon;
                          atomic_store_explicit(&gHasRealCoord, 1, memory_order_release);
                      }
                  }
                  notify_cancel(rtok);
              }

              gs_diag_publish();

              MSHookFunction((void *)xpc_connection_send_message, (void *)gs_xpc_send_msg, (void **)&gOrigXpcSendMsg);
              if (gOrigXpcSendMsg) atomic_store(&gXpcHookedMsg, 1);

              void *sym = NULL;
              if ((sym = dlsym(RTLD_DEFAULT, "xpc_connection_send_notification"))) {
                  MSHookFunction(sym, (void *)gs_xpc_send_notif, (void **)&gOrigXpcSendNotif);
                  if (gOrigXpcSendNotif) atomic_store(&gXpcHookedNotif, 1);
              }
              MSHookFunction((void *)xpc_connection_send_message_with_reply, (void *)gs_xpc_send_reply, (void **)&gOrigXpcSendReply);
              if (gOrigXpcSendReply) atomic_store(&gXpcHookedReply, 1);

              if ((sym = dlsym(RTLD_DEFAULT, "xpc_connection_send_message_with_reply_sync"))) {
                  MSHookFunction(sym, (void *)gs_xpc_send_sync, (void **)&gOrigXpcSendSync);
                  if (gOrigXpcSendSync) atomic_store(&gXpcHookedSync, 1);
              }

              if ((sym = dlsym(RTLD_DEFAULT, "xpc_pipe_routine_reply"))) {
                  MSHookFunction(sym, (void *)gs_xpc_pipe_reply, (void **)&gOrigXpcPipeReply);
                  if (gOrigXpcPipeReply) atomic_store(&gHookedPipe, 1);
              }
              if ((sym = dlsym(RTLD_DEFAULT, "xpc_pipe_simpleroutine"))) {
                  MSHookFunction(sym, (void *)gs_xpc_pipe_simple, (void **)&gOrigXpcPipeSimple);
                  if (gOrigXpcPipeSimple) atomic_store(&gHookedPipe, 1);
              }
              if ((sym = dlsym(RTLD_DEFAULT, "xpc_pipe_routine"))) {
                  MSHookFunction(sym, (void *)gs_xpc_pipe_routine, (void **)&gOrigXpcPipeRoutine);
                  if (gOrigXpcPipeRoutine) atomic_store(&gHookedPipe, 1);
              }
              if ((sym = dlsym(RTLD_DEFAULT, "xpc_pipe_routine_with_flags"))) {
                  MSHookFunction(sym, (void *)gs_xpc_pipe_routine_flags, (void **)&gOrigXpcPipeRoutineFlags);
                  if (gOrigXpcPipeRoutineFlags) atomic_store(&gHookedPipe, 1);
              }

              if ((sym = dlsym(RTLD_DEFAULT, "xpc_session_send_message"))) {
                  MSHookFunction(sym, (void *)gs_xpc_sess_send, (void **)&gOrigXpcSessSend);
                  if (gOrigXpcSessSend) atomic_store(&gHookedSess, 1);
              }
              if ((sym = dlsym(RTLD_DEFAULT, "xpc_session_send_message_with_reply_async"))) {
                  MSHookFunction(sym, (void *)gs_xpc_sess_async, (void **)&gOrigXpcSessAsync);
                  if (gOrigXpcSessAsync) atomic_store(&gHookedSess, 1);
              }
              if ((sym = dlsym(RTLD_DEFAULT, "xpc_session_send_message_with_reply_sync"))) {
                  MSHookFunction(sym, (void *)gs_xpc_sess_sync, (void **)&gOrigXpcSessSync);
                  if (gOrigXpcSessSync) atomic_store(&gHookedSess, 1);
              }

              if ((sym = dlsym(RTLD_DEFAULT, "CFMessagePortSendRequest"))) {
                  MSHookFunction(sym, (void *)gs_cfmp_send, (void **)&gOrigCFMPSend);
                  if (gOrigCFMPSend) atomic_store(&gHookedCfmp, 1);
              }

              gDmmGetMsg = (gs_dmm_get_msg_fn)dlsym(RTLD_DEFAULT, "dispatch_mach_msg_get_msg");
              if (gDmmGetMsg) {
                  if ((sym = dlsym(RTLD_DEFAULT, "dispatch_mach_send"))) {
                      MSHookFunction(sym, (void *)gs_dmach_send, (void **)&gOrigDmachSend);
                      if (gOrigDmachSend) atomic_store(&gHookedDmach, 1);
                  }
                  if ((sym = dlsym(RTLD_DEFAULT, "dispatch_mach_send_with_result"))) {
                      MSHookFunction(sym, (void *)gs_dmach_send_res, (void **)&gOrigDmachSendRes);
                      if (gOrigDmachSendRes) atomic_store(&gHookedDmach, 1);
                  }
                  if ((sym = dlsym(RTLD_DEFAULT, "dispatch_mach_send_and_wait_for_reply"))) {
                      MSHookFunction(sym, (void *)gs_dmach_send_wait, (void **)&gOrigDmachSendWait);
                      if (gOrigDmachSendWait) atomic_store(&gHookedDmach, 1);
                  }
                  if ((sym = dlsym(RTLD_DEFAULT, "dispatch_mach_send_with_result_and_wait_for_reply"))) {
                      MSHookFunction(sym, (void *)gs_dmach_send_res_wait, (void **)&gOrigDmachSendResWait);
                      if (gOrigDmachSendResWait) atomic_store(&gHookedDmach, 1);
                  }
              }

              gs_xpc_publish();
              gInXpcHook = 0;
          }'''
          assert tx.count(old_anchor) == 1
          tx = tx.replace(old_anchor, xpc_rewriter, 1)

          old_fn = '''static void gs_encodeWithCoder(id self, SEL _cmd, NSCoder *coder) {
              @try {
                  GSLocationFactory *factory = [GSLocationFactory shared];
                  if (factory.active && [self isKindOfClass:[CLLocation class]]) {
                      CLLocation *real = (CLLocation *)self;

                      // Only rewrite plausible position fixes. Region/visit archiving and
                      // other internal round-trips of a CLLocation with an invalid
                      // coordinate are left alone.
                      if (CLLocationCoordinate2DIsValid(real.coordinate)) {
                          [factory noteRealLocation:real];
                          CLLocation *fake = [factory spoofedLocationFromReal:real];
                          if (fake && gEncodeWithCoderOrig) {
                              if (GEOSHIM_DEBUG_BUILD) {
                                  GSLog(@"locationd: encode %f,%f -> %f,%f",
                                        real.coordinate.latitude, real.coordinate.longitude,
                                        fake.coordinate.latitude, fake.coordinate.longitude);
                              }
                              ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(fake, _cmd, coder);
                              return;
                          }
                      }
                  }
              } @catch (NSException *e) {
                  GSLog(@"locationd: encodeWithCoder substitution failed: %@", e);
              }

              if (gEncodeWithCoderOrig) {
                  ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(self, _cmd, coder);
              }
          }'''

          new_fn = '''static void gs_encodeWithCoder(id self, SEL _cmd, NSCoder *coder) {
              gs_diag_inc(&gDiagEnter);
              @try {
                  GSLocationFactory *factory = [GSLocationFactory shared];
                  bool active = factory && factory.active;
                  atomic_store_explicit(&gCachedActive, active ? 1 : 0, memory_order_release);
                  if (active && [self isKindOfClass:[CLLocation class]]) {
                      CLLocation *real = (CLLocation *)self;

                      // Only rewrite plausible position fixes. Region/visit archiving and
                      // other internal round-trips of a CLLocation with an invalid
                      // coordinate are left alone.
                      if (CLLocationCoordinate2DIsValid(real.coordinate)) {
                          [factory noteRealLocation:real];
                          CLLocation *fake = [factory spoofedLocationFromReal:real];
                          bool hasFake = (fake && CLLocationCoordinate2DIsValid(fake.coordinate));
                          if (hasFake && gCachedFakeTs == 0.0) {
                              gCachedFakeLat = fake.coordinate.latitude;
                              gCachedFakeLon = fake.coordinate.longitude;
                              gCachedFakeTs = CFAbsoluteTimeGetCurrent();
                          }
                          double age = real.timestamp ? fabs([real.timestamp timeIntervalSinceNow]) : 999.0;
                          if (real.horizontalAccuracy > 0.0 && real.horizontalAccuracy < 10000.0 && age < 30.0) {
                              gs_note_live_real_coord(real.coordinate.latitude, real.coordinate.longitude,
                                                      hasFake ? fake.coordinate.latitude : 0.0,
                                                      hasFake ? fake.coordinate.longitude : 0.0,
                                                      hasFake);
                          } else if (!atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) {
                              gs_note_live_real_coord(real.coordinate.latitude, real.coordinate.longitude,
                                                      hasFake ? fake.coordinate.latitude : 0.0,
                                                      hasFake ? fake.coordinate.longitude : 0.0,
                                                      hasFake);
                          }
                          if (fake && gEncodeWithCoderOrig) {
                              gs_diag_inc(&gDiagSpoof);
                              if (GEOSHIM_DEBUG_BUILD) {
                                  GSLog(@"locationd: encode %f,%f -> %f,%f",
                                        real.coordinate.latitude, real.coordinate.longitude,
                                        fake.coordinate.latitude, fake.coordinate.longitude);
                              }
                              ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(fake, _cmd, coder);
                              return;
                          }
                      }
                  }
              } @catch (NSException *e) {
                  gs_diag_inc(&gDiagThrow);
                  GSLog(@"locationd: encodeWithCoder substitution failed: %@", e);
              }

              if (gEncodeWithCoderOrig) {
                  ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(self, _cmd, coder);
              }
          }'''
          assert tx.count(old_fn) == 1
          tx = tx.replace(old_fn, new_fn, 1)
          open("Tweak.x", "w").write(tx)

          m = open("cli/main.m").read()
          old_json_anchor = "static int commandStatusJSON(void) {"
          diag_fn = '''static void printEncodeDiag(void) {
              int tok = -1;
              if (notify_register_check("xyz.regulad.geoshim.diag", &tok) == NOTIFY_STATUS_OK) {
                  uint64_t v = 0;
                  notify_get_state(tok, &v);
                  notify_cancel(tok);
                  printf("  encode hook: diag_alive=%u calls=%llu spoofed=%llu threw=%llu\\n",
                         (unsigned)((v >> 63) & 1),
                         (unsigned long long)(v & 0xFFFF),
                         (unsigned long long)((v >> 16) & 0xFFFF),
                         (unsigned long long)((v >> 32) & 0xFFFF));
              }
              int pt = -1;
              if (notify_register_check("xyz.regulad.geoshim.proc", &pt) == NOTIFY_STATUS_OK) {
                  uint64_t pv = 0;
                  notify_get_state(pt, &pv);
                  notify_cancel(pt);
                  printf("  daemon proc: pid=%u uptime=%us\\n",
                         (unsigned)(pv & 0xFFFFFFFFULL),
                         (unsigned)((pv >> 32) & 0xFFFFFFFFULL));
              }
              int rt = -1;
              if (notify_register_check("xyz.regulad.geoshim.real", &rt) == NOTIFY_STATUS_OK) {
                  uint64_t rv = 0;
                  notify_get_state(rt, &rv);
                  notify_cancel(rt);
                  int32_t ilat = (int32_t)(uint32_t)(rv & 0xFFFFFFFFULL);
                  int32_t ilon = (int32_t)(uint32_t)((rv >> 32) & 0xFFFFFFFFULL);
                  printf("  real coord:  %.4f, %.4f\\n", ilat / 10000.0, ilon / 10000.0);
              }
              int xt = -1, xt2 = -1, xt3 = -1, xt4 = -1;
              uint64_t xv = 0, xv2 = 0, xv3 = 0, xv4 = 0;
              if (notify_register_check("xyz.regulad.geoshim.xpc", &xt) == NOTIFY_STATUS_OK) {
                  notify_get_state(xt, &xv); notify_cancel(xt);
              }
              if (notify_register_check("xyz.regulad.geoshim.xpc2", &xt2) == NOTIFY_STATUS_OK) {
                  notify_get_state(xt2, &xv2); notify_cancel(xt2);
              }
              if (notify_register_check("xyz.regulad.geoshim.xpc3", &xt3) == NOTIFY_STATUS_OK) {
                  notify_get_state(xt3, &xv3); notify_cancel(xt3);
              }
              if (notify_register_check("xyz.regulad.geoshim.xpc4", &xt4) == NOTIFY_STATUS_OK) {
                  notify_get_state(xt4, &xv4); notify_cancel(xt4);
              }
              printf("  xpc rewrite: alive=%u hooks=%u/%u/%u/%u/%u/%u/%u/%u blobs=%llu pairs=%llu nonadj=%llu dbls=%llu rad=%llu f32=%llu\\n",
                     (unsigned)((xv >> 63) & 1),
                     (unsigned)((xv >> 62) & 1),
                     (unsigned)((xv >> 61) & 1),
                     (unsigned)((xv >> 60) & 1),
                     (unsigned)((xv >> 59) & 1),
                     (unsigned)((xv >> 58) & 1),
                     (unsigned)((xv >> 57) & 1),
                     (unsigned)((xv >> 56) & 1),
                     (unsigned)((xv >> 55) & 1),
                     (unsigned long long)((xv >> 20) & 0xFFFFF),
                     (unsigned long long)(xv & 0xFFFFF),
                     (unsigned long long)(xv2 & 0xFFFF),
                     (unsigned long long)((xv2 >> 16) & 0xFFFF),
                     (unsigned long long)((xv2 >> 32) & 0xFFFF),
                     (unsigned long long)((xv2 >> 48) & 0xFFFF));
              printf("  ipc guards:  post_leak=%llu pipe=%llu sess=%llu cfmp=%llu dmach_in=%llu dmach_ool=%llu flips=%llu shmem=%llu\\n",
                     (unsigned long long)(xv3 & 0xFFFF),
                     (unsigned long long)((xv3 >> 16) & 0xFFFF),
                     (unsigned long long)((xv4 >> 48) & 0xFFFF),
                     (unsigned long long)((xv3 >> 32) & 0xFFFF),
                     (unsigned long long)((xv3 >> 48) & 0xFFFF),
                     (unsigned long long)(xv4 & 0xFFFF),
                     (unsigned long long)((xv4 >> 16) & 0xFFFF),
                     (unsigned long long)((xv4 >> 32) & 0xFFFF));
          }

          ''' + old_json_anchor
          assert m.count(old_json_anchor) == 1
          m = m.replace(old_json_anchor, diag_fn, 1)

          old_visit = '''        printf("  visit hook:      %s\\n", (st & GS_STATUS_VISIT_HOOK) ? "installed" : "missing");'''
          new_visit = old_visit + '''
                  printEncodeDiag();'''
          assert m.count(old_visit) == 1
          m = m.replace(old_visit, new_visit, 1)
          open("cli/main.m", "w").write(m)

          mk = open("Makefile").read()
          mk = re.sub(r'(?m)^(\s*\w+_LIBRARIES\s*=.*)$',
                      lambda mm: re.sub(r'\bsandy\b', '', mm.group(1)), mk)
          mk = re.sub(r'(?m)^\s*SUBPROJECTS\s*\+=\s*prefs\s*\n', '', mk)
          open("Makefile", "w").write(mk)

          ctl = open("control").read()
          ctl = re.sub(r'(?m)^Depends:.*$', 'Depends: ellekit', ctl)
          open("control", "w").write(ctl)

          shutil.rmtree("layout/Library/PreferenceLoader", ignore_errors=True)

          assert plistlib.load(open("GeoShim.plist", "rb")) == {"Filter": {"Executables": ["locationd"]}}
          assert "gIpcDmachInHits" in open("Tweak.x").read()
          assert "dmach_in=" in open("cli/main.m").read()
          print("patch ok")
          PY

      - name: Setup RootHide Theos (macOS + Xcode)
        run: |
          brew install ldid dpkg xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Build .deb (debug build)
        run: |
          export THEOS="$HOME/theos"
          make package ARCHS=arm64e

      - name: Verify ABI, package, diagnostics
        run: |
          python3 - << 'PY'
          import glob, os, struct, sys
          cands = []
          for pat in ("**/GeoShim.dylib", "**/geoshim"):
              cands += glob.glob(os.path.join(".theos/obj", pat), recursive=True)
          files = [p for p in cands if os.path.isfile(p)]
          if not files:
              sys.exit("no built binaries found")
          bad = []
          for p in files:
              magic, cputype, subtype = struct.unpack("<III", open(p, "rb").read(12))
              print(f"{p}: cputype=0x{cputype:08x} cpusubtype=0x{subtype:08x}")
              if cputype != 0x0100000C or not (subtype & 0x80000000):
                  bad.append(p)
          if bad:
              sys.exit("old arm64e ABI: " + ", ".join(bad))
          print("OK: arm64e ptrauth ABI")
          PY
          DEB=$(ls packages/*.deb | head -n 1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Package Version Architecture Depends
          [ "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64e" ] || { echo "bad package arch"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E 'GeoShim\.dylib$|/geoshim$'
          rm -rf /tmp/debx && dpkg-deb -x "$DEB" /tmp/debx
          strings /tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.dylib | grep -q "regulad.geoshim.xpc4" || { echo "xpc v3 missing in dylib"; exit 1; }
          strings /tmp/debx/usr/local/bin/geoshim | grep -q "dmach_in=" || { echo "xpc v3 output missing in cli"; exit 1; }
          python3 -c 'import plistlib; p=plistlib.load(open("/tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.plist","rb")); assert p=={"Filter":{"Executables":["locationd"]}}, p; print("filter ok")'

      - name: Save .deb file
        uses: actions/upload-artifact@v4
        with:
          name: geoshim-deb-${{ matrix.os }}
          path: packages/*.deb
          if-no-files-found: error

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: geoshim-deb-*
          merge-multiple: true
          path: dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          DEB=$(ls dist/*.deb 2>/dev/null | head -n 1)
          if [ -z "$DEB" ]; then echo "no .deb produced"; exit 1; fi
          cp "$DEB" dist/geoshim-latest.deb
          gh release view latest-build >/dev/null 2>&1 || \
            gh release create latest-build --title "GeoShim latest build" --notes "Automated build ${GITHUB_SHA}"
          gh release upload latest-build dist/geoshim-latest.deb --clobber
