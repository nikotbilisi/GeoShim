          - (void)willMoveToSuperview:(UIView *)newSuperview {
            [super willMoveToSuperview:newSuperview];
            if (!newSuperview) [self stopAnimations];
          }

          - (void)dealloc {
            [self stopAnimations];
            [_session invalidateAndCancel];
          }

          - (void)stopAnimations {
            self.animMode = 0;
            if (self.displayLink) {
              [self.displayLink invalidate];
              self.displayLink = nil;
            }
          }

          - (void)ensureDisplayLink {
            if (self.displayLink) return;
            GSDisplayLinkProxy *proxy = [[GSDisplayLinkProxy alloc] init];
            proxy.target = self;
            proxy.selector = @selector(onDisplayLink:);
            self.displayLink = [CADisplayLink displayLinkWithTarget:proxy selector:@selector(tick:)];
            self.lastFrameTs = 0;
            [self.displayLink addToRunLoop:NSRunLoop.mainRunLoop forMode:NSRunLoopCommonModes];
          }

          - (void)onDisplayLink:(CADisplayLink *)link {
            CFTimeInterval now = link.timestamp;
            if (self.animMode == 1) {
              double dt = (self.lastFrameTs > 0.0) ? fmax(1.0 / 120.0, fmin(1.0 / 20.0, now - self.lastFrameTs)) : (1.0 / 60.0);
              self.lastFrameTs = now;
              double dx = self.panVelX * dt;
              double dy = self.panVelY * dt;
              double w = gsWorldSize(self.zoom);
              double cx = fmod(gsLonToX(self.centerLon, self.zoom) - dx, w);
              if (cx < 0) cx += w;
              double cy = fmax(0.0, fmin(w, gsLatToY(self.centerLat, self.zoom) - dy));
              self.centerLon = gsXToLon(cx, self.zoom);
              self.centerLat = gsYToLat(cy, self.zoom);

              double decay = pow(0.92, dt * 60.0);
              self.panVelX *= decay;
              self.panVelY *= decay;
              [self reloadTiles];
              if (hypot(self.panVelX, self.panVelY) < 18.0) {
                [self stopAnimations];
              }
            } else if (self.animMode == 2) {
              if (self.zoomStartTs <= 0.0) self.zoomStartTs = now;
              double t = fmax(0.0, fmin(1.0, (now - self.zoomStartTs) / fmax(0.05, self.zoomDuration)));
              double ease = 1.0 - pow(1.0 - t, 3.0);
              double newZ = self.zoomStart + (self.zoomTarget - self.zoomStart) * ease;
              double w = gsWorldSize(newZ);
              double ax = gsLonToX(self.zoomAnchorLon, newZ);
              double ay = gsLatToY(self.zoomAnchorLat, newZ);
              double cx = fmod(ax - (self.zoomAnchorPt.x - self.bounds.size.width * 0.5), w);
              if (cx < 0) cx += w;
              double cy = fmax(0.0, fmin(w, ay - (self.zoomAnchorPt.y - self.bounds.size.height * 0.5)));
              self.zoom = newZ;
              self.centerLon = gsXToLon(cx, newZ);
              self.centerLat = gsYToLat(cy, newZ);
              [self reloadTiles];
              if (t >= 1.0) {
                [self stopAnimations];
              }
            } else {
              [self stopAnimations];
            }
          }

          - (BOOL)gestureRecognizer:(UIGestureRecognizer *)a shouldRecognizeSimultaneouslyWithGestureRecognizer:(UIGestureRecognizer *)b {
            return ([a isKindOfClass:[UIPanGestureRecognizer class]] && [b isKindOfClass:[UIPinchGestureRecognizer class]]) ||
                 ([b isKindOfClass:[UIPanGestureRecognizer class]] && [a isKindOfClass:[UIPinchGestureRecognizer class]]);
          }

          - (void)layoutSubviews {
            [super layoutSubviews];
            [self reloadTiles];
          }

          - (void)clearVisibleTiles {
            for (NSURLSessionDataTask *t in self.inFlightTasks.allValues) [t cancel];
            [self.inFlightTasks removeAllObjects];
            for (UIImageView *iv in self.visibleTiles.allValues) [iv removeFromSuperview];
            [self.visibleTiles removeAllObjects];
            [self.viewCacheKeys removeAllObjects];
          }

          - (CGPoint)screenPointForLat:(double)lat lon:(double)lon {
            double cx = gsLonToX(self.centerLon, self.zoom);
            double cy = gsLatToY(self.centerLat, self.zoom);
            double px = gsLonToX(lon, self.zoom);
            double py = gsLatToY(lat, self.zoom);
            double w = gsWorldSize(self.zoom);
            double dx = px - cx;
            if (dx > w * 0.5) dx -= w;
            if (dx < -w * 0.5) dx += w;
            return CGPointMake(self.bounds.size.width * 0.5 + dx, self.bounds.size.height * 0.5 + (py - cy));
          }

          - (CLLocationCoordinate2D)coordForScreenPoint:(CGPoint)pt {
            double cx = gsLonToX(self.centerLon, self.zoom);
            double cy = gsLatToY(self.centerLat, self.zoom);
            double w = gsWorldSize(self.zoom);
            double wx = fmod(cx + (pt.x - self.bounds.size.width * 0.5), w);
            if (wx < 0) wx += w;
            double wy = fmax(0.0, fmin(w, cy + (pt.y - self.bounds.size.height * 0.5)));
            return CLLocationCoordinate2DMake(gsYToLat(wy, self.zoom), gsXToLon(wx, self.zoom));
          }

          - (NSURL *)tileURLForStyle:(NSInteger)style z:(int)z x:(int)x y:(int)y {
            if (style == 1) {
              return [NSURL URLWithString:[NSString stringWithFormat:@"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/%d/%d/%d", z, y, x]];
            } else if (style == 2) {
              return [NSURL URLWithString:[NSString stringWithFormat:@"https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/%d/%d/%d", z, y, x]];
            } else {
              return [NSURL URLWithString:[NSString stringWithFormat:@"https://tile.openstreetmap.org/%d/%d/%d.png", z, x, y]];
            }
          }

          - (void)updateMarkers {
            CGPoint pp = [self screenPointForLat:self.pinCoord.latitude lon:self.pinCoord.longitude];
            self.pinView.center = CGPointMake(pp.x, pp.y - 16.0);
            self.pinView.tintColor = self.spoofActive ? UIColor.systemGreenColor : UIColor.systemRedColor;

            if (self.hasRealCoord) {
              CGPoint rp = [self screenPointForLat:self.realCoord.latitude lon:self.realCoord.longitude];
              self.realDotView.center = rp;
              self.realDotView.hidden = NO;
            } else {
              self.realDotView.hidden = YES;
            }
          }

          - (void)reloadTiles {
            CGSize sz = self.bounds.size;
            if (sz.width < 10 || sz.height < 10) return;

            int maxZ = (self.styleIndex == 0) ? 19 : 18;
            int tz = (int)floor(self.zoom);
            if (tz < 2) tz = 2;
            if (tz > maxZ) tz = maxZ;
            int n = 1 << tz;

            double scale = pow(2.0, self.zoom - tz);
            double tilePx = 256.0 * scale;
            double cx = gsLonToX(self.centerLon, self.zoom);
            double cy = gsLatToY(self.centerLat, self.zoom);
            double leftWorld = cx - sz.width * 0.5;
            double topWorld  = cy - sz.height * 0.5;

            int tx0 = (int)floor(leftWorld / tilePx) - 1;
            int tx1 = (int)floor((leftWorld + sz.width) / tilePx) + 1;
            int ty0 = (int)floor(topWorld / tilePx) - 1;
            int ty1 = (int)floor((topWorld + sz.height) / tilePx) + 1;

            NSMutableSet<NSString *> *neededViews = [NSMutableSet set];
            NSMutableSet<NSString *> *neededCaches = [NSMutableSet set];

            for (int ty = ty0; ty <= ty1; ty++) {
              if (ty < 0 || ty >= n) continue;
              for (int tx = tx0; tx <= tx1; tx++) {
                int wx = ((tx % n) + n) % n;
                NSString *viewKey = [NSString stringWithFormat:@"%ld:%d:%d:%d", (long)self.styleIndex, tz, tx, ty];
                NSString *cacheKey = [NSString stringWithFormat:@"%ld:%d:%d:%d", (long)self.styleIndex, tz, wx, ty];
                [neededViews addObject:viewKey];
                [neededCaches addObject:cacheKey];

                CGRect frame = CGRectMake(floor(tx * tilePx - leftWorld),
                              floor(ty * tilePx - topWorld),
                              ceil(tilePx) + 1.0,
                              ceil(tilePx) + 1.0);

                UIImageView *iv = self.visibleTiles[viewKey];
                UIImage *cached = [self.tileCache objectForKey:cacheKey];
                if (!iv) {
                  iv = [[UIImageView alloc] initWithFrame:frame];
                  iv.contentMode = UIViewContentModeScaleToFill;
                  iv.backgroundColor = [UIColor colorWithRed:0.86 green:0.89 blue:0.92 alpha:1.0];
                  if (cached) {
                    iv.layer.contentsRect = CGRectMake(0, 0, 1, 1);
                    iv.image = cached;
                  } else {
                    if (tz > 2) {
                      NSString *pkey = [NSString stringWithFormat:@"%ld:%d:%d:%d", (long)self.styleIndex, tz - 1, wx >> 1, ty >> 1];
                      UIImage *pimg = [self.tileCache objectForKey:pkey];
                      if (pimg) {
                        iv.layer.contentsRect = CGRectMake((wx & 1) ? 0.5 : 0.0, (ty & 1) ? 0.5 : 0.0, 0.5, 0.5);
                        iv.image = pimg;
                      }
                    }
                    [self fetchTileKey:cacheKey style:self.styleIndex z:tz x:wx y:ty isFallback:NO silent:NO];
                  }
                  [self.tilesContainer addSubview:iv];
                  self.visibleTiles[viewKey] = iv;
                  self.viewCacheKeys[viewKey] = cacheKey;
                } else {
                  iv.frame = frame;
                  if (cached && iv.image != cached) {
                    iv.layer.contentsRect = CGRectMake(0, 0, 1, 1);
                    iv.image = cached;
                  }
                }
              }
            }

            for (NSString *vk in self.visibleTiles.allKeys) {
              if (![neededViews containsObject:vk]) {
                NSString *ck = self.viewCacheKeys[vk];
                [self.visibleTiles[vk] removeFromSuperview];
                [self.visibleTiles removeObjectForKey:vk];
                [self.viewCacheKeys removeObjectForKey:vk];
                if (ck && ![neededCaches containsObject:ck]) {
                  NSURLSessionDataTask *oldTask = self.inFlightTasks[ck];
                  if (oldTask) {
                    [oldTask cancel];
                    [self.inFlightTasks removeObjectForKey:ck];
                  }
                }
              }
            }

            // Gently pre-warm center parent tile when idle for instant zoom-out previews
            if (self.animMode == 0 && tz > 3 && self.inFlightTasks.count < 8) {
              int ctx = ((int)floor(cx / tilePx) % n + n) % n;
              int cty = (int)floor(cy / tilePx);
              if (cty >= 0 && cty < n) {
                int ptx = ctx >> 1, pty = cty >> 1;
                NSString *pkey = [NSString stringWithFormat:@"%ld:%d:%d:%d", (long)self.styleIndex, tz - 1, ptx, pty];
                if (![self.tileCache objectForKey:pkey] && !self.inFlightTasks[pkey]) {
                  [self fetchTileKey:pkey style:self.styleIndex z:tz - 1 x:ptx y:pty isFallback:NO silent:YES];
                }
              }
            }

            [self updateMarkers];
          }

          - (void)applyLoadedImage:(UIImage *)img forCacheKey:(NSString *)cacheKey {
            for (NSString *vk in self.viewCacheKeys) {
              if ([self.viewCacheKeys[vk] isEqualToString:cacheKey]) {
                UIImageView *iv = self.visibleTiles[vk];
                if (!iv) continue;
                BOOL wasBlank = (iv.image == nil);
                iv.layer.contentsRect = CGRectMake(0, 0, 1, 1);
                if (wasBlank) {
                  iv.alpha = 0.0;
                  iv.image = img;
                  [UIView animateWithDuration:0.10 delay:0 options:UIViewAnimationOptionAllowUserInteraction animations:^{
                    iv.alpha = 1.0;
                  } completion:nil];
                } else {
                  iv.image = img;
                }
              }
            }
          }

          - (void)fetchTileKey:(NSString *)cacheKey style:(NSInteger)style z:(int)z x:(int)x y:(int)y isFallback:(BOOL)isFallback silent:(BOOL)silent {
            if (!isFallback && self.inFlightTasks[cacheKey]) return;
            NSURL *url = [self tileURLForStyle:style z:z x:x y:y];
            if (!url) return;

            __weak typeof(self) weakSelf = self;
            __block NSUInteger tid = 0;
            NSURLSessionDataTask *task = [self.session dataTaskWithURL:url completionHandler:^(NSData *data, NSURLResponse *resp, NSError *err) {
              if (err && err.code == NSURLErrorCancelled) {
                dispatch_async(dispatch_get_main_queue(), ^{
                  __strong typeof(weakSelf) self = weakSelf;
                  NSURLSessionDataTask *cur = self ? self.inFlightTasks[cacheKey] : nil;
                  if (cur && cur.taskIdentifier == tid) {
                    [self.inFlightTasks removeObjectForKey:cacheKey];
                  }
                });
                return;
              }
              NSInteger httpCode = [resp isKindOfClass:[NSHTTPURLResponse class]] ? ((NSHTTPURLResponse *)resp).statusCode : 0;
              UIImage *img = (httpCode == 200 && data.length > 200 && !err) ? [UIImage imageWithData:data] : nil;
              dispatch_async(dispatch_get_main_queue(), ^{
                __strong typeof(weakSelf) self = weakSelf;
                if (!self) return;
                NSURLSessionDataTask *cur = self.inFlightTasks[cacheKey];
                BOOL isCurrent = (cur != nil && cur.taskIdentifier == tid);
                if (img) {
                  if (isCurrent) [self.inFlightTasks removeObjectForKey:cacheKey];
                  [self.tileCache setObject:img forKey:cacheKey];
                  if (!silent) {
                    if (self.onTileError) self.onTileError(nil);
                    [self applyLoadedImage:img forCacheKey:cacheKey];
                  }
                } else if (!isFallback && style == 0 && z <= 18 && self.styleIndex == style) {
                  if (isCurrent) [self.inFlightTasks removeObjectForKey:cacheKey];
                  [self fetchTileKey:cacheKey style:2 z:z x:x y:y isFallback:YES silent:silent];
                } else {
                  if (isCurrent) [self.inFlightTasks removeObjectForKey:cacheKey];
                  if (!silent && self.onTileError) {
                    NSString *m = err ? [NSString stringWithFormat:@"Нет сети (%ld)", (long)err.code]
                              : [NSString stringWithFormat:@"Тайл HTTP %ld", (long)httpCode];
                    self.onTileError(m);
                  }
                }
              });
            }];
            tid = task.taskIdentifier;
            self.inFlightTasks[cacheKey] = task;
            [task resume];
          }

          - (void)animateZoomTo:(double)targetZ anchorPoint:(CGPoint)pt duration:(CFTimeInterval)dur {
            double clamped = fmax(2.0, fmin(19.0, targetZ));
            CLLocationCoordinate2D anchor = [self coordForScreenPoint:pt];
            self.zoomStart = self.zoom;
            self.zoomTarget = clamped;
            self.zoomAnchorLat = anchor.latitude;
            self.zoomAnchorLon = anchor.longitude;
            self.zoomAnchorPt = pt;
            self.zoomStartTs = 0.0;
            self.zoomDuration = dur;
            self.animMode = 2;
            [self ensureDisplayLink];
          }

          - (void)zoomBy:(double)delta {
            double baseZ = (self.animMode == 2) ? self.zoomTarget : self.zoom;
            CGPoint centerPt = CGPointMake(self.bounds.size.width * 0.5, self.bounds.size.height * 0.5);
            [self animateZoomTo:baseZ + delta anchorPoint:centerPt duration:0.20];
          }

          - (void)handlePan:(UIPanGestureRecognizer *)gr {
            if (gr.state == UIGestureRecognizerStateBegan) {
              [self stopAnimations];
              if (self.onInteraction) self.onInteraction();
            } else if (gr.state == UIGestureRecognizerStateChanged) {
              CGPoint tr = [gr translationInView:self];
              [gr setTranslation:CGPointZero inView:self];
              double w = gsWorldSize(self.zoom);
              double cx = fmod(gsLonToX(self.centerLon, self.zoom) - tr.x, w);
              if (cx < 0) cx += w;
              double cy = fmax(0.0, fmin(w, gsLatToY(self.centerLat, self.zoom) - tr.y));
              self.centerLon = gsXToLon(cx, self.zoom);
              self.centerLat = gsYToLat(cy, self.zoom);
              [self reloadTiles];
            } else if (gr.state == UIGestureRecognizerStateEnded) {
              CGPoint vel = [gr velocityInView:self];
              double spd = hypot(vel.x, vel.y);
              if (spd > 85.0) {
                double maxSpd = 3400.0;
                double k = (spd > maxSpd) ? (maxSpd / spd) : 1.0;
                self.panVelX = vel.x * k;
                self.panVelY = vel.y * k;
                self.animMode = 1;
                [self ensureDisplayLink];
              }
            }
          }

          - (void)handlePinch:(UIPinchGestureRecognizer *)gr {
            if (gr.state == UIGestureRecognizerStateBegan) {
              [self stopAnimations];
              if (self.onInteraction) self.onInteraction();
              self.pinchStartZoom = self.zoom;
              CGPoint loc = [gr locationInView:self];
              CLLocationCoordinate2D anchor = [self coordForScreenPoint:loc];
              self.pinchAnchorLat = anchor.latitude;
              self.pinchAnchorLon = anchor.longitude;
            } else if (gr.state == UIGestureRecognizerStateChanged) {
              CGPoint loc = [gr locationInView:self];
              double newZ = fmax(2.0, fmin(19.0, self.pinchStartZoom + log2(fmax(0.1, gr.scale))));
              double w = gsWorldSize(newZ);
              double ax = gsLonToX(self.pinchAnchorLon, newZ);
              double ay = gsLatToY(self.pinchAnchorLat, newZ);
              double cx = fmod(ax - (loc.x - self.bounds.size.width * 0.5), w);
              if (cx < 0) cx += w;
              double cy = fmax(0.0, fmin(w, ay - (loc.y - self.bounds.size.height * 0.5)));
              self.zoom = newZ;
              self.centerLon = gsXToLon(cx, newZ);
              self.centerLat = gsYToLat(cy, newZ);
              [self reloadTiles];
            }
          }

          - (void)handleDoubleTap:(UITapGestureRecognizer *)gr {
            if (self.onInteraction) self.onInteraction();
            CGPoint pt = [gr locationInView:self];
            double baseZ = (self.animMode == 2) ? self.zoomTarget : self.zoom;
            [self animateZoomTo:baseZ + 1.0 anchorPoint:pt duration:0.22];
          }

          - (void)handleTwoFingerTap:(UITapGestureRecognizer *)gr {
            if (self.onInteraction) self.onInteraction();
            CGPoint pt = [gr locationInView:self];
            double baseZ = (self.animMode == 2) ? self.zoomTarget : self.zoom;
            [self animateZoomTo:baseZ - 1.0 anchorPoint:pt duration:0.22];
          }

          - (void)handleTap:(UITapGestureRecognizer *)gr {
            [self stopAnimations];
            if (self.onInteraction) self.onInteraction();
            CGPoint pt = [gr locationInView:self];
            CLLocationCoordinate2D c = [self coordForScreenPoint:pt];
            if (CLLocationCoordinate2DIsValid(c)) {
              self.pinCoord = c;
              [self updateMarkers];
              if (self.onPinChanged) self.onPinChanged(c);
            }
          }

          @end

          // --- Favorites Sheet ---
          @interface GSFavoritesViewController : UITableViewController
          @property (nonatomic, copy) void (^onPick)(double lat, double lon);
          @property (nonatomic, copy) void (^onFavoritesChanged)(void);
          @property (nonatomic, assign) CLLocationCoordinate2D currentCoord;
          @property (nonatomic, strong) NSMutableArray<NSDictionary *> *items;
          @end

          @implementation GSFavoritesViewController

          - (void)viewDidLoad {
            [super viewDidLoad];
            self.title = @"Закладки";
            NSArray *saved = [NSUserDefaults.standardUserDefaults arrayForKey:kFavoritesKey];
            self.items = saved ? [saved mutableCopy] : [NSMutableArray array];
            self.navigationItem.leftBarButtonItem = [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemClose target:self action:@selector(closeTapped)];
            self.navigationItem.rightBarButtonItem = [[UIBarButtonItem alloc] initWithBarButtonSystemItem:UIBarButtonSystemItemAdd target:self action:@selector(addCurrentTapped)];
          }

          - (void)closeTapped { [self dismissViewControllerAnimated:YES completion:nil]; }

          - (void)persist {
            [NSUserDefaults.standardUserDefaults setObject:self.items forKey:kFavoritesKey];
            if (self.onFavoritesChanged) self.onFavoritesChanged();
          }

          - (void)addCurrentTapped {
            UIAlertController *ac = [UIAlertController alertControllerWithTitle:@"Сохранить точку"
                                          message:[NSString stringWithFormat:@"%.6f, %.6f", self.currentCoord.latitude, self.currentCoord.longitude]
                                       preferredStyle:UIAlertControllerStyleAlert];
            [ac addTextFieldWithConfigurationHandler:^(UITextField *tf) {
              tf.placeholder = @"Название (например, Дом / Офис)";
              tf.autocapitalizationType = UITextAutocapitalizationTypeSentences;
            }];
            [ac addAction:[UIAlertAction actionWithTitle:@"Отмена" style:UIAlertActionStyleCancel handler:nil]];
            [ac addAction:[UIAlertAction actionWithTitle:@"Сохранить" style:UIAlertActionStyleDefault handler:^(UIAlertAction *a) {
              NSString *name = [ac.textFields.firstObject.text stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
              if (!name.length) name = [NSString stringWithFormat:@"Точка %lu", (unsigned long)(self.items.count + 1)];
              [self.items insertObject:@{@"name": name, @"lat": @(self.currentCoord.latitude), @"lon": @(self.currentCoord.longitude)} atIndex:0];
              [self persist];
              [self.tableView reloadData];
            }]];
            [self presentViewController:ac animated:YES completion:nil];
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section { return self.items.count; }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
            UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"fav"];
            if (!cell) cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:@"fav"];
            NSDictionary *d = self.items[indexPath.row];
            cell.textLabel.text = d[@"name"];
            cell.textLabel.font = [UIFont systemFontOfSize:16 weight:UIFontWeightSemibold];
            cell.detailTextLabel.text = [NSString stringWithFormat:@"%.6f, %.6f", [d[@"lat"] doubleValue], [d[@"lon"] doubleValue]];
            cell.detailTextLabel.font = [UIFont monospacedDigitSystemFontOfSize:12 weight:UIFontWeightRegular];
            cell.detailTextLabel.textColor = UIColor.secondaryLabelColor;
            cell.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
            return cell;
          }

          - (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
            [tableView deselectRowAtIndexPath:indexPath animated:YES];
            NSDictionary *d = self.items[indexPath.row];
            double lat = [d[@"lat"] doubleValue], lon = [d[@"lon"] doubleValue];
            [self dismissViewControllerAnimated:YES completion:^{
              if (self.onPick) self.onPick(lat, lon);
            }];
          }

          - (UISwipeActionsConfiguration *)tableView:(UITableView *)tableView trailingSwipeActionsConfigurationForRowAtIndexPath:(NSIndexPath *)indexPath {
            UIContextualAction *del = [UIContextualAction contextualActionWithStyle:UIContextualActionStyleDestructive title:@"Удалить" handler:^(UIContextualAction *a, UIView *v, void (^done)(BOOL)) {
              [self.items removeObjectAtIndex:indexPath.row];
              [self persist];
              [tableView deleteRowsAtIndexPaths:@[indexPath] withRowAnimation:UITableViewRowAnimationAutomatic];
              done(YES);
            }];
            return [UISwipeActionsConfiguration configurationWithActions:@[del]];
          }

          @end

          // --- Main Controller ---
          @interface MapViewController () <UISearchBarDelegate, UITableViewDataSource, UITableViewDelegate>
          @property (nonatomic, strong) GSTileMapView *mapView;
          @property (nonatomic, strong) UISearchBar *searchBar;
          @property (nonatomic, strong) UIActivityIndicatorView *searchSpinner;
          @property (nonatomic, strong) UITableView *resultsTable;
          @property (nonatomic, strong) NSArray<NSDictionary *> *searchResults;
          @property (nonatomic, strong) NSURLSessionDataTask *searchTask;
          @property (nonatomic, strong) UILabel *toastLabel;
          @property (nonatomic, strong) UIButton *styleBadge;

          @property (nonatomic, strong) UIView *bottomCard;
          @property (nonatomic, strong) UIScrollView *quickBarScroll;
          @property (nonatomic, strong) UIStackView *quickBarStack;
          @property (nonatomic, strong) NSArray<NSDictionary *> *quickFavorites;

          @property (nonatomic, strong) UIView *statusDot;
          @property (nonatomic, strong) UILabel *statusLabel;
          @property (nonatomic, strong) UIButton *realButton;
          @property (nonatomic, strong) UILabel *coordLabel;
          @property (nonatomic, strong) UISegmentedControl *jitterControl;
          @property (nonatomic, strong) UIButton *altButton;
          @property (nonatomic, strong) UIButton *startButton;
          @property (nonatomic, strong) UIButton *stopButton;

          @property (nonatomic, strong) dispatch_queue_t cliQueue;
          @property (nonatomic, assign) NSUInteger applyGeneration;
          @property (nonatomic, assign) NSInteger jitterFlagSupport; // 0=unknown, 1=yes, -1=no
          @property (nonatomic, strong) NSMutableDictionary<NSString *, NSDictionary *> *searchCache;
          @property (nonatomic, strong) NSMutableArray<NSDictionary *> *recentPlaces;

          @property (nonatomic, assign) CLLocationCoordinate2D selectedCoord;
          @property (nonatomic, assign) double altitudeMeters;
          @property (nonatomic, assign) BOOL cliKnownActive;
          @property (nonatomic, assign) CFAbsoluteTime optimisticUntil;
          @property (nonatomic, assign) BOOL optimisticState;
          @property (nonatomic, strong) NSTimer *pollTimer;
          @end

          @implementation MapViewController

          - (void)viewDidLoad {
            [super viewDidLoad];
            self.view.backgroundColor = UIColor.systemBackgroundColor;
            self.cliQueue = dispatch_queue_create("xyz.regulad.geoshim.cli", DISPATCH_QUEUE_SERIAL);

            NSUserDefaults *ud = NSUserDefaults.standardUserDefaults;
            NSDictionary *savedCache = [ud dictionaryForKey:kSearchCacheKey];
            self.searchCache = savedCache ? [savedCache mutableCopy] : [NSMutableDictionary dictionary];
            NSArray *savedRecent = [ud arrayForKey:kRecentPlacesKey];
            self.recentPlaces = savedRecent ? [savedRecent mutableCopy] : [NSMutableArray array];

            self.altitudeMeters = [ud objectForKey:kAltitudeKey] ? [ud doubleForKey:kAltitudeKey] : 20.0;
            self.selectedCoord = CLLocationCoordinate2DMake(40.7128, -74.0060);

            BOOL act = NO;
            CLLocationCoordinate2D tc;
            if (gsReadTargetNotify(&act, &tc) && act) {
              self.selectedCoord = tc;
              self.cliKnownActive = YES;
            } else if ([ud objectForKey:kLastLatKey] && [ud objectForKey:kLastLonKey]) {
              self.selectedCoord = CLLocationCoordinate2DMake([ud doubleForKey:kLastLatKey], [ud doubleForKey:kLastLonKey]);
            } else {
              CLLocationCoordinate2D rc;
              if (gsReadRealCoord(&rc)) self.selectedCoord = rc;
            }

            [self setupMap];
            [self setupTopSearch];
            [self setupSideButtons];
            [self setupBottomCard];
            [self setupQuickFavoritesBar];
            [self.view bringSubviewToFront:self.resultsTable];
            [self.view bringSubviewToFront:self.toastLabel];

            [self movePinTo:self.selectedCoord centerMap:YES zoom:15.0];
            [self reloadQuickFavoritesBar];
            [self refreshStatus];
            [self syncInitialCLIStatus];

            __weak typeof(self) weakSelf = self;
            self.pollTimer = [NSTimer scheduledTimerWithTimeInterval:1.5 repeats:YES block:^(NSTimer *t) {
              (void)t;
              [weakSelf refreshStatus];
            }];
          }

          - (void)dealloc { [self.pollTimer invalidate]; }

          - (void)syncInitialCLIStatus {
            dispatch_async(self.cliQueue, ^{
              NSString *out = nil;
              int rc = gsRunCLI(@[@"status"], &out);

              // Probe --jitter flag support once so applySpoofTapped never wastes a double spawn
              NSString *helpOut = nil;
              gsRunCLI(@[@"--help"], &helpOut);
              if (!helpOut.length || [helpOut rangeOfString:@"jitter"].location == NSNotFound) {
                NSString *helpStart = nil;
                gsRunCLI(@[@"start", @"--help"], &helpStart);
                if (helpStart.length) helpOut = [NSString stringWithFormat:@"%@\n%@", helpOut ?: @"", helpStart];
              }
              NSInteger jCap = 0;
              if ([helpOut rangeOfString:@"--jitter"].location != NSNotFound) {
                jCap = 1;
              } else if (helpOut.length > 0 && ([helpOut rangeOfString:@"start"].location != NSNotFound || [helpOut rangeOfString:@"-x"].location != NSNotFound)) {
                jCap = -1;
              }

              BOOL en = NO;
              CLLocationCoordinate2D parsedCoord = CLLocationCoordinate2DMake(0, 0);
              BOOL hasCoord = NO;
              if (rc == 0 && out.length) {
                for (NSString *rawLine in [out componentsSeparatedByString:@"\n"]) {
                  NSString *line = [rawLine stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceCharacterSet];
                  if ([line hasPrefix:@"state:"] && [line rangeOfString:@"enabled"].location != NSNotFound) en = YES;
                  if ([line hasPrefix:@"enabled:"] && [line rangeOfString:@"yes"].location != NSNotFound) en = YES;
                  if ([line hasPrefix:@"coordinate:"]) hasCoord = gsParseCoordinateText(line, &parsedCoord);
                }
              }
              dispatch_async(dispatch_get_main_queue(), ^{
                if (jCap != 0) self.jitterFlagSupport = jCap;
                if (rc == 0 && out.length) {
                  self.cliKnownActive = en;
                  if (hasCoord) {
                    [self movePinTo:parsedCoord centerMap:YES zoom:15.0];
                  }
                  [self refreshStatus];
                }
              });
            });
          }

          - (void)showToast:(NSString *)text color:(UIColor *)color {
            self.toastLabel.text = [NSString stringWithFormat:@"  %@  ", text];
            self.toastLabel.backgroundColor = [color colorWithAlphaComponent:0.93];
            self.toastLabel.hidden = NO;
            self.toastLabel.alpha = 1.0;
            [NSObject cancelPreviousPerformRequestsWithTarget:self selector:@selector(hideToast) object:nil];
            [self performSelector:@selector(hideToast) withObject:nil afterDelay:2.6];
          }

          - (void)hideToast {
            [UIView animateWithDuration:0.22 animations:^{
              self.toastLabel.alpha = 0.0;
            } completion:^(BOOL finished) {
              (void)finished;
              if (self.toastLabel.alpha < 0.05) self.toastLabel.hidden = YES;
            }];
          }

