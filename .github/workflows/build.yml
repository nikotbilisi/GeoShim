name: Build GeoShim RootHide

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: geoshim-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Patch package, logging and XPC read-only probe v2
        run: |
          python3 - << 'PY'
          import re, plistlib, shutil

          with open("GeoShim.plist", "wb") as f:
              plistlib.dump({"Filter": {"Executables": ["locationd"]}}, f)

          tx = open("Tweak.x").read()
          tx = re.sub(r'#\s*(?:import|include)\s*[<"]libSandy\.h[>"]', '', tx)
          with open("GSConfig.m", "a") as f:
              f.write('\nint libSandy_applyProfile(const char *profileName) { (void)profileName; return 0; }\n')

          with open("GSCommon.h", "a") as f:
              f.write(r'''
          #ifndef GSLOG_DIAG_OVERRIDE
          #define GSLOG_DIAG_OVERRIDE
          #import <Foundation/Foundation.h>
          #import <os/log.h>
          #include <stdio.h>
          static inline void GSLogToOSLog(NSString *m) {
              static os_log_t gslog;
              static dispatch_once_t gs_once;
              dispatch_once(&gs_once, ^{ gslog = os_log_create("xyz.regulad.geoshim", "tweak"); });
              os_log_fault(gslog, "%{public}s", m.UTF8String);
          }
          #undef GSLog
          #define GSLog(fmt, ...) do { NSString *_gsm = [NSString stringWithFormat:@"[GeoShim] " fmt, ##__VA_ARGS__]; NSLog(@"%@", _gsm); GSLogToOSLog(_gsm); } while (0)
          #endif
          ''')

          old_anchor = "static IMP gEncodeWithCoderOrig = NULL;"
          diag_block = old_anchor + r'''

          // --- GeoShim diagnostics + read-only XPC probe v2 ---
          #include <notify.h>
          #include <dispatch/dispatch.h>
          #include <stdatomic.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <string.h>
          #include <math.h>
          #include <dlfcn.h>
          #include <substrate.h>
          #if __has_include(<xpc/xpc.h>)
          #include <xpc/xpc.h>
          #else
          typedef id xpc_object_t;
          typedef xpc_object_t xpc_connection_t;
          typedef const struct _xpc_type_s *xpc_type_t;
          typedef void (^xpc_handler_t)(xpc_object_t object);
          extern const struct _xpc_type_s _xpc_type_dictionary;
          extern const struct _xpc_type_s _xpc_type_array;
          extern const struct _xpc_type_s _xpc_type_data;
          extern const struct _xpc_type_s _xpc_type_double;
          extern const struct _xpc_type_s _xpc_type_string;
          #define XPC_TYPE_DICTIONARY (&_xpc_type_dictionary)
          #define XPC_TYPE_ARRAY (&_xpc_type_array)
          #define XPC_TYPE_DATA (&_xpc_type_data)
          #define XPC_TYPE_DOUBLE (&_xpc_type_double)
          #define XPC_TYPE_STRING (&_xpc_type_string)
          extern xpc_type_t xpc_get_type(xpc_object_t obj);
          extern bool xpc_dictionary_apply(xpc_object_t xdict, bool (^applier)(const char *key, xpc_object_t value));
          extern bool xpc_array_apply(xpc_object_t xarray, bool (^applier)(size_t index, xpc_object_t value));
          extern const char *xpc_dictionary_get_string(xpc_object_t xdict, const char *key);
          extern const char *xpc_string_get_string_ptr(xpc_object_t xstring);
          extern const void *xpc_data_get_bytes_ptr(xpc_object_t xdata);
          extern size_t xpc_data_get_length(xpc_object_t xdata);
          extern double xpc_double_get_value(xpc_object_t xdouble);
          extern void xpc_connection_send_message(xpc_connection_t conn, xpc_object_t msg);
          extern void xpc_connection_send_message_with_reply(xpc_connection_t conn, xpc_object_t msg, dispatch_queue_t q, xpc_handler_t h);
          #endif

          static _Atomic uint32_t gDiagEnter = 0;
          static _Atomic uint32_t gDiagSpoof = 0;
          static _Atomic uint32_t gDiagThrow = 0;

          static double gLastRealLat = 0.0, gLastRealLon = 0.0;
          static _Atomic uint32_t gHasRealCoord = 0;
          static double gLastFakeLat = 0.0, gLastFakeLon = 0.0;
          static _Atomic uint32_t gHasFakeCoord = 0;

          static _Atomic uint32_t gXpcMsgCalls = 0;
          static _Atomic uint32_t gXpcNotifCalls = 0;
          static _Atomic uint32_t gXpcHookedMsg = 0;
          static _Atomic uint32_t gXpcHookedNotif = 0;
          static _Atomic uint32_t gXpcHookedReply = 0;
          static _Atomic uint32_t gXpcSawData = 0;
          static _Atomic uint32_t gXpcSawArr = 0;
          static _Atomic uint32_t gXpcDblKey = 0;

          static _Atomic uint32_t gXpcHits = 0;
          static _Atomic uint32_t gXpcFakeHits = 0;
          static _Atomic uint32_t gXpcBlobLen = 0;
          static _Atomic uint32_t gXpcLatOff = 0xFFF;
          static _Atomic uint32_t gXpcLonOff = 0xFFF;
          static _Atomic uint32_t gXpcFnMask = 0;
          static _Atomic uint32_t gXpcFlags = 0; // bit0=bplist, bit1=big_endian
          static _Atomic uint64_t gXpcKeyA = 0, gXpcKeyB = 0;
          static _Atomic uint64_t gXpcMsgA = 0, gXpcMsgB = 0;

          static __thread int gInXpcHook = 0;

          #define GS_DIAG_NOTIFY  "xyz.regulad.geoshim.diag"
          #define GS_REAL_NOTIFY  "xyz.regulad.geoshim.real"
          #define GS_XPC_NOTIFY   "xyz.regulad.geoshim.xpc"
          #define GS_XPC2_NOTIFY  "xyz.regulad.geoshim.xpc2"
          #define GS_KEYA_NOTIFY  "xyz.regulad.geoshim.keya"
          #define GS_KEYB_NOTIFY  "xyz.regulad.geoshim.keyb"
          #define GS_MSGA_NOTIFY  "xyz.regulad.geoshim.msga"
          #define GS_MSGB_NOTIFY  "xyz.regulad.geoshim.msgb"

          static uint64_t gs_pack8(const char *s, size_t offset) {
              uint64_t v = 0;
              if (!s) return 0;
              size_t n = strlen(s);
              for (size_t i = 0; i < 8 && (offset + i) < n; i++) {
                  v |= ((uint64_t)(uint8_t)s[offset + i]) << (i * 8);
              }
              return v;
          }

          static void gs_set_state(const char *name, int *tok, uint64_t val) {
              if (*tok == -1) notify_register_check(name, tok);
              if (*tok != -1) notify_set_state(*tok, val);
          }

          static void gs_diag_publish(void) {
              static int tok = -1, rtok = -1;
              uint64_t v = (1ULL << 63)
                         | (uint64_t)(atomic_load(&gDiagEnter) & 0xFFFF)
                         | ((uint64_t)(atomic_load(&gDiagSpoof) & 0xFFFF) << 16)
                         | ((uint64_t)(atomic_load(&gDiagThrow) & 0xFFFF) << 32);
              gs_set_state(GS_DIAG_NOTIFY, &tok, v);
              if (atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) {
                  int32_t ilat = (int32_t)llround(gLastRealLat * 10000.0);
                  int32_t ilon = (int32_t)llround(gLastRealLon * 10000.0);
                  uint64_t rv = ((uint64_t)(uint32_t)ilat) | (((uint64_t)(uint32_t)ilon) << 32);
                  gs_set_state(GS_REAL_NOTIFY, &rtok, rv);
              }
          }

          static void gs_xpc_publish(void) {
              static int tok1 = -1, tok2 = -1, tka = -1, tkb = -1, tma = -1, tmb = -1;
              uint32_t hits = atomic_load(&gXpcHits);
              uint64_t v1 = (hits ? (1ULL << 63) : 0ULL)
                          | (uint64_t)(hits & 0xFFFF)
                          | ((uint64_t)(atomic_load(&gXpcBlobLen) & 0xFFFF) << 16)
                          | ((uint64_t)(atomic_load(&gXpcLatOff) & 0xFFF) << 32)
                          | ((uint64_t)(atomic_load(&gXpcLonOff) & 0xFFF) << 44)
                          | ((uint64_t)(atomic_load(&gXpcFnMask) & 0x7) << 56)
                          | ((uint64_t)(atomic_load(&gXpcFlags) & 0x3) << 59);
              gs_set_state(GS_XPC_NOTIFY, &tok1, v1);

              uint64_t v2 = (1ULL << 63)
                          | ((uint64_t)(atomic_load(&gXpcHookedMsg) & 1) << 62)
                          | ((uint64_t)(atomic_load(&gXpcHookedNotif) & 1) << 61)
                          | ((uint64_t)(atomic_load(&gHasRealCoord) & 1) << 60)
                          | ((uint64_t)(atomic_load(&gXpcHookedReply) & 1) << 55)
                          | ((uint64_t)(atomic_load(&gXpcDblKey) & 1) << 54)
                          | ((uint64_t)(atomic_load(&gXpcSawArr) & 1) << 53)
                          | ((uint64_t)(atomic_load(&gXpcSawData) & 1) << 52)
                          | ((uint64_t)(atomic_load(&gXpcFakeHits) & 0xFFF) << 40)
                          | ((uint64_t)(atomic_load(&gXpcNotifCalls) & 0xFFFFF) << 20)
                          | (uint64_t)(atomic_load(&gXpcMsgCalls) & 0xFFFFF);
              gs_set_state(GS_XPC2_NOTIFY, &tok2, v2);

              if (hits) {
                  gs_set_state(GS_KEYA_NOTIFY, &tka, atomic_load(&gXpcKeyA));
                  gs_set_state(GS_KEYB_NOTIFY, &tkb, atomic_load(&gXpcKeyB));
                  gs_set_state(GS_MSGA_NOTIFY, &tma, atomic_load(&gXpcMsgA));
                  gs_set_state(GS_MSGB_NOTIFY, &tmb, atomic_load(&gXpcMsgB));
              }
          }

          static void gs_diag_inc(_Atomic uint32_t *c) { atomic_fetch_add(c, 1); gs_diag_publish(); }

          static inline double gs_bswap_double(uint64_t raw) {
              uint64_t sw = __builtin_bswap64(raw);
              double d;
              memcpy(&d, &sw, 8);
              return d;
          }

          static bool gs_find_coord_pair(const uint8_t *p, size_t lim, double tlat, double tlon,
                                         uint32_t *outLatOff, uint32_t *outLonOff, uint32_t *outBE) {
              if (fabs(tlat) < 0.1 && fabs(tlon) < 0.1) return false;
              uint32_t latOff = 0xFFF, lonOff = 0xFFF, isBE = 0;
              for (size_t off = 0; off + 8 <= lim; off++) {
                  double d;
                  memcpy(&d, p + off, 8);
                  if (fabs(d - tlat) < 0.05) { latOff = (uint32_t)off; isBE = 0; break; }
                  uint64_t u;
                  memcpy(&u, p + off, 8);
                  double b = gs_bswap_double(u);
                  if (fabs(b - tlat) < 0.05) { latOff = (uint32_t)off; isBE = 1; break; }
              }
              if (latOff == 0xFFF) return false;
              for (size_t off = 0; off + 8 <= lim; off++) {
                  if (off == latOff) continue;
                  if (!isBE) {
                      double d;
                      memcpy(&d, p + off, 8);
                      if (fabs(d - tlon) < 0.05) { lonOff = (uint32_t)off; break; }
                  } else {
                      uint64_t u;
                      memcpy(&u, p + off, 8);
                      if (fabs(gs_bswap_double(u) - tlon) < 0.05) { lonOff = (uint32_t)off; break; }
                  }
              }
              if (lonOff == 0xFFF) return false;
              if (outLatOff) *outLatOff = latOff;
              if (outLonOff) *outLonOff = lonOff;
              if (outBE) *outBE = isBE;
              return true;
          }

          static void gs_scan_xpc_blob(const uint8_t *p, size_t len, uint32_t fnBit, const char *mname, const char *kname) {
              if (!p || len < 16) return;
              atomic_store(&gXpcSawData, 1);
              size_t lim = len > 8192 ? 8192 : len;
              if (atomic_load_explicit(&gHasFakeCoord, memory_order_acquire)) {
                  if (gs_find_coord_pair(p, lim, gLastFakeLat, gLastFakeLon, NULL, NULL, NULL)) {
                      atomic_fetch_add(&gXpcFakeHits, 1);
                  }
              }
              if (atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) {
                  uint32_t latOff = 0xFFF, lonOff = 0xFFF, isBE = 0;
                  if (gs_find_coord_pair(p, lim, gLastRealLat, gLastRealLon, &latOff, &lonOff, &isBE)) {
                      uint32_t isBP = (len >= 6 && memcmp(p, "bplist", 6) == 0) ? 1 : 0;
                      atomic_fetch_add(&gXpcHits, 1);
                      atomic_store(&gXpcBlobLen, (uint32_t)(len & 0xFFFF));
                      atomic_store(&gXpcLatOff, latOff > 0xFFE ? 0xFFE : latOff);
                      atomic_store(&gXpcLonOff, lonOff > 0xFFE ? 0xFFE : lonOff);
                      atomic_fetch_or(&gXpcFnMask, fnBit);
                      atomic_store(&gXpcFlags, (isBP ? 1u : 0u) | (isBE ? 2u : 0u));
                      atomic_store(&gXpcKeyA, gs_pack8(kname, 0));
                      atomic_store(&gXpcKeyB, gs_pack8(kname, 8));
                      atomic_store(&gXpcMsgA, gs_pack8(mname, 0));
                      atomic_store(&gXpcMsgB, gs_pack8(mname, 8));
                      gs_xpc_publish();
                  }
              }
          }

          static void gs_scan_xpc_val(xpc_object_t val, int depth, uint32_t fnBit, const char *mname, const char *kname) {
              if (!val || depth > 4) return;
              xpc_type_t t = xpc_get_type(val);
              if (t == XPC_TYPE_DATA) {
                  gs_scan_xpc_blob((const uint8_t *)xpc_data_get_bytes_ptr(val), xpc_data_get_length(val), fnBit, mname, kname);
              } else if (t == XPC_TYPE_DICTIONARY) {
                  xpc_dictionary_apply(val, ^bool(const char *key, xpc_object_t v) {
                      gs_scan_xpc_val(v, depth + 1, fnBit, mname, key ? key : kname);
                      return true;
                  });
              } else if (t == XPC_TYPE_ARRAY) {
                  atomic_store(&gXpcSawArr, 1);
                  xpc_array_apply(val, ^bool(size_t idx, xpc_object_t v) {
                      (void)idx;
                      gs_scan_xpc_val(v, depth + 1, fnBit, mname, kname);
                      return true;
                  });
              } else if (t == XPC_TYPE_DOUBLE && atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) {
                  double d = xpc_double_get_value(val);
                  if (fabs(gLastRealLat) > 0.1 && fabs(d - gLastRealLat) < 0.05) {
                      atomic_store(&gXpcDblKey, 1);
                  }
              }
          }

          static void gs_scan_xpc_top(xpc_object_t msg, uint32_t fnBit) {
              if (!msg || xpc_get_type(msg) != XPC_TYPE_DICTIONARY) return;
              const char *mname = xpc_dictionary_get_string(msg, "kCLConnectionMessageNameKey");
              __block const char *fallbackName = NULL;
              if (!mname) {
                  xpc_dictionary_apply(msg, ^bool(const char *k, xpc_object_t v) {
                      (void)k;
                      if (v && xpc_get_type(v) == XPC_TYPE_STRING) {
                          const char *s = xpc_string_get_string_ptr(v);
                          if (s && s[0]) { fallbackName = s; return false; }
                      }
                      return true;
                  });
                  mname = fallbackName;
              }
              gs_scan_xpc_val(msg, 0, fnBit, mname ? mname : "", "");
          }

          static void (*gOrigXpcSendMsg)(xpc_connection_t, xpc_object_t) = NULL;
          static void (*gOrigXpcSendNotif)(xpc_connection_t, xpc_object_t) = NULL;
          static void (*gOrigXpcSendReply)(xpc_connection_t, xpc_object_t, dispatch_queue_t, xpc_handler_t) = NULL;

          static void gs_xpc_send_msg(xpc_connection_t conn, xpc_object_t msg) {
              if (!gInXpcHook) {
                  gInXpcHook = 1;
                  uint32_t n = atomic_fetch_add(&gXpcMsgCalls, 1) + 1;
                  gs_scan_xpc_top(msg, 1);
                  if ((n & 31) == 1) gs_xpc_publish();
                  gInXpcHook = 0;
              }
              if (gOrigXpcSendMsg) gOrigXpcSendMsg(conn, msg);
          }

          static void gs_xpc_send_notif(xpc_connection_t conn, xpc_object_t msg) {
              if (!gInXpcHook) {
                  gInXpcHook = 1;
                  uint32_t n = atomic_fetch_add(&gXpcNotifCalls, 1) + 1;
                  gs_scan_xpc_top(msg, 2);
                  if ((n & 31) == 1) gs_xpc_publish();
                  gInXpcHook = 0;
              }
              if (gOrigXpcSendNotif) gOrigXpcSendNotif(conn, msg);
          }

          static void gs_xpc_send_reply(xpc_connection_t conn, xpc_object_t msg, dispatch_queue_t q, xpc_handler_t h) {
              if (!gInXpcHook) {
                  gInXpcHook = 1;
                  gs_scan_xpc_top(msg, 4);
                  gInXpcHook = 0;
              }
              if (gOrigXpcSendReply) gOrigXpcSendReply(conn, msg, q, h);
          }

          __attribute__((constructor)) static void gs_diag_init(void) {
              gInXpcHook = 1;
              gs_diag_publish();
              MSHookFunction((void *)xpc_connection_send_message, (void *)gs_xpc_send_msg, (void **)&gOrigXpcSendMsg);
              if (gOrigXpcSendMsg) atomic_store(&gXpcHookedMsg, 1);
              void *notifSym = dlsym(RTLD_DEFAULT, "xpc_connection_send_notification");
              if (notifSym) {
                  MSHookFunction(notifSym, (void *)gs_xpc_send_notif, (void **)&gOrigXpcSendNotif);
                  if (gOrigXpcSendNotif) atomic_store(&gXpcHookedNotif, 1);
              }
              MSHookFunction((void *)xpc_connection_send_message_with_reply, (void *)gs_xpc_send_reply, (void **)&gOrigXpcSendReply);
              if (gOrigXpcSendReply) atomic_store(&gXpcHookedReply, 1);
              gs_xpc_publish();
              gInXpcHook = 0;
          }'''
          assert tx.count(old_anchor) == 1
          tx = tx.replace(old_anchor, diag_block, 1)

          old_fn = '''static void gs_encodeWithCoder(id self, SEL _cmd, NSCoder *coder) {
              @try {
                  GSLocationFactory *factory = [GSLocationFactory shared];
                  if (factory.active && [self isKindOfClass:[CLLocation class]]) {
                      CLLocation *real = (CLLocation *)self;

                      // Only rewrite plausible position fixes. Region/visit archiving and
                      // other internal round-trips of a CLLocation with an invalid
                      // coordinate are left alone.
                      if (CLLocationCoordinate2DIsValid(real.coordinate)) {
                          [factory noteRealLocation:real];
                          CLLocation *fake = [factory spoofedLocationFromReal:real];
                          if (fake && gEncodeWithCoderOrig) {
                              if (GEOSHIM_DEBUG_BUILD) {
                                  GSLog(@"locationd: encode %f,%f -> %f,%f",
                                        real.coordinate.latitude, real.coordinate.longitude,
                                        fake.coordinate.latitude, fake.coordinate.longitude);
                              }
                              ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(fake, _cmd, coder);
                              return;
                          }
                      }
                  }
              } @catch (NSException *e) {
                  GSLog(@"locationd: encodeWithCoder substitution failed: %@", e);
              }

              if (gEncodeWithCoderOrig) {
                  ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(self, _cmd, coder);
              }
          }'''

          new_fn = '''static void gs_encodeWithCoder(id self, SEL _cmd, NSCoder *coder) {
              gs_diag_inc(&gDiagEnter);
              @try {
                  GSLocationFactory *factory = [GSLocationFactory shared];
                  if (factory.active && [self isKindOfClass:[CLLocation class]]) {
                      CLLocation *real = (CLLocation *)self;

                      // Only rewrite plausible position fixes. Region/visit archiving and
                      // other internal round-trips of a CLLocation with an invalid
                      // coordinate are left alone.
                      if (CLLocationCoordinate2DIsValid(real.coordinate)) {
                          if (fabs(real.coordinate.latitude) > 0.1 || fabs(real.coordinate.longitude) > 0.1) {
                              gLastRealLat = real.coordinate.latitude;
                              gLastRealLon = real.coordinate.longitude;
                              atomic_store_explicit(&gHasRealCoord, 1, memory_order_release);
                          }
                          [factory noteRealLocation:real];
                          CLLocation *fake = [factory spoofedLocationFromReal:real];
                          if (fake && gEncodeWithCoderOrig) {
                              gLastFakeLat = fake.coordinate.latitude;
                              gLastFakeLon = fake.coordinate.longitude;
                              atomic_store_explicit(&gHasFakeCoord, 1, memory_order_release);
                              gs_diag_inc(&gDiagSpoof);
                              if (GEOSHIM_DEBUG_BUILD) {
                                  GSLog(@"locationd: encode %f,%f -> %f,%f",
                                        real.coordinate.latitude, real.coordinate.longitude,
                                        fake.coordinate.latitude, fake.coordinate.longitude);
                              }
                              ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(fake, _cmd, coder);
                              return;
                          }
                      }
                  }
              } @catch (NSException *e) {
                  gs_diag_inc(&gDiagThrow);
                  GSLog(@"locationd: encodeWithCoder substitution failed: %@", e);
              }

              if (gEncodeWithCoderOrig) {
                  ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(self, _cmd, coder);
              }
          }'''
          assert tx.count(old_fn) == 1
          tx = tx.replace(old_fn, new_fn, 1)
          open("Tweak.x", "w").write(tx)

          m = open("cli/main.m").read()
          old_json_anchor = "static int commandStatusJSON(void) {"
          diag_fn = '''static void gs_unpack16(const char *tA, const char *tB, char out[17]) {
              memset(out, 0, 17);
              uint64_t a = 0, b = 0; int t = -1;
              if (notify_register_check(tA, &t) == NOTIFY_STATUS_OK) { notify_get_state(t, &a); notify_cancel(t); }
              if (notify_register_check(tB, &t) == NOTIFY_STATUS_OK) { notify_get_state(t, &b); notify_cancel(t); }
              memcpy(out, &a, 8); memcpy(out + 8, &b, 8);
          }

          static void printEncodeDiag(void) {
              int tok = -1;
              if (notify_register_check("xyz.regulad.geoshim.diag", &tok) == NOTIFY_STATUS_OK) {
                  uint64_t v = 0;
                  notify_get_state(tok, &v);
                  notify_cancel(tok);
                  printf("  encode hook: diag_alive=%u calls=%llu spoofed=%llu threw=%llu\\n",
                         (unsigned)((v >> 63) & 1),
                         (unsigned long long)(v & 0xFFFF),
                         (unsigned long long)((v >> 16) & 0xFFFF),
                         (unsigned long long)((v >> 32) & 0xFFFF));
              }
              int rt = -1;
              if (notify_register_check("xyz.regulad.geoshim.real", &rt) == NOTIFY_STATUS_OK) {
                  uint64_t rv = 0;
                  notify_get_state(rt, &rv);
                  notify_cancel(rt);
                  int32_t ilat = (int32_t)(uint32_t)(rv & 0xFFFFFFFFULL);
                  int32_t ilon = (int32_t)(uint32_t)((rv >> 32) & 0xFFFFFFFFULL);
                  printf("  real coord:  %.4f, %.4f\\n", ilat / 10000.0, ilon / 10000.0);
              }
              int t2 = -1;
              if (notify_register_check("xyz.regulad.geoshim.xpc2", &t2) == NOTIFY_STATUS_OK) {
                  uint64_t v2 = 0;
                  notify_get_state(t2, &v2);
                  notify_cancel(t2);
                  printf("  xpc probe:   alive=%u hooks=%u/%u/%u real=%u data=%u arr=%u dbl=%u fake_hits=%llu msg=%llu notif=%llu\\n",
                         (unsigned)((v2 >> 63) & 1),
                         (unsigned)((v2 >> 62) & 1),
                         (unsigned)((v2 >> 61) & 1),
                         (unsigned)((v2 >> 55) & 1),
                         (unsigned)((v2 >> 60) & 1),
                         (unsigned)((v2 >> 52) & 1),
                         (unsigned)((v2 >> 53) & 1),
                         (unsigned)((v2 >> 54) & 1),
                         (unsigned long long)((v2 >> 40) & 0xFFF),
                         (unsigned long long)(v2 & 0xFFFFF),
                         (unsigned long long)((v2 >> 20) & 0xFFFFF));
              }
              int t1 = -1;
              if (notify_register_check("xyz.regulad.geoshim.xpc", &t1) == NOTIFY_STATUS_OK) {
                  uint64_t v1 = 0;
                  notify_get_state(t1, &v1);
                  notify_cancel(t1);
                  char kname[17], mname[17];
                  gs_unpack16("xyz.regulad.geoshim.keya", "xyz.regulad.geoshim.keyb", kname);
                  gs_unpack16("xyz.regulad.geoshim.msga", "xyz.regulad.geoshim.msgb", mname);
                  printf("  xpc match:   hits=%llu fn=%u bplist=%u be=%u blob_len=%llu lat_off=%llu lon_off=%llu key=[%s] msg=[%s]\\n",
                         (unsigned long long)(v1 & 0xFFFF),
                         (unsigned)((v1 >> 56) & 0x7),
                         (unsigned)((v1 >> 59) & 1),
                         (unsigned)((v1 >> 60) & 1),
                         (unsigned long long)((v1 >> 16) & 0xFFFF),
                         (unsigned long long)((v1 >> 32) & 0xFFF),
                         (unsigned long long)((v1 >> 44) & 0xFFF),
                         kname, mname);
              }
          }

          ''' + old_json_anchor
          assert m.count(old_json_anchor) == 1
          m = m.replace(old_json_anchor, diag_fn, 1)

          old_visit = '''        printf("  visit hook:      %s\\n", (st & GS_STATUS_VISIT_HOOK) ? "installed" : "missing");'''
          new_visit = old_visit + '''
                  printEncodeDiag();'''
          assert m.count(old_visit) == 1
          m = m.replace(old_visit, new_visit, 1)
          open("cli/main.m", "w").write(m)

          mk = open("Makefile").read()
          mk = re.sub(r'(?m)^(\s*\w+_LIBRARIES\s*=.*)$',
                      lambda mm: re.sub(r'\bsandy\b', '', mm.group(1)), mk)
          mk = re.sub(r'(?m)^\s*SUBPROJECTS\s*\+=\s*prefs\s*\n', '', mk)
          open("Makefile", "w").write(mk)

          ctl = open("control").read()
          ctl = re.sub(r'(?m)^Depends:.*$', 'Depends: ellekit', ctl)
          open("control", "w").write(ctl)

          shutil.rmtree("layout/Library/PreferenceLoader", ignore_errors=True)

          assert plistlib.load(open("GeoShim.plist", "rb")) == {"Filter": {"Executables": ["locationd"]}}
          assert "gs_find_coord_pair" in open("Tweak.x").read()
          assert "real coord:" in open("cli/main.m").read()
          print("patch ok")
          PY

      - name: Setup RootHide Theos (macOS + Xcode)
        run: |
          brew install ldid dpkg xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Build .deb (debug build)
        run: |
          export THEOS="$HOME/theos"
          make package ARCHS=arm64e

      - name: Verify ABI, package, diagnostics
        run: |
          python3 - << 'PY'
          import glob, os, struct, sys
          cands = []
          for pat in ("**/GeoShim.dylib", "**/geoshim"):
              cands += glob.glob(os.path.join(".theos/obj", pat), recursive=True)
          files = [p for p in cands if os.path.isfile(p)]
          if not files:
              sys.exit("no built binaries found")
          bad = []
          for p in files:
              magic, cputype, subtype = struct.unpack("<III", open(p, "rb").read(12))
              print(f"{p}: cputype=0x{cputype:08x} cpusubtype=0x{subtype:08x}")
              if cputype != 0x0100000C or not (subtype & 0x80000000):
                  bad.append(p)
          if bad:
              sys.exit("old arm64e ABI: " + ", ".join(bad))
          print("OK: arm64e ptrauth ABI")
          PY
          DEB=$(ls packages/*.deb | head -n 1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Package Version Architecture Depends
          [ "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64e" ] || { echo "bad package arch"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E 'GeoShim\.dylib$|/geoshim$'
          rm -rf /tmp/debx && dpkg-deb -x "$DEB" /tmp/debx
          strings /tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.dylib | grep -q "regulad.geoshim.keya" || { echo "xpc probe v2 missing in dylib"; exit 1; }
          strings /tmp/debx/usr/local/bin/geoshim | grep -q "real coord:" || { echo "xpc v2 output missing in cli"; exit 1; }
          python3 -c 'import plistlib; p=plistlib.load(open("/tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.plist","rb")); assert p=={"Filter":{"Executables":["locationd"]}}, p; print("filter ok")'

      - name: Save .deb file
        uses: actions/upload-artifact@v4
        with:
          name: geoshim-deb-${{ matrix.os }}
          path: packages/*.deb
          if-no-files-found: error

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: geoshim-deb-*
          merge-multiple: true
          path: dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          DEB=$(ls dist/*.deb 2>/dev/null | head -n 1)
          if [ -z "$DEB" ]; then echo "no .deb produced"; exit 1; fi
          cp "$DEB" dist/geoshim-latest.deb
          gh release view latest-build >/dev/null 2>&1 || \
            gh release create latest-build --title "GeoShim latest build" --notes "Automated build ${GITHUB_SHA}"
          gh release upload latest-build dist/geoshim-latest.deb --clobber
