          static NSString *gsJBRootPath(void) {
            NSString *bundle = NSBundle.mainBundle.bundlePath;
            NSString *appsDir = [bundle stringByDeletingLastPathComponent];
            NSString *root = [appsDir stringByDeletingLastPathComponent];
            if (root.length > 1) return root;
            return @"";
          }

          static NSString *gsCLIPath(void) {
            NSString *root = gsJBRootPath();
            NSArray<NSString *> *cands = @[
              [root stringByAppendingPathComponent:@"usr/local/bin/geoshim"],
              @"/var/jb/usr/local/bin/geoshim",
              @"/usr/local/bin/geoshim"
            ];
            for (NSString *p in cands) {
              if (access(p.fileSystemRepresentation, X_OK) == 0) return p;
            }
            return cands.firstObject;
          }

          static int gsRunCLI(NSArray<NSString *> *args, NSString **outText) {
            NSString *cli = gsCLIPath();
            if (!cli || access(cli.fileSystemRepresentation, X_OK) != 0) {
              if (outText) *outText = [NSString stringWithFormat:@"Не найден бинарник geoshim: %@", cli ?: @"(nil)"];
              return -1;
            }

            int pipefd[2] = {-1, -1};
            if (pipe(pipefd) != 0) {
              if (outText) *outText = [NSString stringWithFormat:@"pipe() error: %s", strerror(errno)];
              return -2;
            }

            posix_spawn_file_actions_t actions;
            posix_spawn_file_actions_init(&actions);
            posix_spawn_file_actions_addclose(&actions, pipefd[0]);
            posix_spawn_file_actions_adddup2(&actions, pipefd[1], STDOUT_FILENO);
            posix_spawn_file_actions_adddup2(&actions, pipefd[1], STDERR_FILENO);
            posix_spawn_file_actions_addclose(&actions, pipefd[1]);

            NSUInteger count = args.count + 1;
            char **argv = (char **)calloc(count + 1, sizeof(char *));
            argv[0] = strdup("geoshim");
            for (NSUInteger i = 0; i < args.count; i++) {
              argv[i + 1] = strdup(args[i].UTF8String);
            }
            argv[count] = NULL;

            pid_t pid = 0;
            int rc = posix_spawn(&pid, cli.fileSystemRepresentation, &actions, NULL, argv, environ);
            posix_spawn_file_actions_destroy(&actions);
            close(pipefd[1]);

            NSMutableData *buf = [NSMutableData data];
            int exitCode = -3;
            if (rc == 0 && pid > 0) {
              uint8_t tmp[1024];
              ssize_t n = 0;
              while ((n = read(pipefd[0], tmp, sizeof(tmp))) > 0) {
                [buf appendBytes:tmp length:(NSUInteger)n];
              }
              int status = 0;
              waitpid(pid, &status, 0);
              if (WIFEXITED(status)) exitCode = WEXITSTATUS(status);
              else if (WIFSIGNALED(status)) exitCode = 128 + WTERMSIG(status);
            } else {
              if (outText) *outText = [NSString stringWithFormat:@"posix_spawn rc=%d (%s)", rc, strerror(rc)];
              exitCode = -rc;
            }
            close(pipefd[0]);

            for (NSUInteger i = 0; i < count; i++) free(argv[i]);
            free(argv);

            if (outText && !(*outText)) {
              NSString *s = [[NSString alloc] initWithData:buf encoding:NSUTF8StringEncoding];
              *outText = [s stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet] ?: @"";
            }
            return exitCode;
          }

          static void gsTriggerDaemonInstantReload(dispatch_queue_t q) {
            notify_post("xyz.regulad.geoshim.reload");
            if (q) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(80 * NSEC_PER_MSEC)), q, ^{
                notify_post("xyz.regulad.geoshim.reload");
              });
            }
          }

          static BOOL gsReadRealCoord(CLLocationCoordinate2D *outCoord) {
            int tok = -1;
            if (notify_register_check("xyz.regulad.geoshim.real", &tok) != NOTIFY_STATUS_OK || tok == -1) return NO;
            uint64_t rv = 0;
            notify_get_state(tok, &rv);
            notify_cancel(tok);
            if (rv == 0) return NO;
            int32_t ilat = (int32_t)(uint32_t)(rv & 0xFFFFFFFFULL);
            int32_t ilon = (int32_t)(uint32_t)((rv >> 32) & 0xFFFFFFFFULL);
            double lat = ilat / 10000.0, lon = ilon / 10000.0;
            if (fabs(lat) > 90.0 || fabs(lon) > 180.0 || (fabs(lat) < 0.05 && fabs(lon) < 0.05)) return NO;
            if (outCoord) *outCoord = CLLocationCoordinate2DMake(lat, lon);
            return YES;
          }

          static BOOL gsReadTargetNotify(BOOL *outActive, CLLocationCoordinate2D *outCoord) {
            int tok = -1;
            if (notify_register_check("xyz.regulad.geoshim.target", &tok) != NOTIFY_STATUS_OK || tok == -1) return NO;
            uint64_t tv = 0;
            notify_get_state(tok, &tv);
            notify_cancel(tok);
            if (outActive) *outActive = (((tv >> 63) & 1ULL) == 1ULL);
            BOOL hasCoord = (((tv >> 62) & 1ULL) == 1ULL);
            if (hasCoord && outCoord) {
              uint32_t ilat = (uint32_t)(tv & 0x1FFFFFFULL);
              uint32_t ilon = (uint32_t)((tv >> 25) & 0x3FFFFFFULL);
              double lat = (double)ilat / 100000.0 - 90.0;
              double lon = (double)ilon / 100000.0 - 180.0;
              if (lat >= -90.0 && lat <= 90.0 && lon >= -180.0 && lon <= 180.0) {
                *outCoord = CLLocationCoordinate2DMake(lat, lon);
              } else {
                hasCoord = NO;
              }
            }
            return hasCoord;
          }

          static BOOL gsReadXpcStatus(uint32_t *outBlobs) {
            int tok = -1;
            uint64_t xv = 0;
            if (notify_register_check("xyz.regulad.geoshim.xpc", &tok) == NOTIFY_STATUS_OK && tok != -1) {
              notify_get_state(tok, &xv);
              notify_cancel(tok);
            }
            if (outBlobs) *outBlobs = (uint32_t)((xv >> 20) & 0xFFFFF);
            return ((xv >> 63) & 1ULL) == 1ULL;
          }

          static BOOL gsParseCoordinateText(NSString *text, CLLocationCoordinate2D *outCoord) {
            if (!text.length) return NO;
            NSRegularExpression *rx = [NSRegularExpression regularExpressionWithPattern:@"(-?\\d{1,2}\\.\\d+)\\s*[,;\\s]+\\s*(-?\\d{1,3}\\.\\d+)"
                                              options:0
                                                error:nil];
            if (!rx) return NO;
            NSArray<NSTextCheckingResult *> *matches = [rx matchesInString:text options:0 range:NSMakeRange(0, text.length)];
            for (NSTextCheckingResult *m in matches) {
              if (m.numberOfRanges < 3) continue;
              double lat = [[text substringWithRange:[m rangeAtIndex:1]] doubleValue];
              double lon = [[text substringWithRange:[m rangeAtIndex:2]] doubleValue];
              if (lat >= -90.0 && lat <= 90.0 && lon >= -180.0 && lon <= 180.0 &&
                (fabs(lat) > 0.0001 || fabs(lon) > 0.0001)) {
                if (outCoord) *outCoord = CLLocationCoordinate2DMake(lat, lon);
                return YES;
              }
            }
            return NO;
          }

          static NSString *gsEncodeQueryValue(NSString *s) {
            NSMutableCharacterSet *cs = [NSCharacterSet.URLQueryAllowedCharacterSet mutableCopy];
            [cs removeCharactersInString:@"&=?+#/"];
            return [s stringByAddingPercentEncodingWithAllowedCharacters:cs] ?: @"";
          }

          static NSString *gsNormQuery(NSString *s) {
            return [[s stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet] lowercaseString] ?: @"";
          }

          // Weak proxy to eliminate CADisplayLink retain cycles
          @interface GSDisplayLinkProxy : NSObject
          @property (nonatomic, weak) id target;
          @property (nonatomic, assign) SEL selector;
          @end

          @implementation GSDisplayLinkProxy
          - (void)tick:(CADisplayLink *)link {
            id t = self.target;
            if (t && [t respondsToSelector:self.selector]) {
              ((void (*)(id, SEL, CADisplayLink *))[t methodForSelector:self.selector])(t, self.selector, link);
            } else {
              [link invalidate];
            }
          }
          @end

          // --- Pure UIKit + NSURLSession 60 FPS Web Mercator Tile Map ---
          static inline double gsWorldSize(double z) { return 256.0 * pow(2.0, z); }
          static inline double gsLonToX(double lon, double z) { return (lon + 180.0) / 360.0 * gsWorldSize(z); }
          static inline double gsLatToY(double lat, double z) {
            double clat = fmax(-85.05112878, fmin(85.05112878, lat));
            double rad = clat * M_PI / 180.0;
            return (1.0 - log(tan(rad) + 1.0 / cos(rad)) / M_PI) * 0.5 * gsWorldSize(z);
          }
          static inline double gsXToLon(double x, double z) { return x / gsWorldSize(z) * 360.0 - 180.0; }
          static inline double gsYToLat(double y, double z) {
            double n = M_PI - 2.0 * M_PI * y / gsWorldSize(z);
            return 180.0 / M_PI * atan(0.5 * (exp(n) - exp(-n)));
          }

