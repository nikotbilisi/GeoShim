          static void *(*gOrigDmachSendWait)(void *, void *, mach_msg_option_t) = NULL;
          static void *(*gOrigDmachSendResWait)(void *, void *, mach_msg_option_t, uint32_t, unsigned long *, mach_error_t *) = NULL;

          static void gs_xpc_send_msg(xpc_connection_t conn, xpc_object_t msg) {
              if (!gInXpcHook) { gInXpcHook = 1; gs_handle_outbound_xpc(msg); gInXpcHook = 0; }
              if (gOrigXpcSendMsg) gOrigXpcSendMsg(conn, msg);
          }

          static void gs_xpc_send_notif(xpc_connection_t conn, xpc_object_t msg) {
              if (!gInXpcHook) { gInXpcHook = 1; gs_handle_outbound_xpc(msg); gInXpcHook = 0; }
              if (gOrigXpcSendNotif) gOrigXpcSendNotif(conn, msg);
          }

          static void gs_xpc_send_reply(xpc_connection_t conn, xpc_object_t msg, dispatch_queue_t q, xpc_handler_t h) {
              if (!gInXpcHook) { gInXpcHook = 1; gs_handle_outbound_xpc(msg); gInXpcHook = 0; }
              if (gOrigXpcSendReply) gOrigXpcSendReply(conn, msg, q, h);
          }

          static void *gs_xpc_send_sync(void *conn, void *msg) {
              if (!gInXpcHook && msg) { gInXpcHook = 1; gs_handle_outbound_xpc((__bridge xpc_object_t)msg); gInXpcHook = 0; }
              return gOrigXpcSendSync ? gOrigXpcSendSync(conn, msg) : NULL;
          }

