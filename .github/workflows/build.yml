              self.view.backgroundColor = UIColor.systemBackgroundColor;

              NSUserDefaults *ud = NSUserDefaults.standardUserDefaults;
              self.altitudeMeters = [ud objectForKey:kAltitudeKey] ? [ud doubleForKey:kAltitudeKey] : 20.0;
              self.selectedCoord = CLLocationCoordinate2DMake(40.7128, -74.0060);

              NSDictionary *prefs = [NSDictionary dictionaryWithContentsOfFile:gsPrefsPath()];
              if (prefs[@"latitude"] && prefs[@"longitude"]) {
                  double plat = [prefs[@"latitude"] doubleValue];
                  double plon = [prefs[@"longitude"] doubleValue];
                  if (fabs(plat) > 0.0001 || fabs(plon) > 0.0001) {
                      self.selectedCoord = CLLocationCoordinate2DMake(plat, plon);
                  }
              } else {
                  CLLocationCoordinate2D realC;
                  if (gsReadRealCoord(&realC)) self.selectedCoord = realC;
              }

              [self setupMap];
              [self setupTopSearch];
              [self setupSideButtons];
              [self setupBottomCard];
              [self movePinTo:self.selectedCoord centerMap:YES zoom:15.0];
              [self refreshStatus];

              self.pollTimer = [NSTimer scheduledTimerWithTimeInterval:2.0 target:self selector:@selector(refreshStatus) userInfo:nil repeats:YES];
          }

          - (void)dealloc { [self.pollTimer invalidate]; }

          - (void)setupMap {
              self.mapView = [[GSTileMapView alloc] initWithFrame:self.view.bounds];
              self.mapView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.mapView.styleIndex = [NSUserDefaults.standardUserDefaults integerForKey:kMapStyleKey] % 3;
              __weak typeof(self) weakSelf = self;
              self.mapView.onPinChanged = ^(CLLocationCoordinate2D c) {
                  [[[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleLight] impactOccurred];
                  weakSelf.selectedCoord = c;
                  weakSelf.coordLabel.text = [NSString stringWithFormat:@"%.6f, %.6f", c.latitude, c.longitude];
              };
              self.mapView.onInteraction = ^{
                  [weakSelf.view endEditing:YES];
                  weakSelf.resultsTable.hidden = YES;
              };
              self.mapView.onTileError = ^(NSString *msg) {
                  if (msg.length) {
                      weakSelf.tileErrLabel.text = [NSString stringWithFormat:@" %@ ", msg];
                      weakSelf.tileErrLabel.hidden = NO;
                  } else {
                      weakSelf.tileErrLabel.hidden = YES;
                  }
              };
              [self.view addSubview:self.mapView];
          }

