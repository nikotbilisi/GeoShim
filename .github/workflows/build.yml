name: Build GeoShim RootHide

on:
  workflow_dispatch:
  push:

concurrency:
  group: geoshim-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Patch filter to locationd-only
        run: |
          python3 - << 'PY'
          import plistlib
          with open("GeoShim.plist", "wb") as f:
              plistlib.dump({"Filter": {"Executables": ["locationd"]}}, f)
          assert plistlib.load(open("GeoShim.plist", "rb")) == {"Filter": {"Executables": ["locationd"]}}
          print("filter ok")
          PY

      - name: Setup RootHide Theos (macOS + Xcode)
        run: |
          brew install ldid dpkg xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Stage Prebuilt RootHide libSandy & AltList
        run: |
          export THEOS="$HOME/theos"
          mkdir -p /tmp/rhstage "$THEOS/lib/iphone/roothide" "$THEOS/vendor/lib/iphone/roothide" "$THEOS/include"
          python3 - << 'PY'
          import urllib.request, urllib.parse, bz2, gzip, subprocess
          base = "https://roothide.github.io/"
          raw = None
          for name, dec in [("Packages", lambda b: b), ("Packages.bz2", bz2.decompress), ("Packages.gz", gzip.decompress)]:
              try:
                  req = urllib.request.Request(base + name, headers={"User-Agent": "Sileo/2.5"})
                  with urllib.request.urlopen(req) as r:
                      raw = dec(r.read()).decode("utf-8", "ignore"); break
              except Exception:
                  pass
          assert raw, "Failed to fetch Packages"
          for target in ["com.opa334.libsandy", "com.opa334.altlist"]:
              matches = []
              for stanza in raw.split("\n\n"):
                  fields = {}
                  for line in stanza.splitlines():
                      if ":" in line and not line[0].isspace():
                          k, v = line.split(":", 1); fields[k.strip()] = v.strip()
                  if fields.get("Package") == target and "Filename" in fields:
                      matches.append((fields.get("Architecture") == "iphoneos-arm64e", fields["Filename"]))
              assert matches, f"{target} not found"
              matches.sort()
              rel = urllib.parse.quote(matches[-1][1].lstrip("./"), safe="/+-._~")
              out = f"/tmp/{target}.deb"
              req = urllib.request.Request(base + rel, headers={"User-Agent": "Sileo/2.5"})
              with urllib.request.urlopen(req) as r, open(out, "wb") as f:
                  f.write(r.read())
              subprocess.run(["dpkg-deb", "-x", out, "/tmp/rhstage"], check=True)
          PY
          SANDY_DYLIB=$(find /tmp/rhstage -iname "libsandy.dylib" | head -n 1)
          ALTLIST_FW=$(find /tmp/rhstage -type d -name "AltList.framework" | head -n 1)
          cp -a "$SANDY_DYLIB" "$THEOS/lib/iphone/roothide/libsandy.dylib"
          cp -a "$SANDY_DYLIB" "$THEOS/vendor/lib/iphone/roothide/libsandy.dylib"
          cp -a "$ALTLIST_FW" "$THEOS/lib/iphone/roothide/"
          cp -a "$ALTLIST_FW" "$THEOS/vendor/lib/iphone/roothide/"
          git clone --depth 1 https://github.com/roothide/libSandy.git /tmp/libSandy
          cp -f /tmp/libSandy/libSandy.h "$THEOS/include/"
          git clone --depth 1 https://github.com/opa334/AltList.git /tmp/AltList
          mkdir -p "$THEOS/include/AltList" "$THEOS/lib/iphone/roothide/AltList.framework/Headers" "$THEOS/vendor/lib/iphone/roothide/AltList.framework/Headers"
          find /tmp/AltList -name "*.h" -exec cp -f {} "$THEOS/include/AltList/" \; -exec cp -f {} "$THEOS/lib/iphone/roothide/AltList.framework/Headers/" \; -exec cp -f {} "$THEOS/vendor/lib/iphone/roothide/AltList.framework/Headers/" \;

      - name: Build .deb
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1 ARCHS=arm64e

      - name: Verify arm64e ABI (fail on old ABI)
        run: |
          python3 - << 'PY'
          import glob, os, struct, sys
          cands = []
          for pat in ("**/GeoShim.dylib", "**/geoshim", "**/GeoShimPrefs.bundle/GeoShimPrefs"):
              cands += glob.glob(os.path.join(".theos/obj", pat), recursive=True)
          files = [p for p in cands if os.path.isfile(p)]
          if not files:
              sys.exit("no built binaries found")
          bad = []
          for p in files:
              magic, cputype, subtype = struct.unpack("<III", open(p, "rb").read(12))
              print(f"{p}: magic=0x{magic:08x} cputype=0x{cputype:08x} cpusubtype=0x{subtype:08x}")
              if cputype != 0x0100000C or not (subtype & 0x80000000):
                  bad.append(p)
          if bad:
              sys.exit("old arm64e ABI (will not run on iOS 14+): " + ", ".join(bad))
          print("OK: arm64e ptrauth ABI")
          PY
          DEB=$(ls packages/*.deb | head -n 1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Package Version Architecture
          [ "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64e" ] || { echo "bad package arch"; exit 1; }

      - name: Save .deb file
        uses: actions/upload-artifact@v4
        with:
          name: geoshim-deb-${{ matrix.os }}
          path: packages/*.deb
          if-no-files-found: error
