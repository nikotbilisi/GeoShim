name: Build GeoShim RootHide
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Patch Filter to locationd-only (Never touch SpringBoard/backboardd)
        run: |
          cat > GeoShim.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Filter</key>
            <dict>
              <key>Executables</key>
              <array>
                <string>locationd</string>
              </array>
            </dict>
          </dict>
          </plist>
          PLIST
          python3 -c 'import plistlib; assert plistlib.load(open("GeoShim.plist","rb")) == {"Filter": {"Executables": ["locationd"]}}'

      - name: Setup Linux Toolchain & RootHide Theos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot dpkg git perl curl xz-utils zstd bzip2 python3 libtinfo5 libncurses5 libxml2 libz3-4 pkg-config libplist-dev libssl-dev
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          make -C /tmp/ldid
          sudo install -m 0755 /tmp/ldid/ldid /usr/local/bin/ldid
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          TC_URL=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/kabiroberai/swift-toolchain-linux/releases/latest | grep -o 'https://[^"]*ubuntu22\.04\.tar\.xz' | head -n 1 || true)
          if [ -z "$TC_URL" ]; then
            TC_URL="https://github.com/kabiroberai/swift-toolchain-linux/releases/download/v2.3.0/swift-5.8-ubuntu22.04.tar.xz"
          fi
          curl -fL "$TC_URL" -o /tmp/tc.tar.xz
          mkdir -p /tmp/tc "$THEOS/toolchain/linux/iphone" "$THEOS/sdks"
          tar -xf /tmp/tc.tar.xz -C /tmp/tc
          if [ -d /tmp/tc/linux/iphone ]; then
            cp -a /tmp/tc/* "$THEOS/toolchain/"
          else
            CLANG_PATH=$(find /tmp/tc \( -type f -o -type l \) -path "*/bin/clang" | head -n 1)
            TC_ROOT=$(dirname "$(dirname "$CLANG_PATH")")
            cp -a "$TC_ROOT"/. "$THEOS/toolchain/linux/iphone/"
          fi
          cp -f /tmp/ldid/ldid "$THEOS/toolchain/linux/iphone/bin/ldid"
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$THEOS/sdks"

      - name: Stage Prebuilt RootHide libSandy & AltList
        run: |
          export THEOS="$HOME/theos"
          mkdir -p /tmp/rhstage "$THEOS/lib/iphone/roothide" "$THEOS/vendor/lib/iphone/roothide" "$THEOS/include"
          python3 - << 'PY'
          import urllib.request, urllib.parse, bz2, gzip, subprocess

          base = "https://roothide.github.io/"
          raw = None
          for name, dec in [("Packages", lambda b: b), ("Packages.bz2", bz2.decompress), ("Packages.gz", gzip.decompress)]:
              try:
                  req = urllib.request.Request(base + name, headers={"User-Agent": "Sileo/2.5"})
                  with urllib.request.urlopen(req) as r:
                      raw = dec(r.read()).decode("utf-8", "ignore")
                      break
              except Exception:
                  pass

          assert raw, "Failed to fetch Packages from roothide.github.io"
          for target in ["com.opa334.libsandy", "com.opa334.altlist"]:
              matches = []
              for stanza in raw.split("\n\n"):
                  fields = {}
                  for line in stanza.splitlines():
                      if ":" in line and not line[0].isspace():
                          k, v = line.split(":", 1)
                          fields[k.strip()] = v.strip()
                  if fields.get("Package") == target and "Filename" in fields:
                      matches.append((fields.get("Architecture") == "iphoneos-arm64e", fields["Filename"]))
              assert matches, f"Package {target} not found"
              matches.sort()
              rel = urllib.parse.quote(matches[-1][1].lstrip("./"), safe="/+-._~")
              out = f"/tmp/{target}.deb"
              req = urllib.request.Request(base + rel, headers={"User-Agent": "Sileo/2.5"})
              with urllib.request.urlopen(req) as r, open(out, "wb") as f:
                  f.write(r.read())
              subprocess.run(["dpkg-deb", "-x", out, "/tmp/rhstage"], check=True)
          PY
          SANDY_DYLIB=$(find /tmp/rhstage -iname "libsandy.dylib" | head -n 1)
          ALTLIST_FW=$(find /tmp/rhstage -type d -name "AltList.framework" | head -n 1)
          cp -a "$SANDY_DYLIB" "$THEOS/lib/iphone/roothide/libsandy.dylib"
          cp -a "$SANDY_DYLIB" "$THEOS/vendor/lib/iphone/roothide/libsandy.dylib"
          cp -a "$ALTLIST_FW" "$THEOS/lib/iphone/roothide/"
          cp -a "$ALTLIST_FW" "$THEOS/vendor/lib/iphone/roothide/"
          git clone --depth 1 https://github.com/roothide/libSandy.git /tmp/libSandy
          cp -f /tmp/libSandy/libSandy.h "$THEOS/include/"
          git clone --depth 1 https://github.com/opa334/AltList.git /tmp/AltList
          mkdir -p "$THEOS/lib/iphone/roothide/AltList.framework/Headers" "$THEOS/vendor/lib/iphone/roothide/AltList.framework/Headers" "$THEOS/include/AltList"
          find /tmp/AltList -name "*.h" -exec cp -f {} "$THEOS/lib/iphone/roothide/AltList.framework/Headers/" \; -exec cp -f {} "$THEOS/vendor/lib/iphone/roothide/AltList.framework/Headers/" \; -exec cp -f {} "$THEOS/include/AltList/" \;

      - name: Build .deb
        run: |
          export THEOS="$HOME/theos"
          export PATH="/usr/local/bin:$THEOS/bin:$PATH"
          make package FINALPACKAGE=1 ARCHS=arm64e

      - name: Save .deb file
        uses: actions/upload-artifact@v4
        with:
          name: geoshim-roothide-deb
          path: packages/*.deb
