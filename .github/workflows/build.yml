          - (void)reloadQuickFavoritesBar {
            for (UIView *v in self.quickBarStack.arrangedSubviews) {
              [self.quickBarStack removeArrangedSubview:v];
              [v removeFromSuperview];
            }
            NSArray *saved = [NSUserDefaults.standardUserDefaults arrayForKey:kFavoritesKey];
            if (!saved.count) {
              self.quickFavorites = @[];
              self.quickBarScroll.hidden = YES;
              return;
            }
            NSUInteger maxCount = MIN(saved.count, (NSUInteger)6);
            self.quickFavorites = [saved subarrayWithRange:NSMakeRange(0, maxCount)];
            self.quickBarScroll.hidden = NO;

            for (NSUInteger i = 0; i < self.quickFavorites.count; i++) {
              NSDictionary *d = self.quickFavorites[i];
              NSString *name = [d[@"name"] isKindOfClass:[NSString class]] ? d[@"name"] : @"Точка";
              if (name.length > 18) name = [[name substringToIndex:17] stringByAppendingString:@"…"];

              UIButton *chip = [UIButton buttonWithType:UIButtonTypeSystem];
              chip.translatesAutoresizingMaskIntoConstraints = NO;
              chip.tag = (NSInteger)i;
              [chip setTitle:[NSString stringWithFormat:@"  ★ %@  ", name] forState:UIControlStateNormal];
              chip.titleLabel.font = [UIFont systemFontOfSize:12 weight:UIFontWeightSemibold];
              chip.titleLabel.lineBreakMode = NSLineBreakByTruncatingTail;
              chip.layer.cornerRadius = 17;
              chip.layer.shadowColor = UIColor.blackColor.CGColor;
              chip.layer.shadowOpacity = 0.20;
              chip.layer.shadowRadius = 4;
              chip.layer.shadowOffset = CGSizeMake(0, 1);
              [chip addTarget:self action:@selector(quickFavoriteTapped:) forControlEvents:UIControlEventTouchUpInside];
              [NSLayoutConstraint activateConstraints:@[
                [chip.heightAnchor constraintEqualToConstant:34],
                [chip.widthAnchor constraintLessThanOrEqualToConstant:168]
              ]];
              [self.quickBarStack addArrangedSubview:chip];
            }
            [self updateQuickBarHighlights];
          }

          - (void)updateQuickBarHighlights {
            BOOL active = self.mapView.spoofActive;
            for (UIView *v in self.quickBarStack.arrangedSubviews) {
              if (![v isKindOfClass:[UIButton class]]) continue;
              UIButton *chip = (UIButton *)v;
              NSInteger idx = chip.tag;
              BOOL isSelected = NO;
              if (idx >= 0 && idx < (NSInteger)self.quickFavorites.count) {
                NSDictionary *d = self.quickFavorites[(NSUInteger)idx];
                double lat = [d[@"lat"] doubleValue], lon = [d[@"lon"] doubleValue];
                isSelected = (fabs(lat - self.selectedCoord.latitude) < 0.0005 && fabs(lon - self.selectedCoord.longitude) < 0.0005);
              }
              if (isSelected && active) {
                chip.backgroundColor = UIColor.systemGreenColor;
                [chip setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              } else if (isSelected) {
                chip.backgroundColor = UIColor.systemBlueColor;
                [chip setTitleColor:UIColor.whiteColor forState:UIControlStateNormal];
              } else {
                chip.backgroundColor = [UIColor.secondarySystemBackgroundColor colorWithAlphaComponent:0.95];
                [chip setTitleColor:UIColor.labelColor forState:UIControlStateNormal];
              }
            }
          }

          - (void)quickFavoriteTapped:(UIButton *)sender {
            NSInteger idx = sender.tag;
            if (idx < 0 || idx >= (NSInteger)self.quickFavorites.count) return;
            [self.view endEditing:YES];
            self.resultsTable.hidden = YES;
            NSDictionary *d = self.quickFavorites[(NSUInteger)idx];
            double lat = [d[@"lat"] doubleValue], lon = [d[@"lon"] doubleValue];
            double targetZ = (self.mapView.zoom >= 13.0) ? 0.0 : 15.0;
            [self movePinTo:CLLocationCoordinate2DMake(lat, lon) centerMap:YES zoom:targetZ];
            [self applySpoofTapped];
          }

          - (void)movePinTo:(CLLocationCoordinate2D)coord centerMap:(BOOL)center zoom:(double)zoom {
            self.selectedCoord = coord;
            self.mapView.pinCoord = coord;
            self.coordLabel.text = [NSString stringWithFormat:@"%.6f, %.6f", coord.latitude, coord.longitude];
            if (center) {
              [self.mapView stopAnimations];
              self.mapView.centerLat = coord.latitude;
              self.mapView.centerLon = coord.longitude;
              if (zoom > 0) self.mapView.zoom = zoom;
            }
            [self.mapView reloadTiles];
            [self updateQuickBarHighlights];
          }

          - (double)currentJitterMeters {
            switch (self.jitterControl.selectedSegmentIndex) {
              case 0: return 0.0;
              case 2: return 5.0;
              default: return 2.0;
            }
          }

          - (void)jitterChanged { [NSUserDefaults.standardUserDefaults setInteger:self.jitterControl.selectedSegmentIndex forKey:kJitterIdxKey]; }
          - (void)zoomInTapped  { [self.mapView zoomBy:1.0]; }
          - (void)zoomOutTapped { [self.mapView zoomBy:-1.0]; }
          - (void)centerOnPin   { [self movePinTo:self.selectedCoord centerMap:YES zoom:0]; }

          - (void)centerOnRealTapped {
            CLLocationCoordinate2D rc;
            if (gsReadRealCoord(&rc)) {
              [self.mapView stopAnimations];
              self.mapView.centerLat = rc.latitude;
              self.mapView.centerLon = rc.longitude;
              [self.mapView reloadTiles];
            }
          }

          - (void)cycleMapType {
            self.mapView.styleIndex = (self.mapView.styleIndex + 1) % 3;
            [NSUserDefaults.standardUserDefaults setInteger:self.mapView.styleIndex forKey:kMapStyleKey];
            [self.styleBadge setTitle:[self styleTitle:self.mapView.styleIndex] forState:UIControlStateNormal];
            [self.mapView clearVisibleTiles];
            [self.mapView reloadTiles];
          }

          - (void)editAltitude {
            UIAlertController *ac = [UIAlertController alertControllerWithTitle:@"Высота (метры)" message:nil preferredStyle:UIAlertControllerStyleAlert];
            [ac addTextFieldWithConfigurationHandler:^(UITextField *tf) {
              tf.keyboardType = UIKeyboardTypeDecimalPad;
              tf.text = [NSString stringWithFormat:@"%.0f", self.altitudeMeters];
            }];
            [ac addAction:[UIAlertAction actionWithTitle:@"Отмена" style:UIAlertActionStyleCancel handler:nil]];
            [ac addAction:[UIAlertAction actionWithTitle:@"ОК" style:UIAlertActionStyleDefault handler:^(UIAlertAction *a) {
              double v = [ac.textFields.firstObject.text doubleValue];
              if (isfinite(v) && v >= -100.0 && v <= 10000.0) {
                self.altitudeMeters = v;
                [NSUserDefaults.standardUserDefaults setDouble:v forKey:kAltitudeKey];
                [self.altButton setTitle:[NSString stringWithFormat:@"Высота: %.0fm", v] forState:UIControlStateNormal];
              }
            }]];
            [self presentViewController:ac animated:YES completion:nil];
          }

          - (void)refreshStatus {
            uint32_t blobs = 0;
            BOOL alive = gsReadXpcStatus(&blobs);
            BOOL notifyActive = NO;
            CLLocationCoordinate2D tc;
            BOOL hasTarget = gsReadTargetNotify(&notifyActive, &tc);

            BOOL enabled = self.cliKnownActive;
            if (CFAbsoluteTimeGetCurrent() < self.optimisticUntil) {
              enabled = self.optimisticState;
            } else if (hasTarget || notifyActive) {
              enabled = notifyActive;
              self.cliKnownActive = notifyActive;
            }

            self.mapView.spoofActive = enabled;

            if (!alive) {
              self.statusDot.backgroundColor = UIColor.systemOrangeColor;
              self.statusLabel.text = @"ДЕМОН ОЖИДАЕТ";
              self.statusLabel.textColor = UIColor.systemOrangeColor;
            } else if (enabled) {
              self.statusDot.backgroundColor = UIColor.systemGreenColor;
              self.statusLabel.text = [NSString stringWithFormat:@"АКТИВНО (XPC: %u)", blobs];
              self.statusLabel.textColor = UIColor.systemGreenColor;
              [self.startButton setTitle:@"Перенести сюда" forState:UIControlStateNormal];
              self.startButton.backgroundColor = UIColor.systemGreenColor;
            } else {
              self.statusDot.backgroundColor = UIColor.systemGrayColor;
              self.statusLabel.text = @"ВЫКЛЮЧЕНО";
              self.statusLabel.textColor = UIColor.secondaryLabelColor;
              [self.startButton setTitle:@"Включить точку" forState:UIControlStateNormal];
              self.startButton.backgroundColor = UIColor.systemBlueColor;
            }

            self.stopButton.alpha = enabled ? 1.0 : 0.65;
            self.stopButton.enabled = YES;

            CLLocationCoordinate2D realC;
            if (gsReadRealCoord(&realC)) {
              [self.realButton setTitle:[NSString stringWithFormat:@"Real: %.4f, %.4f", realC.latitude, realC.longitude] forState:UIControlStateNormal];
              self.mapView.realCoord = realC;
              self.mapView.hasRealCoord = YES;
            } else {
              [self.realButton setTitle:@"Real: —" forState:UIControlStateNormal];
              self.mapView.hasRealCoord = NO;
            }
            [self.mapView updateMarkers];
            [self updateQuickBarHighlights];
          }

          - (void)applySpoofTapped {
            [[[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium] impactOccurred];
            double lat = self.selectedCoord.latitude;
            double lon = self.selectedCoord.longitude;
            NSString *latS = [NSString stringWithFormat:@"%.6f", lat];
            NSString *lonS = [NSString stringWithFormat:@"%.6f", lon];
            NSString *altS = [NSString stringWithFormat:@"%.1f", self.altitudeMeters];
            NSString *jitS = [NSString stringWithFormat:@"%.1f", [self currentJitterMeters]];
            NSArray<NSString *> *argsFull = @[@"start", @"-x", latS, @"-y", lonS, @"-a", altS, @"--jitter", jitS];
            NSArray<NSString *> *argsBase = @[@"start", @"-x", latS, @"-y", lonS, @"-a", altS];

            // Instant optimistic UI response (0ms perceived latency)
            [NSUserDefaults.standardUserDefaults setDouble:lat forKey:kLastLatKey];
            [NSUserDefaults.standardUserDefaults setDouble:lon forKey:kLastLonKey];
            self.optimisticState = YES;
            self.optimisticUntil = CFAbsoluteTimeGetCurrent() + 4.0;
            [self refreshStatus];

            NSUInteger gen = ++self.applyGeneration;
            NSInteger jCap = self.jitterFlagSupport;
            dispatch_queue_t q = self.cliQueue;

            dispatch_async(q, ^{
              NSString *out = nil;
              int rc = -1;
              NSInteger detectedCap = 0;

              if (jCap == -1) {
                rc = gsRunCLI(argsBase, &out);
              } else {
                rc = gsRunCLI(argsFull, &out);
                if (rc == 0) {
                  detectedCap = 1;
                } else {
                  NSString *out2 = nil;
                  int rc2 = gsRunCLI(argsBase, &out2);
                  if (rc2 == 0) {
                    rc = 0;
                    out = out2;
                    detectedCap = -1;
                  }
                }
              }
              if (rc == 0) {
                gsTriggerDaemonInstantReload(q);
              }
              dispatch_async(dispatch_get_main_queue(), ^{
                if (detectedCap != 0) self.jitterFlagSupport = detectedCap;
                if (gen != self.applyGeneration) return;
                if (rc == 0) {
                  self.cliKnownActive = YES;
                  [[[UINotificationFeedbackGenerator alloc] init] notificationOccurred:UINotificationFeedbackTypeSuccess];
                  [self showToast:@"✓ Точка включена" color:UIColor.systemGreenColor];
                  [self refreshStatus];
                } else {
                  self.optimisticUntil = 0;
                  [self refreshStatus];
                  [self showError:[NSString stringWithFormat:@"Код %d\n%@", rc, out ?: @"(пусто)"]];
                }
              });
            });
          }

          - (void)stopSpoofTapped {
            [[[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium] impactOccurred];
            self.optimisticState = NO;
            self.optimisticUntil = CFAbsoluteTimeGetCurrent() + 4.0;
            [self refreshStatus];

            NSUInteger gen = ++self.applyGeneration;
            dispatch_queue_t q = self.cliQueue;

            dispatch_async(q, ^{
              NSString *out = nil;
              int rc = gsRunCLI(@[@"stop"], &out);
              if (rc == 0) {
                gsTriggerDaemonInstantReload(q);
              }
              dispatch_async(dispatch_get_main_queue(), ^{
                if (gen != self.applyGeneration) return;
                if (rc == 0) {
                  self.cliKnownActive = NO;
                  [[[UINotificationFeedbackGenerator alloc] init] notificationOccurred:UINotificationFeedbackTypeSuccess];
                  [self showToast:@"✓ Реальный GPS восстановлен" color:UIColor.systemBlueColor];
                  [self refreshStatus];
                } else {
                  self.optimisticUntil = 0;
                  [self refreshStatus];
                  [self showError:[NSString stringWithFormat:@"Код %d\n%@", rc, out ?: @"(пусто)"]];
                }
              });
            });
          }

          - (void)showError:(NSString *)msg {
            UIAlertController *ac = [UIAlertController alertControllerWithTitle:@"Ошибка geoshim" message:msg preferredStyle:UIAlertControllerStyleAlert];
            [ac addAction:[UIAlertAction actionWithTitle:@"ОК" style:UIAlertActionStyleDefault handler:nil]];
            [self presentViewController:ac animated:YES completion:nil];
          }

