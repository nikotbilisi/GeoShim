          static SInt32 gs_cfmp_send(CFMessagePortRef remote, SInt32 msgid, CFDataRef data,
                         CFTimeInterval sendTimeout, CFTimeInterval rcvTimeout,
                         CFStringRef replyMode, CFDataRef *returnData) {
            CFDataRef patchedRef = NULL;
            uint8_t *buf = NULL;
            if (!gInXpcHook && data && atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) {
              gInXpcHook = 1;
              double rlat = gLastRealLat, rlon = gLastRealLon;
              double flat = 0.0, flon = 0.0;
              if (gs_refresh_fake_coord(rlat, rlon, &flat, &flon)) {
                const uint8_t *p = CFDataGetBytePtr(data);
                CFIndex clen = CFDataGetLength(data);
                if (p && clen >= 16) {
                  gs_coord_masks_t masks;
                  gs_build_coord_masks(&masks, rlat, rlon);
                  uint32_t pairs = 0;
                  bool na = false, rad = false, f32 = false;
                  buf = gs_make_patched_blob(p, (size_t)clen, rlat, rlon, flat, flon, &masks, &pairs, &na, &rad, &f32);
                  if (buf) {
                    patchedRef = CFDataCreate(kCFAllocatorDefault, buf, clen);
                    if (patchedRef) atomic_fetch_add(&gIpcCfmpRewritten, 1);
                  }
                }
              }
              gInXpcHook = 0;
            }
            SInt32 ret = gOrigCFMPSend ? gOrigCFMPSend(remote, msgid, patchedRef ? patchedRef : data, sendTimeout, rcvTimeout, replyMode, returnData) : kCFMessagePortTransportError;
            if (patchedRef) CFRelease(patchedRef);
            if (buf) free(buf);
            return ret;
          }

