name: Build GeoShim RootHide

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: geoshim-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Patch package with full iOS 18 XPC rewriter v2
        run: |
          python3 - << 'PY'
          import re, plistlib, shutil

          with open("GeoShim.plist", "wb") as f:
              plistlib.dump({"Filter": {"Executables": ["locationd"]}}, f)

          tx = open("Tweak.x").read()
          tx = re.sub(r'#\s*(?:import|include)\s*[<"]libSandy\.h[>"]', '', tx)
          with open("GSConfig.m", "a") as f:
              f.write('\nint libSandy_applyProfile(const char *profileName) { (void)profileName; return 0; }\n')

          with open("GSCommon.h", "a") as f:
              f.write(r'''
          #ifndef GSLOG_DIAG_OVERRIDE
          #define GSLOG_DIAG_OVERRIDE
          #import <Foundation/Foundation.h>
          #import <os/log.h>
          #include <stdio.h>
          static inline void GSLogToOSLog(NSString *m) {
              static os_log_t gslog;
              static dispatch_once_t gs_once;
              dispatch_once(&gs_once, ^{ gslog = os_log_create("xyz.regulad.geoshim", "tweak"); });
              os_log_fault(gslog, "%{public}s", m.UTF8String);
          }
          #undef GSLog
          #define GSLog(fmt, ...) do { NSString *_gsm = [NSString stringWithFormat:@"[GeoShim] " fmt, ##__VA_ARGS__]; NSLog(@"%@", _gsm); GSLogToOSLog(_gsm); } while (0)
          #endif
          ''')

          old_anchor = "static IMP gEncodeWithCoderOrig = NULL;"
          xpc_rewriter = old_anchor + r'''

          // --- GeoShim iOS 18 Full XPC Rewriter v2 (adjacent + non-adjacent + BE + XPC_DOUBLE) ---
          #include <notify.h>
          #include <dispatch/dispatch.h>
          #include <stdatomic.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <math.h>
          #include <dlfcn.h>
          #include <substrate.h>
          #if __has_include(<xpc/xpc.h>)
          #include <xpc/xpc.h>
          #else
          typedef id xpc_object_t;
          typedef xpc_object_t xpc_connection_t;
          typedef const struct _xpc_type_s *xpc_type_t;
          typedef void (^xpc_handler_t)(xpc_object_t object);
          extern const struct _xpc_type_s _xpc_type_dictionary;
          extern const struct _xpc_type_s _xpc_type_array;
          extern const struct _xpc_type_s _xpc_type_data;
          extern const struct _xpc_type_s _xpc_type_double;
          extern const struct _xpc_type_s _xpc_type_shmem;
          #define XPC_TYPE_DICTIONARY (&_xpc_type_dictionary)
          #define XPC_TYPE_ARRAY (&_xpc_type_array)
          #define XPC_TYPE_DATA (&_xpc_type_data)
          #define XPC_TYPE_DOUBLE (&_xpc_type_double)
          #define XPC_TYPE_SHMEM (&_xpc_type_shmem)
          extern xpc_type_t xpc_get_type(xpc_object_t obj);
          extern bool xpc_dictionary_apply(xpc_object_t xdict, bool (^applier)(const char *key, xpc_object_t value));
          extern bool xpc_array_apply(xpc_object_t xarray, bool (^applier)(size_t index, xpc_object_t value));
          extern const void *xpc_data_get_bytes_ptr(xpc_object_t xdata);
          extern size_t xpc_data_get_length(xpc_object_t xdata);
          extern double xpc_double_get_value(xpc_object_t xdouble);
          extern void xpc_dictionary_set_data(xpc_object_t xdict, const char *key, const void *bytes, size_t length);
          extern void xpc_dictionary_set_double(xpc_object_t xdict, const char *key, double value);
          extern void xpc_array_set_data(xpc_object_t xarray, size_t index, const void *bytes, size_t length);
          extern void xpc_connection_send_message(xpc_connection_t conn, xpc_object_t msg);
          extern void xpc_connection_send_message_with_reply(xpc_connection_t conn, xpc_object_t msg, dispatch_queue_t q, xpc_handler_t h);
          extern xpc_object_t xpc_connection_send_message_with_reply_sync(xpc_connection_t conn, xpc_object_t msg);
          #endif

          static _Atomic uint32_t gDiagEnter = 0;
          static _Atomic uint32_t gDiagSpoof = 0;
          static _Atomic uint32_t gDiagThrow = 0;

          static double gLastRealLat = 0.0, gLastRealLon = 0.0;
          static _Atomic uint32_t gHasRealCoord = 0;

          static double gCachedFakeLat = 0.0, gCachedFakeLon = 0.0;
          static CFAbsoluteTime gCachedFakeTs = 0.0;

          static _Atomic uint32_t gXpcHookedMsg = 0;
          static _Atomic uint32_t gXpcHookedNotif = 0;
          static _Atomic uint32_t gXpcHookedReply = 0;
          static _Atomic uint32_t gXpcHookedSync = 0;
          static _Atomic uint32_t gXpcBlobsRewritten = 0;
          static _Atomic uint32_t gXpcPairsRewritten = 0;
          static _Atomic uint32_t gXpcNonAdjRewritten = 0;
          static _Atomic uint32_t gXpcDblRewritten = 0;
          static _Atomic uint32_t gXpcFloatSeen = 0;
          static _Atomic uint32_t gXpcShmemSeen = 0;
          static _Atomic uint32_t gXpcTotalCalls = 0;

          static __thread int gInXpcHook = 0;

          #define GS_DIAG_NOTIFY "xyz.regulad.geoshim.diag"
          #define GS_REAL_NOTIFY "xyz.regulad.geoshim.real"
          #define GS_XPC_NOTIFY  "xyz.regulad.geoshim.xpc"
          #define GS_XPC2_NOTIFY "xyz.regulad.geoshim.xpc2"

          static void gs_set_state(const char *name, int *tok, uint64_t val) {
              if (*tok == -1) notify_register_check(name, tok);
              if (*tok != -1) notify_set_state(*tok, val);
          }

          static void gs_diag_publish(void) {
              static int tok = -1, rtok = -1;
              uint64_t v = (1ULL << 63)
                         | (uint64_t)(atomic_load(&gDiagEnter) & 0xFFFF)
                         | ((uint64_t)(atomic_load(&gDiagSpoof) & 0xFFFF) << 16)
                         | ((uint64_t)(atomic_load(&gDiagThrow) & 0xFFFF) << 32);
              gs_set_state(GS_DIAG_NOTIFY, &tok, v);
              if (atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) {
                  int32_t ilat = (int32_t)llround(gLastRealLat * 10000.0);
                  int32_t ilon = (int32_t)llround(gLastRealLon * 10000.0);
                  uint64_t rv = ((uint64_t)(uint32_t)ilat) | (((uint64_t)(uint32_t)ilon) << 32);
                  gs_set_state(GS_REAL_NOTIFY, &rtok, rv);
              }
          }

          static void gs_xpc_publish(void) {
              static int tok = -1, tok2 = -1;
              uint64_t v = (1ULL << 63)
                         | ((uint64_t)(atomic_load(&gXpcHookedMsg) & 1) << 62)
                         | ((uint64_t)(atomic_load(&gXpcHookedNotif) & 1) << 61)
                         | ((uint64_t)(atomic_load(&gXpcHookedReply) & 1) << 60)
                         | ((uint64_t)(atomic_load(&gXpcHookedSync) & 1) << 59)
                         | ((uint64_t)(atomic_load(&gXpcBlobsRewritten) & 0xFFFFF) << 20)
                         | (uint64_t)(atomic_load(&gXpcPairsRewritten) & 0xFFFFF);
              gs_set_state(GS_XPC_NOTIFY, &tok, v);

              uint64_t v2 = (uint64_t)(atomic_load(&gXpcNonAdjRewritten) & 0xFFFF)
                          | ((uint64_t)(atomic_load(&gXpcDblRewritten) & 0xFFFF) << 16)
                          | ((uint64_t)(atomic_load(&gXpcFloatSeen) & 0xFFFF) << 32)
                          | ((uint64_t)(atomic_load(&gXpcShmemSeen) & 0xFFFF) << 48);
              gs_set_state(GS_XPC2_NOTIFY, &tok2, v2);
          }

          static void gs_diag_inc(_Atomic uint32_t *c) { atomic_fetch_add(c, 1); gs_diag_publish(); }

          static inline double gs_bswap_d(uint64_t raw) {
              uint64_t sw = __builtin_bswap64(raw);
              double d;
              memcpy(&d, &sw, 8);
              return d;
          }

          static inline uint64_t gs_d_to_be(double d) {
              uint64_t u;
              memcpy(&u, &d, 8);
              return __builtin_bswap64(u);
          }

          typedef struct { char *key; uint8_t *buf; size_t len; } gs_dict_patch_t;
          typedef struct { gs_dict_patch_t items[32]; int count; } gs_dict_patch_list_t;
          typedef struct { char *key; double val; } gs_dbl_patch_t;
          typedef struct { gs_dbl_patch_t items[16]; int count; bool hasLat; bool hasLon; } gs_dbl_patch_list_t;
          typedef struct { size_t idx; uint8_t *buf; size_t len; } gs_arr_patch_t;
          typedef struct { gs_arr_patch_t items[32]; int count; } gs_arr_patch_list_t;

          static uint8_t *gs_make_patched_blob(const uint8_t *src, size_t len,
                                               double rlat, double rlon,
                                               double flat, double flon,
                                               uint32_t *outPairs, bool *outNonAdj) {
              if (!src || len < 16) return NULL;
              size_t lim = len > 65536 ? 65536 : len;

              bool hasLatLE = false, hasLonLE = false;
              bool hasLatBE = false, hasLonBE = false;
              bool hasFloat = false;
              for (size_t off = 0; off + 8 <= lim; off++) {
                  double d;
                  memcpy(&d, src + off, 8);
                  if (isfinite(d)) {
                      if (fabs(d - rlat) < 0.25) hasLatLE = true;
                      else if (fabs(d - rlon) < 0.25) hasLonLE = true;
                  }
                  uint64_t u;
                  memcpy(&u, src + off, 8);
                  double b = gs_bswap_d(u);
                  if (isfinite(b)) {
                      if (fabs(b - rlat) < 0.25) hasLatBE = true;
                      else if (fabs(b - rlon) < 0.25) hasLonBE = true;
                  }
                  if (!hasFloat) {
                      float f0, f1;
                      memcpy(&f0, src + off, 4);
                      memcpy(&f1, src + off + 4, 4);
                      if (isfinite(f0) && isfinite(f1) &&
                          fabs((double)f0 - rlat) < 0.05 && fabs((double)f1 - rlon) < 0.05) {
                          hasFloat = true;
                      }
                  }
              }
              if (hasFloat) atomic_fetch_add(&gXpcFloatSeen, 1);

              bool doLE = (hasLatLE && hasLonLE);
              bool doBE = (hasLatBE && hasLonBE);
              if (!doLE && !doBE) return NULL;

              uint8_t *buf = (uint8_t *)malloc(len);
              if (!buf) return NULL;
              memcpy(buf, src, len);

              uint32_t adjPairs = 0, nonAdjVals = 0;
              uint64_t flatBE = gs_d_to_be(flat), flonBE = gs_d_to_be(flon);

              for (size_t off = 0; off + 8 <= lim; off++) {
                  if (doLE) {
                      double d0;
                      memcpy(&d0, buf + off, 8);
                      if (isfinite(d0) && fabs(d0 - rlat) < 0.25) {
                          if (off + 16 <= lim) {
                              double d1;
                              memcpy(&d1, buf + off + 8, 8);
                              if (isfinite(d1) && fabs(d1 - rlon) < 0.25) {
                                  if (fabs(d0 - flat) > 0.001 || fabs(d1 - flon) > 0.001) {
                                      gLastRealLat = d0; gLastRealLon = d1;
                                  }
                                  memcpy(buf + off, &flat, 8);
                                  memcpy(buf + off + 8, &flon, 8);
                                  adjPairs++;
                                  off += 15;
                                  continue;
                              }
                          }
                          if (fabs(d0 - rlat) < 0.15) {
                              memcpy(buf + off, &flat, 8);
                              nonAdjVals++;
                              off += 7;
                              continue;
                          }
                      }
                      if (isfinite(d0) && fabs(d0 - rlon) < 0.15) {
                          memcpy(buf + off, &flon, 8);
                          nonAdjVals++;
                          off += 7;
                          continue;
                      }
                  }
                  if (doBE) {
                      uint64_t u;
                      memcpy(&u, buf + off, 8);
                      double b = gs_bswap_d(u);
                      if (isfinite(b) && fabs(b - rlat) < 0.15) {
                          memcpy(buf + off, &flatBE, 8);
                          nonAdjVals++;
                          off += 7;
                          continue;
                      }
                      if (isfinite(b) && fabs(b - rlon) < 0.15) {
                          memcpy(buf + off, &flonBE, 8);
                          nonAdjVals++;
                          off += 7;
                          continue;
                      }
                  }
              }

              uint32_t total = adjPairs + (nonAdjVals + 1) / 2;
              if (total == 0) { free(buf); return NULL; }
              if (outPairs) *outPairs = total;
              if (outNonAdj) *outNonAdj = (nonAdjVals > 0);
              return buf;
          }

          static bool gs_rewrite_xpc_obj(xpc_object_t obj, int depth,
                                         double rlat, double rlon,
                                         double flat, double flon) {
              if (!obj || depth > 8) return false;
              xpc_type_t t = xpc_get_type(obj);
              bool changed = false;
              if (t == XPC_TYPE_DICTIONARY) {
                  gs_dict_patch_list_t dlist;
                  memset(&dlist, 0, sizeof(dlist));
                  gs_dict_patch_list_t *dp = &dlist;

                  gs_dbl_patch_list_t dbllist;
                  memset(&dbllist, 0, sizeof(dbllist));
                  gs_dbl_patch_list_t *dblp = &dbllist;

                  __block bool childChanged = false;
                  xpc_dictionary_apply(obj, ^bool(const char *key, xpc_object_t val) {
                      if (!val) return true;
                      xpc_type_t vt = xpc_get_type(val);
                      if (vt == XPC_TYPE_DATA && key && dp->count < 32) {
                          const uint8_t *p = (const uint8_t *)xpc_data_get_bytes_ptr(val);
                          size_t len = xpc_data_get_length(val);
                          uint32_t pairs = 0;
                          bool nonAdj = false;
                          uint8_t *patched = gs_make_patched_blob(p, len, rlat, rlon, flat, flon, &pairs, &nonAdj);
                          if (patched) {
                              char *kcopy = strdup(key);
                              if (kcopy) {
                                  dp->items[dp->count].key = kcopy;
                                  dp->items[dp->count].buf = patched;
                                  dp->items[dp->count].len = len;
                                  dp->count++;
                                  atomic_fetch_add(&gXpcBlobsRewritten, 1);
                                  atomic_fetch_add(&gXpcPairsRewritten, pairs);
                                  if (nonAdj) atomic_fetch_add(&gXpcNonAdjRewritten, 1);
                              } else {
                                  free(patched);
                              }
                          }
                      } else if (vt == XPC_TYPE_DOUBLE && key && dblp->count < 16) {
                          double dv = xpc_double_get_value(val);
                          if (isfinite(dv) && fabs(dv - rlat) < 0.15) {
                              char *kcopy = strdup(key);
                              if (kcopy) { dblp->items[dblp->count].key = kcopy; dblp->items[dblp->count].val = flat; dblp->count++; dblp->hasLat = true; }
                          } else if (isfinite(dv) && fabs(dv - rlon) < 0.15) {
                              char *kcopy = strdup(key);
                              if (kcopy) { dblp->items[dblp->count].key = kcopy; dblp->items[dblp->count].val = flon; dblp->count++; dblp->hasLon = true; }
                          }
                      } else if (vt == XPC_TYPE_SHMEM) {
                          atomic_fetch_add(&gXpcShmemSeen, 1);
                      } else if (vt == XPC_TYPE_DICTIONARY || vt == XPC_TYPE_ARRAY) {
                          if (gs_rewrite_xpc_obj(val, depth + 1, rlat, rlon, flat, flon)) {
                              childChanged = true;
                          }
                      }
                      return true;
                  });
                  for (int i = 0; i < dlist.count; i++) {
                      xpc_dictionary_set_data(obj, dlist.items[i].key, dlist.items[i].buf, dlist.items[i].len);
                      free(dlist.items[i].key);
                      free(dlist.items[i].buf);
                      changed = true;
                  }
                  for (int i = 0; i < dbllist.count; i++) {
                      if (dbllist.hasLat && dbllist.hasLon) {
                          xpc_dictionary_set_double(obj, dbllist.items[i].key, dbllist.items[i].val);
                          atomic_fetch_add(&gXpcDblRewritten, 1);
                          changed = true;
                      }
                      free(dbllist.items[i].key);
                  }
                  if (childChanged) changed = true;
              } else if (t == XPC_TYPE_ARRAY) {
                  gs_arr_patch_list_t alist;
                  memset(&alist, 0, sizeof(alist));
                  gs_arr_patch_list_t *ap = &alist;
                  __block bool childChanged = false;
                  xpc_array_apply(obj, ^bool(size_t idx, xpc_object_t val) {
                      if (!val) return true;
                      xpc_type_t vt = xpc_get_type(val);
                      if (vt == XPC_TYPE_DATA && ap->count < 32) {
                          const uint8_t *p = (const uint8_t *)xpc_data_get_bytes_ptr(val);
                          size_t len = xpc_data_get_length(val);
                          uint32_t pairs = 0;
                          bool nonAdj = false;
                          uint8_t *patched = gs_make_patched_blob(p, len, rlat, rlon, flat, flon, &pairs, &nonAdj);
                          if (patched) {
                              ap->items[ap->count].idx = idx;
                              ap->items[ap->count].buf = patched;
                              ap->items[ap->count].len = len;
                              ap->count++;
                              atomic_fetch_add(&gXpcBlobsRewritten, 1);
                              atomic_fetch_add(&gXpcPairsRewritten, pairs);
                              if (nonAdj) atomic_fetch_add(&gXpcNonAdjRewritten, 1);
                          }
                      } else if (vt == XPC_TYPE_SHMEM) {
                          atomic_fetch_add(&gXpcShmemSeen, 1);
                      } else if (vt == XPC_TYPE_DICTIONARY || vt == XPC_TYPE_ARRAY) {
                          if (gs_rewrite_xpc_obj(val, depth + 1, rlat, rlon, flat, flon)) {
                              childChanged = true;
                          }
                      }
                      return true;
                  });
                  for (int i = 0; i < alist.count; i++) {
                      xpc_array_set_data(obj, alist.items[i].idx, alist.items[i].buf, alist.items[i].len);
                      free(alist.items[i].buf);
                      changed = true;
                  }
                  if (childChanged) changed = true;
              }
              return changed;
          }

          static void gs_handle_outbound_xpc(xpc_object_t msg) {
              if (!msg || !atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) return;
              double rlat = gLastRealLat, rlon = gLastRealLon;
              if (fabs(rlat) < 0.05 && fabs(rlon) < 0.05) return;
              @autoreleasepool {
                  @try {
                      GSLocationFactory *factory = [GSLocationFactory shared];
                      if (!factory.active) return;
                      CFAbsoluteTime now = CFAbsoluteTimeGetCurrent();
                      if (now - gCachedFakeTs >= 1.0 || gCachedFakeTs == 0.0) {
                          CLLocation *dummy = [[CLLocation alloc] initWithLatitude:rlat longitude:rlon];
                          CLLocation *fake = [factory spoofedLocationFromReal:dummy];
                          if (!fake || !CLLocationCoordinate2DIsValid(fake.coordinate)) return;
                          gCachedFakeLat = fake.coordinate.latitude;
                          gCachedFakeLon = fake.coordinate.longitude;
                          gCachedFakeTs = now;
                      }
                      bool did = gs_rewrite_xpc_obj(msg, 0, rlat, rlon, gCachedFakeLat, gCachedFakeLon);
                      uint32_t n = atomic_fetch_add(&gXpcTotalCalls, 1) + 1;
                      if (did || (n & 63) == 1) gs_xpc_publish();
                  } @catch (NSException *e) {
                      (void)e;
                  }
              }
          }

          static void (*gOrigXpcSendMsg)(xpc_connection_t, xpc_object_t) = NULL;
          static void (*gOrigXpcSendNotif)(xpc_connection_t, xpc_object_t) = NULL;
          static void (*gOrigXpcSendReply)(xpc_connection_t, xpc_object_t, dispatch_queue_t, xpc_handler_t) = NULL;
          static xpc_object_t (*gOrigXpcSendSync)(xpc_connection_t, xpc_object_t) = NULL;

          static void gs_xpc_send_msg(xpc_connection_t conn, xpc_object_t msg) {
              if (!gInXpcHook) {
                  gInXpcHook = 1;
                  gs_handle_outbound_xpc(msg);
                  gInXpcHook = 0;
              }
              if (gOrigXpcSendMsg) gOrigXpcSendMsg(conn, msg);
          }

          static void gs_xpc_send_notif(xpc_connection_t conn, xpc_object_t msg) {
              if (!gInXpcHook) {
                  gInXpcHook = 1;
                  gs_handle_outbound_xpc(msg);
                  gInXpcHook = 0;
              }
              if (gOrigXpcSendNotif) gOrigXpcSendNotif(conn, msg);
          }

          static void gs_xpc_send_reply(xpc_connection_t conn, xpc_object_t msg, dispatch_queue_t q, xpc_handler_t h) {
              if (!gInXpcHook) {
                  gInXpcHook = 1;
                  gs_handle_outbound_xpc(msg);
                  gInXpcHook = 0;
              }
              if (gOrigXpcSendReply) gOrigXpcSendReply(conn, msg, q, h);
          }

          static xpc_object_t gs_xpc_send_sync(xpc_connection_t conn, xpc_object_t msg) {
              if (!gInXpcHook) {
                  gInXpcHook = 1;
                  gs_handle_outbound_xpc(msg);
                  gInXpcHook = 0;
              }
              return gOrigXpcSendSync ? gOrigXpcSendSync(conn, msg) : NULL;
          }

          __attribute__((constructor)) static void gs_diag_init(void) {
              gInXpcHook = 1;
              gs_diag_publish();
              MSHookFunction((void *)xpc_connection_send_message, (void *)gs_xpc_send_msg, (void **)&gOrigXpcSendMsg);
              if (gOrigXpcSendMsg) atomic_store(&gXpcHookedMsg, 1);
              void *notifSym = dlsym(RTLD_DEFAULT, "xpc_connection_send_notification");
              if (notifSym) {
                  MSHookFunction(notifSym, (void *)gs_xpc_send_notif, (void **)&gOrigXpcSendNotif);
                  if (gOrigXpcSendNotif) atomic_store(&gXpcHookedNotif, 1);
              }
              MSHookFunction((void *)xpc_connection_send_message_with_reply, (void *)gs_xpc_send_reply, (void **)&gOrigXpcSendReply);
              if (gOrigXpcSendReply) atomic_store(&gXpcHookedReply, 1);
              MSHookFunction((void *)xpc_connection_send_message_with_reply_sync, (void *)gs_xpc_send_sync, (void **)&gOrigXpcSendSync);
              if (gOrigXpcSendSync) atomic_store(&gXpcHookedSync, 1);
              gs_xpc_publish();
              gInXpcHook = 0;
          }'''
          assert tx.count(old_anchor) == 1
          tx = tx.replace(old_anchor, xpc_rewriter, 1)

          old_fn = '''static void gs_encodeWithCoder(id self, SEL _cmd, NSCoder *coder) {
              @try {
                  GSLocationFactory *factory = [GSLocationFactory shared];
                  if (factory.active && [self isKindOfClass:[CLLocation class]]) {
                      CLLocation *real = (CLLocation *)self;

                      // Only rewrite plausible position fixes. Region/visit archiving and
                      // other internal round-trips of a CLLocation with an invalid
                      // coordinate are left alone.
                      if (CLLocationCoordinate2DIsValid(real.coordinate)) {
                          [factory noteRealLocation:real];
                          CLLocation *fake = [factory spoofedLocationFromReal:real];
                          if (fake && gEncodeWithCoderOrig) {
                              if (GEOSHIM_DEBUG_BUILD) {
                                  GSLog(@"locationd: encode %f,%f -> %f,%f",
                                        real.coordinate.latitude, real.coordinate.longitude,
                                        fake.coordinate.latitude, fake.coordinate.longitude);
                              }
                              ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(fake, _cmd, coder);
                              return;
                          }
                      }
                  }
              } @catch (NSException *e) {
                  GSLog(@"locationd: encodeWithCoder substitution failed: %@", e);
              }

              if (gEncodeWithCoderOrig) {
                  ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(self, _cmd, coder);
              }
          }'''

          new_fn = '''static void gs_encodeWithCoder(id self, SEL _cmd, NSCoder *coder) {
              gs_diag_inc(&gDiagEnter);
              @try {
                  GSLocationFactory *factory = [GSLocationFactory shared];
                  if (factory.active && [self isKindOfClass:[CLLocation class]]) {
                      CLLocation *real = (CLLocation *)self;

                      // Only rewrite plausible position fixes. Region/visit archiving and
                      // other internal round-trips of a CLLocation with an invalid
                      // coordinate are left alone.
                      if (CLLocationCoordinate2DIsValid(real.coordinate)) {
                          if (fabs(real.coordinate.latitude) > 0.1 || fabs(real.coordinate.longitude) > 0.1) {
                              gLastRealLat = real.coordinate.latitude;
                              gLastRealLon = real.coordinate.longitude;
                              atomic_store_explicit(&gHasRealCoord, 1, memory_order_release);
                          }
                          [factory noteRealLocation:real];
                          CLLocation *fake = [factory spoofedLocationFromReal:real];
                          if (fake && gEncodeWithCoderOrig) {
                              gs_diag_inc(&gDiagSpoof);
                              if (GEOSHIM_DEBUG_BUILD) {
                                  GSLog(@"locationd: encode %f,%f -> %f,%f",
                                        real.coordinate.latitude, real.coordinate.longitude,
                                        fake.coordinate.latitude, fake.coordinate.longitude);
                              }
                              ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(fake, _cmd, coder);
                              return;
                          }
                      }
                  }
              } @catch (NSException *e) {
                  gs_diag_inc(&gDiagThrow);
                  GSLog(@"locationd: encodeWithCoder substitution failed: %@", e);
              }

              if (gEncodeWithCoderOrig) {
                  ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(self, _cmd, coder);
              }
          }'''
          assert tx.count(old_fn) == 1
          tx = tx.replace(old_fn, new_fn, 1)
          open("Tweak.x", "w").write(tx)

          m = open("cli/main.m").read()
          old_json_anchor = "static int commandStatusJSON(void) {"
          diag_fn = '''static void printEncodeDiag(void) {
              int tok = -1;
              if (notify_register_check("xyz.regulad.geoshim.diag", &tok) == NOTIFY_STATUS_OK) {
                  uint64_t v = 0;
                  notify_get_state(tok, &v);
                  notify_cancel(tok);
                  printf("  encode hook: diag_alive=%u calls=%llu spoofed=%llu threw=%llu\\n",
                         (unsigned)((v >> 63) & 1),
                         (unsigned long long)(v & 0xFFFF),
                         (unsigned long long)((v >> 16) & 0xFFFF),
                         (unsigned long long)((v >> 32) & 0xFFFF));
              }
              int rt = -1;
              if (notify_register_check("xyz.regulad.geoshim.real", &rt) == NOTIFY_STATUS_OK) {
                  uint64_t rv = 0;
                  notify_get_state(rt, &rv);
                  notify_cancel(rt);
                  int32_t ilat = (int32_t)(uint32_t)(rv & 0xFFFFFFFFULL);
                  int32_t ilon = (int32_t)(uint32_t)((rv >> 32) & 0xFFFFFFFFULL);
                  printf("  real coord:  %.4f, %.4f\\n", ilat / 10000.0, ilon / 10000.0);
              }
              int xt = -1, xt2 = -1;
              uint64_t xv = 0, xv2 = 0;
              if (notify_register_check("xyz.regulad.geoshim.xpc", &xt) == NOTIFY_STATUS_OK) {
                  notify_get_state(xt, &xv); notify_cancel(xt);
              }
              if (notify_register_check("xyz.regulad.geoshim.xpc2", &xt2) == NOTIFY_STATUS_OK) {
                  notify_get_state(xt2, &xv2); notify_cancel(xt2);
              }
              printf("  xpc rewrite: alive=%u hooks=%u/%u/%u/%u blobs=%llu pairs=%llu nonadj=%llu dbls=%llu f32=%llu shmem=%llu\\n",
                     (unsigned)((xv >> 63) & 1),
                     (unsigned)((xv >> 62) & 1),
                     (unsigned)((xv >> 61) & 1),
                     (unsigned)((xv >> 60) & 1),
                     (unsigned)((xv >> 59) & 1),
                     (unsigned long long)((xv >> 20) & 0xFFFFF),
                     (unsigned long long)(xv & 0xFFFFF),
                     (unsigned long long)(xv2 & 0xFFFF),
                     (unsigned long long)((xv2 >> 16) & 0xFFFF),
                     (unsigned long long)((xv2 >> 32) & 0xFFFF),
                     (unsigned long long)((xv2 >> 48) & 0xFFFF));
          }

          ''' + old_json_anchor
          assert m.count(old_json_anchor) == 1
          m = m.replace(old_json_anchor, diag_fn, 1)

          old_visit = '''        printf("  visit hook:      %s\\n", (st & GS_STATUS_VISIT_HOOK) ? "installed" : "missing");'''
          new_visit = old_visit + '''
                  printEncodeDiag();'''
          assert m.count(old_visit) == 1
          m = m.replace(old_visit, new_visit, 1)
          open("cli/main.m", "w").write(m)

          mk = open("Makefile").read()
          mk = re.sub(r'(?m)^(\s*\w+_LIBRARIES\s*=.*)$',
                      lambda mm: re.sub(r'\bsandy\b', '', mm.group(1)), mk)
          mk = re.sub(r'(?m)^\s*SUBPROJECTS\s*\+=\s*prefs\s*\n', '', mk)
          open("Makefile", "w").write(mk)

          ctl = open("control").read()
          ctl = re.sub(r'(?m)^Depends:.*$', 'Depends: ellekit', ctl)
          open("control", "w").write(ctl)

          shutil.rmtree("layout/Library/PreferenceLoader", ignore_errors=True)

          assert plistlib.load(open("GeoShim.plist", "rb")) == {"Filter": {"Executables": ["locationd"]}}
          assert "gXpcNonAdjRewritten" in open("Tweak.x").read()
          assert "nonadj=" in open("cli/main.m").read()
          print("patch ok")
          PY

      - name: Setup RootHide Theos (macOS + Xcode)
        run: |
          brew install ldid dpkg xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Build .deb (debug build)
        run: |
          export THEOS="$HOME/theos"
          make package ARCHS=arm64e

      - name: Verify ABI, package, diagnostics
        run: |
          python3 - << 'PY'
          import glob, os, struct, sys
          cands = []
          for pat in ("**/GeoShim.dylib", "**/geoshim"):
              cands += glob.glob(os.path.join(".theos/obj", pat), recursive=True)
          files = [p for p in cands if os.path.isfile(p)]
          if not files:
              sys.exit("no built binaries found")
          bad = []
          for p in files:
              magic, cputype, subtype = struct.unpack("<III", open(p, "rb").read(12))
              print(f"{p}: cputype=0x{cputype:08x} cpusubtype=0x{subtype:08x}")
              if cputype != 0x0100000C or not (subtype & 0x80000000):
                  bad.append(p)
          if bad:
              sys.exit("old arm64e ABI: " + ", ".join(bad))
          print("OK: arm64e ptrauth ABI")
          PY
          DEB=$(ls packages/*.deb | head -n 1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Package Version Architecture Depends
          [ "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64e" ] || { echo "bad package arch"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E 'GeoShim\.dylib$|/geoshim$'
          rm -rf /tmp/debx && dpkg-deb -x "$DEB" /tmp/debx
          strings /tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.dylib | grep -q "regulad.geoshim.xpc2" || { echo "xpc v2 missing in dylib"; exit 1; }
          strings /tmp/debx/usr/local/bin/geoshim | grep -q "nonadj=" || { echo "xpc v2 output missing in cli"; exit 1; }
          python3 -c 'import plistlib; p=plistlib.load(open("/tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.plist","rb")); assert p=={"Filter":{"Executables":["locationd"]}}, p; print("filter ok")'

      - name: Save .deb file
        uses: actions/upload-artifact@v4
        with:
          name: geoshim-deb-${{ matrix.os }}
          path: packages/*.deb
          if-no-files-found: error

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: geoshim-deb-*
          merge-multiple: true
          path: dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          DEB=$(ls dist/*.deb 2>/dev/null | head -n 1)
          if [ -z "$DEB" ]; then echo "no .deb produced"; exit 1; fi
          cp "$DEB" dist/geoshim-latest.deb
          gh release view latest-build >/dev/null 2>&1 || \
            gh release create latest-build --title "GeoShim latest build" --notes "Automated build ${GITHUB_SHA}"
          gh release upload latest-build dist/geoshim-latest.deb --clobber
