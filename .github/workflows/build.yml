          - (void)movePinTo:(CLLocationCoordinate2D)coord centerMap:(BOOL)center zoom:(double)zoom {
              self.selectedCoord = coord;
              self.mapView.pinCoord = coord;
              self.coordLabel.text = [NSString stringWithFormat:@"%.6f, %.6f", coord.latitude, coord.longitude];
              if (center) {
                  self.mapView.centerLat = coord.latitude;
                  self.mapView.centerLon = coord.longitude;
                  if (zoom > 0) self.mapView.zoom = zoom;
              }
              [self.mapView reloadTiles];
          }

          - (double)currentJitterMeters {
              switch (self.jitterControl.selectedSegmentIndex) {
                  case 0: return 0.0;
                  case 2: return 5.0;
                  default: return 2.0;
              }
          }

          - (void)jitterChanged { [NSUserDefaults.standardUserDefaults setInteger:self.jitterControl.selectedSegmentIndex forKey:kJitterIdxKey]; }
          - (void)zoomInTapped  { [self.mapView zoomBy:1.0]; }
          - (void)zoomOutTapped { [self.mapView zoomBy:-1.0]; }
          - (void)centerOnPin   { [self movePinTo:self.selectedCoord centerMap:YES zoom:0]; }

          - (void)cycleMapType {
              self.mapView.styleIndex = (self.mapView.styleIndex + 1) % 3;
              [NSUserDefaults.standardUserDefaults setInteger:self.mapView.styleIndex forKey:kMapStyleKey];
              [self.styleBadge setTitle:[self styleTitle:self.mapView.styleIndex] forState:UIControlStateNormal];
              [self.mapView reloadTiles];
          }

          - (void)editAltitude {
              UIAlertController *ac = [UIAlertController alertControllerWithTitle:@"Высота (метры)" message:nil preferredStyle:UIAlertControllerStyleAlert];
              [ac addTextFieldWithConfigurationHandler:^(UITextField *tf) {
                  tf.keyboardType = UIKeyboardTypeDecimalPad;
                  tf.text = [NSString stringWithFormat:@"%.0f", self.altitudeMeters];
              }];
              [ac addAction:[UIAlertAction actionWithTitle:@"Отмена" style:UIAlertActionStyleCancel handler:nil]];
              [ac addAction:[UIAlertAction actionWithTitle:@"ОК" style:UIAlertActionStyleDefault handler:^(UIAlertAction *a) {
                  double v = [ac.textFields.firstObject.text doubleValue];
                  if (isfinite(v) && v >= -100.0 && v <= 10000.0) {
                      self.altitudeMeters = v;
                      [NSUserDefaults.standardUserDefaults setDouble:v forKey:kAltitudeKey];
                      [self.altButton setTitle:[NSString stringWithFormat:@"Высота: %.0fm", v] forState:UIControlStateNormal];
                  }
              }]];
              [self presentViewController:ac animated:YES completion:nil];
          }

          - (void)refreshStatus {
              BOOL enabled = NO;
              uint32_t blobs = 0;
              BOOL alive = gsReadDaemonStatus(&enabled, &blobs);
              self.mapView.spoofActive = enabled;

              if (!alive) {
                  self.statusDot.backgroundColor = UIColor.systemOrangeColor;
                  self.statusLabel.text = @"ДЕМОН ОЖИДАЕТ";
                  self.statusLabel.textColor = UIColor.systemOrangeColor;
              } else if (enabled) {
                  self.statusDot.backgroundColor = UIColor.systemGreenColor;
                  self.statusLabel.text = [NSString stringWithFormat:@"АКТИВНО (XPC: %u)", blobs];
                  self.statusLabel.textColor = UIColor.systemGreenColor;
                  [self.startButton setTitle:@"Перенести сюда" forState:UIControlStateNormal];
                  self.startButton.backgroundColor = UIColor.systemGreenColor;
              } else {
                  self.statusDot.backgroundColor = UIColor.systemGrayColor;
                  self.statusLabel.text = @"ВЫКЛЮЧЕНО";
                  self.statusLabel.textColor = UIColor.secondaryLabelColor;
                  [self.startButton setTitle:@"Включить точку" forState:UIControlStateNormal];
                  self.startButton.backgroundColor = UIColor.systemBlueColor;
              }

              self.stopButton.alpha = enabled ? 1.0 : 0.45;
              self.stopButton.enabled = enabled;

              CLLocationCoordinate2D realC;
              if (gsReadRealCoord(&realC)) {
                  self.realLabel.text = [NSString stringWithFormat:@"Real: %.4f, %.4f", realC.latitude, realC.longitude];
                  self.mapView.realCoord = realC;
                  self.mapView.hasRealCoord = YES;
              } else {
                  self.realLabel.text = @"Real: —";
                  self.mapView.hasRealCoord = NO;
              }
              [self.mapView updateMarkers];
          }

          - (void)applySpoofTapped {
              [[[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium] impactOccurred];
              self.startButton.enabled = NO;
              NSArray<NSString *> *args = @[
                  @"start",
                  @"-x", [NSString stringWithFormat:@"%.6f", self.selectedCoord.latitude],
                  @"-y", [NSString stringWithFormat:@"%.6f", self.selectedCoord.longitude],
                  @"-a", [NSString stringWithFormat:@"%.1f", self.altitudeMeters],
                  @"--jitter", [NSString stringWithFormat:@"%.1f", [self currentJitterMeters]]
              ];
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  int rc = gsRunCLI(args);
                  dispatch_async(dispatch_get_main_queue(), ^{
                      self.startButton.enabled = YES;
                      if (rc == 0) {
                          [[[UINotificationFeedbackGenerator alloc] init] notificationOccurred:UINotificationFeedbackTypeSuccess];
                          [self refreshStatus];
                      } else {
                          [self showError:[NSString stringWithFormat:@"geoshim start завершился с кодом %d\nПуть: %@", rc, gsCLIPath()]];
                      }
                  });
              });
          }

          - (void)stopSpoofTapped {
              [[[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleMedium] impactOccurred];
              self.stopButton.enabled = NO;
              dispatch_async(dispatch_get_global_queue(QOS_CLASS_USER_INITIATED, 0), ^{
                  int rc = gsRunCLI(@[@"stop"]);
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (rc == 0) {
                          [[[UINotificationFeedbackGenerator alloc] init] notificationOccurred:UINotificationFeedbackTypeSuccess];
                          [self refreshStatus];
                      } else {
                          self.stopButton.enabled = YES;
                          [self showError:[NSString stringWithFormat:@"geoshim stop завершился с кодом %d", rc]];
                      }
                  });
              });
          }

          - (void)showError:(NSString *)msg {
              UIAlertController *ac = [UIAlertController alertControllerWithTitle:@"Ошибка" message:msg preferredStyle:UIAlertControllerStyleAlert];
              [ac addAction:[UIAlertAction actionWithTitle:@"ОК" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:ac animated:YES completion:nil];
          }

          - (void)openFavorites {
              GSFavoritesViewController *fvc = [[GSFavoritesViewController alloc] initWithStyle:UITableViewStyleInsetGrouped];
              fvc.currentCoord = self.selectedCoord;
              __weak typeof(self) weakSelf = self;
              fvc.onPick = ^(double lat, double lon) {
                  [weakSelf movePinTo:CLLocationCoordinate2DMake(lat, lon) centerMap:YES zoom:15.5];
              };
              UINavigationController *nav = [[UINavigationController alloc] initWithRootViewController:fvc];
              if (@available(iOS 15.0, *)) {
                  nav.sheetPresentationController.detents = @[UISheetPresentationControllerDetent.mediumDetent, UISheetPresentationControllerDetent.largeDetent];
                  nav.sheetPresentationController.prefersGrabberVisible = YES;
              }
              [self presentViewController:nav animated:YES completion:nil];
          }

          - (void)quickSaveFavorite {
              UIAlertController *ac = [UIAlertController alertControllerWithTitle:@"В закладки"
                                                                          message:[NSString stringWithFormat:@"%.6f, %.6f", self.selectedCoord.latitude, self.selectedCoord.longitude]
                                                                   preferredStyle:UIAlertControllerStyleAlert];
              [ac addTextFieldWithConfigurationHandler:^(UITextField *tf) {
                  tf.placeholder = @"Название точки";
                  tf.autocapitalizationType = UITextAutocapitalizationTypeSentences;
              }];
              [ac addAction:[UIAlertAction actionWithTitle:@"Отмена" style:UIAlertActionStyleCancel handler:nil]];
              [ac addAction:[UIAlertAction actionWithTitle:@"Сохранить" style:UIAlertActionStyleDefault handler:^(UIAlertAction *a) {
                  NSArray *saved = [NSUserDefaults.standardUserDefaults arrayForKey:kFavoritesKey];
                  NSMutableArray *arr = saved ? [saved mutableCopy] : [NSMutableArray array];
                  NSString *name = [ac.textFields.firstObject.text stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
                  if (!name.length) name = [NSString stringWithFormat:@"Точка %lu", (unsigned long)(arr.count + 1)];
                  [arr insertObject:@{@"name": name, @"lat": @(self.selectedCoord.latitude), @"lon": @(self.selectedCoord.longitude)} atIndex:0];
                  [NSUserDefaults.standardUserDefaults setObject:arr forKey:kFavoritesKey];
                  [[[UINotificationFeedbackGenerator alloc] init] notificationOccurred:UINotificationFeedbackTypeSuccess];
              }]];
              [self presentViewController:ac animated:YES completion:nil];
          }

          - (void)pasteOrManualInput {
              NSString *clip = UIPasteboard.generalPasteboard.string ?: @"";
              CLLocationCoordinate2D parsed;
              if (gsParseCoordinateText(clip, &parsed)) {
                  [self movePinTo:parsed centerMap:YES zoom:15.5];
                  [[[UINotificationFeedbackGenerator alloc] init] notificationOccurred:UINotificationFeedbackTypeSuccess];
                  return;
              }
              UIAlertController *ac = [UIAlertController alertControllerWithTitle:@"Ввести координаты"
                                                                          message:@"Вставьте координаты (например: 47.775491, -122.344084) или ссылку из Карт"
                                                                   preferredStyle:UIAlertControllerStyleAlert];
              [ac addTextFieldWithConfigurationHandler:^(UITextField *tf) {
                  tf.placeholder = @"47.775491, -122.344084";
                  tf.text = [NSString stringWithFormat:@"%.6f, %.6f", self.selectedCoord.latitude, self.selectedCoord.longitude];
              }];
              [ac addAction:[UIAlertAction actionWithTitle:@"Отмена" style:UIAlertActionStyleCancel handler:nil]];
              [ac addAction:[UIAlertAction actionWithTitle:@"Перейти" style:UIAlertActionStyleDefault handler:^(UIAlertAction *a) {
                  CLLocationCoordinate2D c;
                  if (gsParseCoordinateText(ac.textFields.firstObject.text ?: @"", &c)) {
                      [self movePinTo:c centerMap:YES zoom:15.5];
                  } else {
                      [self showError:@"Не удалось распознать координаты"];
                  }
              }]];
              [self presentViewController:ac animated:YES completion:nil];
          }

          #pragma mark - Direct HTTPS Search (Photon + Nominatim fallback, zero geod)

          - (void)searchBarSearchButtonClicked:(UISearchBar *)searchBar {
              [searchBar resignFirstResponder];
              NSString *q = [searchBar.text stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
              if (!q.length) { self.resultsTable.hidden = YES; return; }
              CLLocationCoordinate2D direct;
              if (gsParseCoordinateText(q, &direct)) {
                  self.resultsTable.hidden = YES;
                  [self movePinTo:direct centerMap:YES zoom:15.5];
                  return;
              }
              [self runPhotonSearch:q];
          }

          - (void)runPhotonSearch:(NSString *)q {
              [self.searchTask cancel];
              NSString *enc = [q stringByAddingPercentEncodingWithAllowedCharacters:NSCharacterSet.URLQueryAllowedCharacterSet];
              NSString *urlStr = [NSString stringWithFormat:@"https://photon.komoot.io/api/?q=%@&limit=8", enc];
              NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:urlStr]];
              [req setValue:@"GeoShimApp/1.1 (iOS)" forHTTPHeaderField:@"User-Agent"];
              __weak typeof(self) weakSelf = self;
              self.searchTask = [self.mapView.session dataTaskWithRequest:req completionHandler:^(NSData *data, NSURLResponse *resp, NSError *err) {
                  NSMutableArray *parsed = [NSMutableArray array];
                  if (data.length && !err) {
                      NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      NSArray *feats = [json isKindOfClass:[NSDictionary class]] ? json[@"features"] : nil;
                      for (NSDictionary *f in feats) {
                          NSArray *coords = f[@"geometry"][@"coordinates"];
                          NSDictionary *props = f[@"properties"];
                          if ([coords isKindOfClass:[NSArray class]] && coords.count >= 2 && [props isKindOfClass:[NSDictionary class]]) {
                              double lon = [coords[0] doubleValue], lat = [coords[1] doubleValue];
                              NSString *name = props[@"name"] ?: props[@"street"] ?: props[@"city"] ?: @"Место";
                              NSMutableArray *parts = [NSMutableArray array];
                              if (props[@"street"]) [parts addObject:props[@"street"]];
                              if (props[@"city"]) [parts addObject:props[@"city"]];
                              if (props[@"state"]) [parts addObject:props[@"state"]];
                              if (props[@"country"]) [parts addObject:props[@"country"]];
                              [parsed addObject:@{@"name": name, @"sub": [parts componentsJoinedByString:@", "], @"lat": @(lat), @"lon": @(lon)}];
                          }
                      }
                  }
                  dispatch_async(dispatch_get_main_queue(), ^{
                      if (parsed.count > 0) {
                          weakSelf.searchResults = parsed;
                          [weakSelf.resultsTable reloadData];
                          weakSelf.resultsTable.hidden = NO;
                      } else {
                          [weakSelf runNominatimSearch:q];
                      }
                  });
              }];
              [self.searchTask resume];
          }

          - (void)runNominatimSearch:(NSString *)q {
              NSString *enc = [q stringByAddingPercentEncodingWithAllowedCharacters:NSCharacterSet.URLQueryAllowedCharacterSet];
              NSString *urlStr = [NSString stringWithFormat:@"https://nominatim.openstreetmap.org/search?format=json&limit=8&q=%@", enc];
              NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:urlStr]];
              [req setValue:@"GeoShimApp/1.1 (iOS)" forHTTPHeaderField:@"User-Agent"];
              __weak typeof(self) weakSelf = self;
              self.searchTask = [self.mapView.session dataTaskWithRequest:req completionHandler:^(NSData *data, NSURLResponse *resp, NSError *err) {
                  NSMutableArray *parsed = [NSMutableArray array];
                  if (data.length && !err) {
                      NSArray *arr = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      if ([arr isKindOfClass:[NSArray class]]) {
                          for (NSDictionary *d in arr) {
                              if (![d isKindOfClass:[NSDictionary class]]) continue;
                              NSString *disp = d[@"display_name"] ?: @"Место";
                              NSArray *parts = [disp componentsSeparatedByString:@","];
                              NSString *name = parts.firstObject ?: disp;
                              [parsed addObject:@{@"name": name, @"sub": disp, @"lat": @([d[@"lat"] doubleValue]), @"lon": @([d[@"lon"] doubleValue])}];
                          }
                      }
                  }
                  dispatch_async(dispatch_get_main_queue(), ^{
                      weakSelf.searchResults = parsed;
                      [weakSelf.resultsTable reloadData];
                      weakSelf.resultsTable.hidden = (parsed.count == 0);
                  });
              }];
              [self.searchTask resume];
          }

          - (void)searchBar:(UISearchBar *)searchBar textDidChange:(NSString *)searchText {
              if (!searchText.length) self.resultsTable.hidden = YES;
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section { return self.searchResults.count; }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"res"];
              if (!cell) cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:@"res"];
              NSDictionary *d = self.searchResults[indexPath.row];
              cell.textLabel.text = d[@"name"];
              cell.detailTextLabel.text = d[@"sub"];
              cell.detailTextLabel.textColor = UIColor.secondaryLabelColor;
              cell.backgroundColor = UIColor.clearColor;
              return cell;
          }

          - (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
              [tableView deselectRowAtIndexPath:indexPath animated:YES];
              NSDictionary *d = self.searchResults[indexPath.row];
              self.resultsTable.hidden = YES;
              [self.searchBar resignFirstResponder];
              [self movePinTo:CLLocationCoordinate2DMake([d[@"lat"] doubleValue], [d[@"lon"] doubleValue]) centerMap:YES zoom:15.5];
          }

          @end
          ''')

          # 6. Wire app subproject into top-level Makefile, strip prefs & libSandy
          mk = open("Makefile").read()
          mk = re.sub(r'(?m)^(\s*\w+_LIBRARIES\s*=.*)$',
                      lambda mm: re.sub(r'\bsandy\b', '', mm.group(1)), mk)
          mk = re.sub(r'(?m)^\s*SUBPROJECTS\s*\+=\s*prefs\s*\n', '', mk)
          agg = "include $(THEOS_MAKE_PATH)/aggregate.mk"
          assert agg in mk, "aggregate.mk not found in Makefile"
          if "SUBPROJECTS += app" not in mk:
              mk = mk.replace(agg, "SUBPROJECTS += app\n" + agg, 1)
          open("Makefile", "w").write(mk)

          ctl = open("control").read()
          ctl = re.sub(r'(?m)^Depends:.*$', 'Depends: ellekit', ctl)
          open("control", "w").write(ctl)

          shutil.rmtree("layout/Library/PreferenceLoader", ignore_errors=True)

          # 7. RootHide-aware postinst / prerm to auto-register Home Screen icon via uicache
          os.makedirs("layout/DEBIAN", exist_ok=True)
          uicache_add = '''
          APP=""
          if command -v jbroot >/dev/null 2>&1; then
              APP="$(jbroot /Applications/GeoShimApp.app 2>/dev/null || true)"
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
              for d in /var/containers/Bundle/Application/.jbroot-*/Applications/GeoShimApp.app /var/jb/Applications/GeoShimApp.app /Applications/GeoShimApp.app; do
                  if [ -d "$d" ]; then APP="$d"; break; fi
              done
          fi
          if [ -n "$APP" ] && [ -d "$APP" ]; then
              uicache -p "$APP" >/dev/null 2>&1 || true
          fi
          '''
          postinst_path = "layout/DEBIAN/postinst"
          if os.path.exists(postinst_path):
              pi = open(postinst_path).read()
              if "GeoShimApp.app" not in pi:
                  if re.search(r'(?m)^exit\s+0\s*$', pi):
                      pi = re.sub(r'(?m)^exit\s+0\s*$', uicache_add + '\nexit 0', pi, count=1)
                  else:
                      pi = pi + "\n" + uicache_add + "\nexit 0\n"
              open(postinst_path, "w").write(pi)
          else:
              open(postinst_path, "w").write("#!/bin/sh\n" + uicache_add + "\nexit 0\n")
          os.chmod(postinst_path, 0o755)

          uicache_del = '''
          if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
              APP=""
              if command -v jbroot >/dev/null 2>&1; then
                  APP="$(jbroot /Applications/GeoShimApp.app 2>/dev/null || true)"
              fi
              if [ -z "$APP" ] || [ ! -d "$APP" ]; then
                  for d in /var/containers/Bundle/Application/.jbroot-*/Applications/GeoShimApp.app /var/jb/Applications/GeoShimApp.app /Applications/GeoShimApp.app; do
                      if [ -d "$d" ]; then APP="$d"; break; fi
                  done
              fi
              if [ -n "$APP" ] && [ -d "$APP" ]; then
                  uicache -u "$APP" >/dev/null 2>&1 || true
              fi
          fi
          '''
          prerm_path = "layout/DEBIAN/prerm"
          if os.path.exists(prerm_path):
              pr = open(prerm_path).read()
              if "GeoShimApp.app" not in pr:
                  if re.search(r'(?m)^exit\s+0\s*$', pr):
                      pr = re.sub(r'(?m)^exit\s+0\s*$', uicache_del + '\nexit 0', pr, count=1)
                  else:
                      pr = pr + "\n" + uicache_del + "\nexit 0\n"
              open(prerm_path, "w").write(pr)
          else:
              open(prerm_path, "w").write("#!/bin/sh\n" + uicache_del + "\nexit 0\n")
          os.chmod(prerm_path, 0o755)

          assert plistlib.load(open("GeoShim.plist", "rb")) == {"Filter": {"Executables": ["locationd"]}}
          assert "gIpcDmachInHits" in open("Tweak.x").read()
          assert "basemaps.cartocdn.com" in open("app/MapViewController.m").read()
          print("patch ok")
          PY

      - name: Setup RootHide Theos (macOS + Xcode)
        run: |
          brew install ldid dpkg xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Build .deb (release + GeoShimApp)
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1 ARCHS=arm64e

      - name: Verify ABI, package, app, entitlements
        run: |
          python3 - << 'PY'
          import glob, os, struct, sys
          cands = []
          for pat in ("**/GeoShim.dylib", "**/geoshim", "**/GeoShimApp.app/GeoShimApp"):
              cands += glob.glob(os.path.join(".theos/obj", pat), recursive=True)
          files = [p for p in cands if os.path.isfile(p)]
          if len(files) < 3:
              sys.exit(f"missing built binaries: {files}")
          bad = []
          for p in files:
              magic, cputype, subtype = struct.unpack("<III", open(p, "rb").read(12))
              print(f"{p}: cputype=0x{cputype:08x} cpusubtype=0x{subtype:08x}")
              if cputype != 0x0100000C or not (subtype & 0x80000000):
                  bad.append(p)
          if bad:
              sys.exit("old arm64e ABI: " + ", ".join(bad))
          print("OK: all 3 binaries have arm64e ptrauth ABI")
          PY
          DEB=$(ls packages/*.deb | head -n 1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Package Version Architecture Depends
          [ "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64e" ] || { echo "bad package arch"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E 'GeoShim\.dylib$|/geoshim$|GeoShimApp\.app/GeoShimApp$'
          rm -rf /tmp/debx && dpkg-deb -x "$DEB" /tmp/debx
          strings /tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.dylib | grep -q "regulad.geoshim.xpc4" || { echo "xpc release missing in dylib"; exit 1; }
          strings /tmp/debx/usr/local/bin/geoshim | grep -q "dmach_in=" || { echo "xpc release output missing in cli"; exit 1; }
          strings /tmp/debx/Applications/GeoShimApp.app/GeoShimApp | grep -q "basemaps.cartocdn.com" || { echo "direct tile engine missing in app"; exit 1; }
          [ -f /tmp/debx/Applications/GeoShimApp.app/AppIcon60x60@3x.png ] || { echo "AppIcon missing"; exit 1; }
          ldid -e /tmp/debx/Applications/GeoShimApp.app/GeoShimApp | grep -q "no-sandbox" || { echo "entitlements missing on GeoShimApp"; exit 1; }
          dpkg-deb -I "$DEB" postinst | grep -q "uicache" || { echo "postinst uicache missing"; exit 1; }
          python3 -c 'import plistlib; p=plistlib.load(open("/tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.plist","rb")); assert p=={"Filter":{"Executables":["locationd"]}}, p; print("filter ok")'

      - name: Save .deb file
        uses: actions/upload-artifact@v4
        with:
          name: geoshim-deb-${{ matrix.os }}
          path: packages/*.deb
          if-no-files-found: error

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: geoshim-deb-*
          merge-multiple: true
          path: dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          DEB=$(ls dist/*.deb 2>/dev/null | head -n 1)
          if [ -z "$DEB" ]; then echo "no .deb produced"; exit 1; fi
          cp "$DEB" dist/geoshim-latest.deb
          gh release view latest-build >/dev/null 2>&1 || \
            gh release create latest-build --title "GeoShim latest build" --notes "Automated build ${GITHUB_SHA}"
          gh release upload latest-build dist/geoshim-latest.deb --clobber
