          #pragma mark - Local Search Cache + Direct HTTPS Search (Photon + Nominatim)

          - (void)cacheSearchResults:(NSArray<NSDictionary *> *)results forQuery:(NSString *)q {
            NSString *key = gsNormQuery(q);
            if (!key.length || !results.count) return;
            self.searchCache[key] = @{@"ts": @([[NSDate date] timeIntervalSince1970]), @"results": results};
            if (self.searchCache.count > 40) {
              NSArray<NSString *> *sortedKeys = [self.searchCache keysSortedByValueUsingComparator:^NSComparisonResult(NSDictionary *a, NSDictionary *b) {
                return [a[@"ts"] compare:b[@"ts"]];
              }];
              for (NSUInteger i = 0; i + 40 < sortedKeys.count; i++) {
                [self.searchCache removeObjectForKey:sortedKeys[i]];
              }
            }
            [NSUserDefaults.standardUserDefaults setObject:self.searchCache forKey:kSearchCacheKey];
          }

          - (NSArray<NSDictionary *> *)cachedResultsForQuery:(NSString *)q {
            NSString *key = gsNormQuery(q);
            if (!key.length) return nil;
            NSDictionary *entry = self.searchCache[key];
            if (![entry isKindOfClass:[NSDictionary class]]) return nil;
            NSTimeInterval ts = [entry[@"ts"] doubleValue];
            if ([[NSDate date] timeIntervalSince1970] - ts > 30.0 * 86400.0) return nil;
            NSArray *res = entry[@"results"];
            return ([res isKindOfClass:[NSArray class]] && res.count > 0) ? res : nil;
          }

          - (NSArray<NSDictionary *> *)localSuggestionsForText:(NSString *)text {
            NSString *norm = gsNormQuery(text);
            if (!norm.length) return [self.recentPlaces copy];
            NSMutableArray<NSDictionary *> *out = [NSMutableArray array];
            NSMutableSet<NSString *> *seen = [NSMutableSet set];
            for (NSDictionary *p in self.recentPlaces) {
              NSString *nm = [p[@"name"] isKindOfClass:[NSString class]] ? p[@"name"] : @"";
              NSString *sb = [p[@"sub"] isKindOfClass:[NSString class]] ? p[@"sub"] : @"";
              if ([nm.lowercaseString rangeOfString:norm].location != NSNotFound ||
                [sb.lowercaseString rangeOfString:norm].location != NSNotFound) {
                NSString *sig = [NSString stringWithFormat:@"%@:%.4f:%.4f", nm, [p[@"lat"] doubleValue], [p[@"lon"] doubleValue]];
                if (![seen containsObject:sig]) { [seen addObject:sig]; [out addObject:p]; }
              }
              if (out.count >= 8) return out;
            }
            for (NSString *qKey in self.searchCache) {
              if ([qKey rangeOfString:norm].location == NSNotFound) continue;
              NSArray *res = self.searchCache[qKey][@"results"];
              if (![res isKindOfClass:[NSArray class]]) continue;
              for (NSDictionary *p in res) {
                NSString *nm = [p[@"name"] isKindOfClass:[NSString class]] ? p[@"name"] : @"";
                NSString *sig = [NSString stringWithFormat:@"%@:%.4f:%.4f", nm, [p[@"lat"] doubleValue], [p[@"lon"] doubleValue]];
                if (![seen containsObject:sig]) { [seen addObject:sig]; [out addObject:p]; }
                if (out.count >= 8) return out;
              }
            }
            return out;
          }

          - (void)recordRecentPlace:(NSDictionary *)place {
            if (![place isKindOfClass:[NSDictionary class]]) return;
            NSString *name = [place[@"name"] isKindOfClass:[NSString class]] ? place[@"name"] : @"Место";
            NSString *sub = [place[@"sub"] isKindOfClass:[NSString class]] ? place[@"sub"] : @"";
            double lat = [place[@"lat"] doubleValue], lon = [place[@"lon"] doubleValue];
            NSDictionary *clean = @{@"name": name, @"sub": sub, @"lat": @(lat), @"lon": @(lon)};
            for (NSInteger i = (NSInteger)self.recentPlaces.count - 1; i >= 0; i--) {
              NSDictionary *e = self.recentPlaces[(NSUInteger)i];
              if ([e[@"name"] isEqualToString:name] && fabs([e[@"lat"] doubleValue] - lat) < 0.001 && fabs([e[@"lon"] doubleValue] - lon) < 0.001) {
                [self.recentPlaces removeObjectAtIndex:(NSUInteger)i];
              }
            }
            [self.recentPlaces insertObject:clean atIndex:0];
            if (self.recentPlaces.count > 8) {
              [self.recentPlaces removeObjectsInRange:NSMakeRange(8, self.recentPlaces.count - 8)];
            }
            [NSUserDefaults.standardUserDefaults setObject:self.recentPlaces forKey:kRecentPlacesKey];
          }

          - (void)searchBarTextDidBeginEditing:(UISearchBar *)searchBar {
            NSArray<NSDictionary *> *sugg = [self localSuggestionsForText:searchBar.text ?: @""];
            if (sugg.count > 0) {
              self.searchResults = sugg;
              [self.resultsTable reloadData];
              self.resultsTable.hidden = NO;
            }
          }

          - (void)searchBarSearchButtonClicked:(UISearchBar *)searchBar {
            [searchBar resignFirstResponder];
            NSString *q = [searchBar.text stringByTrimmingCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet];
            if (!q.length) { self.resultsTable.hidden = YES; return; }
            CLLocationCoordinate2D direct;
            if (gsParseCoordinateText(q, &direct)) {
              self.resultsTable.hidden = YES;
              [self movePinTo:direct centerMap:YES zoom:15.5];
              return;
            }
            NSArray<NSDictionary *> *cached = [self cachedResultsForQuery:q];
            if (cached.count > 0) {
              self.searchResults = cached;
              [self.resultsTable reloadData];
              self.resultsTable.hidden = NO;
              return;
            }
            [self.searchSpinner startAnimating];
            [self runPhotonSearch:q];
          }

          - (void)runPhotonSearch:(NSString *)q {
            [self.searchTask cancel];
            NSString *urlStr = [NSString stringWithFormat:@"https://photon.komoot.io/api/?q=%@&limit=8", gsEncodeQueryValue(q)];
            NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:urlStr]];
            req.cachePolicy = NSURLRequestReloadIgnoringLocalCacheData;
            [req setValue:kTileUA forHTTPHeaderField:@"User-Agent"];
            __weak typeof(self) weakSelf = self;
            self.searchTask = [self.mapView.session dataTaskWithRequest:req completionHandler:^(NSData *data, NSURLResponse *resp, NSError *err) {
              (void)resp;
              if (err && err.code == NSURLErrorCancelled) return;
              NSMutableArray *parsed = [NSMutableArray array];
              if (data.length && !err) {
                NSDictionary *json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                NSArray *feats = [json isKindOfClass:[NSDictionary class]] ? json[@"features"] : nil;
                for (NSDictionary *f in feats) {
                  NSArray *coords = f[@"geometry"][@"coordinates"];
                  NSDictionary *props = f[@"properties"];
                  if ([coords isKindOfClass:[NSArray class]] && coords.count >= 2 && [props isKindOfClass:[NSDictionary class]]) {
                    double lon = [coords[0] doubleValue], lat = [coords[1] doubleValue];
                    NSString *name = props[@"name"] ?: props[@"street"] ?: props[@"city"] ?: @"Место";
                    NSMutableArray *parts = [NSMutableArray array];
                    if (props[@"street"]) [parts addObject:props[@"street"]];
                    if (props[@"city"]) [parts addObject:props[@"city"]];
                    if (props[@"state"]) [parts addObject:props[@"state"]];
                    if (props[@"country"]) [parts addObject:props[@"country"]];
                    [parsed addObject:@{@"name": name ?: @"Место", @"sub": [parts componentsJoinedByString:@", "] ?: @"", @"lat": @(lat), @"lon": @(lon)}];
                  }
                }
              }
              dispatch_async(dispatch_get_main_queue(), ^{
                __strong typeof(weakSelf) self = weakSelf;
                if (!self) return;
                if (parsed.count > 0) {
                  [self.searchSpinner stopAnimating];
                  [self cacheSearchResults:parsed forQuery:q];
                  self.searchResults = parsed;
                  [self.resultsTable reloadData];
                  self.resultsTable.hidden = NO;
                } else {
                  [self runNominatimSearch:q];
                }
              });
            }];
            [self.searchTask resume];
          }

          - (void)runNominatimSearch:(NSString *)q {
            NSString *urlStr = [NSString stringWithFormat:@"https://nominatim.openstreetmap.org/search?format=json&limit=8&q=%@", gsEncodeQueryValue(q)];
            NSMutableURLRequest *req = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:urlStr]];
            req.cachePolicy = NSURLRequestReloadIgnoringLocalCacheData;
            [req setValue:kTileUA forHTTPHeaderField:@"User-Agent"];
            __weak typeof(self) weakSelf = self;
            self.searchTask = [self.mapView.session dataTaskWithRequest:req completionHandler:^(NSData *data, NSURLResponse *resp, NSError *err) {
              (void)resp;
              if (err && err.code == NSURLErrorCancelled) return;
              NSMutableArray *parsed = [NSMutableArray array];
              if (data.length && !err) {
                NSArray *arr = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                if ([arr isKindOfClass:[NSArray class]]) {
                  for (NSDictionary *d in arr) {
                    if (![d isKindOfClass:[NSDictionary class]]) continue;
                    NSString *disp = d[@"display_name"] ?: @"Место";
                    NSArray *parts = [disp componentsSeparatedByString:@","];
                    NSString *name = parts.firstObject ?: disp;
                    [parsed addObject:@{@"name": name ?: @"Место", @"sub": disp ?: @"", @"lat": @([d[@"lat"] doubleValue]), @"lon": @([d[@"lon"] doubleValue])}];
                  }
                }
              }
              dispatch_async(dispatch_get_main_queue(), ^{
                __strong typeof(weakSelf) self = weakSelf;
                if (!self) return;
                [self.searchSpinner stopAnimating];
                if (parsed.count > 0) [self cacheSearchResults:parsed forQuery:q];
                self.searchResults = parsed;
                [self.resultsTable reloadData];
                self.resultsTable.hidden = (parsed.count == 0);
                if (parsed.count == 0) {
                  [self showToast:@"Ничего не найдено" color:UIColor.systemOrangeColor];
                }
              });
            }];
            [self.searchTask resume];
          }

          - (void)searchBar:(UISearchBar *)searchBar textDidChange:(NSString *)searchText {
            if (!searchText.length && !searchBar.isFirstResponder) {
              self.resultsTable.hidden = YES;
              return;
            }
            NSArray<NSDictionary *> *sugg = [self localSuggestionsForText:searchText ?: @""];
            self.searchResults = sugg;
            [self.resultsTable reloadData];
            self.resultsTable.hidden = (sugg.count == 0);
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
            (void)tableView; (void)section;
            return self.searchResults.count;
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
            UITableViewCell *cell = [tableView dequeueReusableCellWithIdentifier:@"res"];
            if (!cell) cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleSubtitle reuseIdentifier:@"res"];
            if ((NSUInteger)indexPath.row >= self.searchResults.count) return cell;
            NSDictionary *d = self.searchResults[indexPath.row];
            cell.textLabel.text = d[@"name"];
            cell.detailTextLabel.text = d[@"sub"];
            cell.detailTextLabel.textColor = UIColor.secondaryLabelColor;
            cell.backgroundColor = UIColor.clearColor;
            return cell;
          }

          - (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
            [tableView deselectRowAtIndexPath:indexPath animated:YES];
            if ((NSUInteger)indexPath.row >= self.searchResults.count) return;
            NSDictionary *d = self.searchResults[indexPath.row];
            [self recordRecentPlace:d];
            self.resultsTable.hidden = YES;
            [self.searchBar resignFirstResponder];
            [self movePinTo:CLLocationCoordinate2DMake([d[@"lat"] doubleValue], [d[@"lon"] doubleValue]) centerMap:YES zoom:15.5];
          }

          @end
          ''')

          # 6. Wire app subproject into top-level Makefile, strip prefs & libSandy
          mk = open("Makefile").read()
          mk = re.sub(r'(?m)^(\s*\w+_LIBRARIES\s*=.*)$',
                      lambda mm: re.sub(r'\bsandy\b', '', mm.group(1)), mk)
          mk = re.sub(r'(?m)^\s*SUBPROJECTS\s*\+=\s*prefs\s*\n', '', mk)
          agg = "include $(THEOS_MAKE_PATH)/aggregate.mk"
          assert agg in mk, "aggregate.mk not found in Makefile"
          if "SUBPROJECTS += app" not in mk:
              mk = mk.replace(agg, "SUBPROJECTS += app\n" + agg, 1)
          open("Makefile", "w").write(mk)

          ctl = open("control").read()
          ctl = re.sub(r'(?m)^Depends:.*$', 'Depends: ellekit', ctl)
          open("control", "w").write(ctl)

          shutil.rmtree("layout/Library/PreferenceLoader", ignore_errors=True)

          # 7. RootHide-aware postinst / prerm to auto-register Home Screen icon via uicache
          os.makedirs("layout/DEBIAN", exist_ok=True)
          uicache_add = '''
          APP=""
          if command -v jbroot >/dev/null 2>&1; then
              APP="$(jbroot /Applications/GeoShimApp.app 2>/dev/null || true)"
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
              for d in /var/containers/Bundle/Application/.jbroot-*/Applications/GeoShimApp.app /var/jb/Applications/GeoShimApp.app /Applications/GeoShimApp.app; do
                  if [ -d "$d" ]; then APP="$d"; break; fi
              done
          fi
          if [ -n "$APP" ] && [ -d "$APP" ]; then
              uicache -p "$APP" >/dev/null 2>&1 || true
          fi
          '''
          postinst_path = "layout/DEBIAN/postinst"
          if os.path.exists(postinst_path):
              pi = open(postinst_path).read()
              if "GeoShimApp.app" not in pi:
                  if re.search(r'(?m)^exit\s+0\s*$', pi):
                      pi = re.sub(r'(?m)^exit\s+0\s*$', uicache_add + '\nexit 0', pi, count=1)
                  else:
                      pi = pi + "\n" + uicache_add + "\nexit 0\n"
              open(postinst_path, "w").write(pi)
          else:
              open(postinst_path, "w").write("#!/bin/sh\n" + uicache_add + "\nexit 0\n")
          os.chmod(postinst_path, 0o755)

          uicache_del = '''
          if [ "$1" = "remove" ] || [ "$1" = "purge" ]; then
              APP=""
              if command -v jbroot >/dev/null 2>&1; then
                  APP="$(jbroot /Applications/GeoShimApp.app 2>/dev/null || true)"
              fi
              if [ -z "$APP" ] || [ ! -d "$APP" ]; then
                  for d in /var/containers/Bundle/Application/.jbroot-*/Applications/GeoShimApp.app /var/jb/Applications/GeoShimApp.app /Applications/GeoShimApp.app; do
                      if [ -d "$d" ]; then APP="$d"; break; fi
                  done
              fi
              if [ -n "$APP" ] && [ -d "$APP" ]; then
                  uicache -u "$APP" >/dev/null 2>&1 || true
              fi
          fi
          '''
          prerm_path = "layout/DEBIAN/prerm"
          if os.path.exists(prerm_path):
              pr = open(prerm_path).read()
              if "GeoShimApp.app" not in pr:
                  if re.search(r'(?m)^exit\s+0\s*$', pr):
                      pr = re.sub(r'(?m)^exit\s+0\s*$', uicache_del + '\nexit 0', pr, count=1)
                  else:
                      pr = pr + "\n" + uicache_del + "\nexit 0\n"
              open(prerm_path, "w").write(pr)
          else:
              open(prerm_path, "w").write("#!/bin/sh\n" + uicache_del + "\nexit 0\n")
          os.chmod(prerm_path, 0o755)

          assert plistlib.load(open("GeoShim.plist", "rb")) == {"Filter": {"Executables": ["locationd"]}}
          assert "regulad.geoshim.target" in open("Tweak.x").read()
          assert "regulad.geoshim.reload" in open("Tweak.x").read()
          assert "regulad.geoshim.reload" in open("app/MapViewController.m").read()
          assert "GSDisplayLinkProxy" in open("app/MapViewController.m").read()
          assert "tile.openstreetmap.org" in open("app/MapViewController.m").read()
          assert "cartocdn" not in open("app/MapViewController.m").read()
          print("patch ok")
          PY

      - name: Setup RootHide Theos (macOS + Xcode)
        run: |
          brew install ldid dpkg xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Build .deb (release v1.3 + GeoShimApp v1.3)
        run: |
          export THEOS="$HOME/theos"
          make package FINALPACKAGE=1 ARCHS=arm64e

      - name: Verify ABI, package, app, entitlements
        run: |
          python3 - << 'PY'
          import glob, os, struct, sys
          cands = []
          for pat in ("**/GeoShim.dylib", "**/geoshim", "**/GeoShimApp.app/GeoShimApp"):
              cands += glob.glob(os.path.join(".theos/obj", pat), recursive=True)
          files = [p for p in cands if os.path.isfile(p)]
          if len(files) < 3:
              sys.exit(f"missing built binaries: {files}")
          bad = []
          for p in files:
              magic, cputype, subtype = struct.unpack("<III", open(p, "rb").read(12))
              print(f"{p}: cputype=0x{cputype:08x} cpusubtype=0x{subtype:08x}")
              if cputype != 0x0100000C or not (subtype & 0x80000000):
                  bad.append(p)
          if bad:
              sys.exit("old arm64e ABI: " + ", ".join(bad))
          print("OK: all 3 binaries have arm64e ptrauth ABI")
          PY
          DEB=$(ls packages/*.deb | head -n 1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Package Version Architecture Depends
          [ "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64e" ] || { echo "bad package arch"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E 'GeoShim\.dylib$|/geoshim$|GeoShimApp\.app/GeoShimApp$'
          rm -rf /tmp/debx && dpkg-deb -x "$DEB" /tmp/debx
          strings /tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.dylib | grep -q "regulad.geoshim.target" || { echo "target notify missing in dylib"; exit 1; }
          strings /tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.dylib | grep -q "regulad.geoshim.reload" || { echo "reload notify missing in dylib"; exit 1; }
          strings /tmp/debx/usr/local/bin/geoshim | grep -q "dmach_in=" || { echo "xpc release output missing in cli"; exit 1; }
          strings /tmp/debx/Applications/GeoShimApp.app/GeoShimApp | grep -q "tile.openstreetmap.org" || { echo "OSM tile engine missing in app"; exit 1; }
          [ -f /tmp/debx/Applications/GeoShimApp.app/AppIcon60x60@3x.png ] || { echo "AppIcon missing"; exit 1; }
          ldid -e /tmp/debx/Applications/GeoShimApp.app/GeoShimApp | grep -q "no-sandbox" || { echo "entitlements missing on GeoShimApp"; exit 1; }
          dpkg-deb -I "$DEB" postinst | grep -q "uicache" || { echo "postinst uicache missing"; exit 1; }
          python3 -c 'import plistlib; p=plistlib.load(open("/tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.plist","rb")); assert p=={"Filter":{"Executables":["locationd"]}}, p; print("filter ok")'

      - name: Save .deb file
        uses: actions/upload-artifact@v4
        with:
          name: geoshim-deb-${{ matrix.os }}
          path: packages/*.deb
          if-no-files-found: error

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: geoshim-deb-*
          merge-multiple: false
          path: dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          find dist -type f -ls
          DEB=$(find dist -name '*.deb' | sort | head -n 1)
          if [ -z "$DEB" ]; then echo "no .deb produced"; exit 1; fi
          rm -rf /tmp/pubcheck && dpkg-deb -x "$DEB" /tmp/pubcheck
          cp "$DEB" dist/geoshim-latest.deb
          gh release view latest-build >/dev/null 2>&1 || \
            gh release create latest-build --title "GeoShim latest build" --notes "Automated build ${GITHUB_SHA}"
          gh release upload latest-build dist/geoshim-latest.deb --clobber
