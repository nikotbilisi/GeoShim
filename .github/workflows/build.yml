name: Build GeoShim RootHide

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: geoshim-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Patch package, logging and XPC read-only probe
        run: |
          python3 - << 'PY'
          import re, plistlib, shutil

          with open("GeoShim.plist", "wb") as f:
              plistlib.dump({"Filter": {"Executables": ["locationd"]}}, f)

          tx = open("Tweak.x").read()
          tx = re.sub(r'#\s*(?:import|include)\s*[<"]libSandy\.h[>"]', '', tx)
          with open("GSConfig.m", "a") as f:
              f.write('\nint libSandy_applyProfile(const char *profileName) { (void)profileName; return 0; }\n')

          with open("GSCommon.h", "a") as f:
              f.write(r'''
          #ifndef GSLOG_DIAG_OVERRIDE
          #define GSLOG_DIAG_OVERRIDE
          #import <Foundation/Foundation.h>
          #import <os/log.h>
          #include <stdio.h>
          static inline void GSLogToOSLog(NSString *m) {
              static os_log_t gslog;
              static dispatch_once_t gs_once;
              dispatch_once(&gs_once, ^{ gslog = os_log_create("xyz.regulad.geoshim", "tweak"); });
              os_log_fault(gslog, "%{public}s", m.UTF8String);
          }
          #undef GSLog
          #define GSLog(fmt, ...) do { NSString *_gsm = [NSString stringWithFormat:@"[GeoShim] " fmt, ##__VA_ARGS__]; NSLog(@"%@", _gsm); GSLogToOSLog(_gsm); } while (0)
          #endif
          ''')

          old_anchor = "static IMP gEncodeWithCoderOrig = NULL;"
          diag_block = old_anchor + r'''

          // --- GeoShim diagnostics + read-only XPC probe ---
          #include <notify.h>
          #include <dispatch/dispatch.h>
          #include <stdatomic.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <string.h>
          #include <math.h>
          #include <dlfcn.h>
          #include <substrate.h>
          #if __has_include(<xpc/xpc.h>)
          #include <xpc/xpc.h>
          #else
          typedef id xpc_object_t;
          typedef xpc_object_t xpc_connection_t;
          typedef const struct _xpc_type_s *xpc_type_t;
          extern const struct _xpc_type_s _xpc_type_dictionary;
          extern const struct _xpc_type_s _xpc_type_data;
          extern const struct _xpc_type_s _xpc_type_double;
          #define XPC_TYPE_DICTIONARY (&_xpc_type_dictionary)
          #define XPC_TYPE_DATA (&_xpc_type_data)
          #define XPC_TYPE_DOUBLE (&_xpc_type_double)
          extern xpc_type_t xpc_get_type(xpc_object_t obj);
          extern bool xpc_dictionary_apply(xpc_object_t xdict, bool (^applier)(const char *key, xpc_object_t value));
          extern const void *xpc_data_get_bytes_ptr(xpc_object_t xdata);
          extern size_t xpc_data_get_length(xpc_object_t xdata);
          extern double xpc_double_get_value(xpc_object_t xdouble);
          extern void xpc_connection_send_message(xpc_connection_t conn, xpc_object_t msg);
          #endif

          static _Atomic uint32_t gDiagEnter = 0;
          static _Atomic uint32_t gDiagSpoof = 0;
          static _Atomic uint32_t gDiagThrow = 0;
          static double gLastRealLat = 0.0;
          static double gLastRealLon = 0.0;
          static _Atomic uint32_t gHasRealCoord = 0;

          static _Atomic uint32_t gXpcMsgCalls = 0;
          static _Atomic uint32_t gXpcNotifCalls = 0;
          static _Atomic uint32_t gXpcHookedMsg = 0;
          static _Atomic uint32_t gXpcHookedNotif = 0;
          static _Atomic uint32_t gXpcDblKey = 0;
          static _Atomic uint32_t gXpcHits = 0;
          static _Atomic uint32_t gXpcBlobLen = 0;
          static _Atomic uint32_t gXpcOff1 = 0xFFF;
          static _Atomic uint32_t gXpcOff2 = 0xFFF;
          static _Atomic uint32_t gXpcFnMask = 0;
          static _Atomic uint32_t gXpcFlags = 0; // bit0=bplist, bit1=big_endian

          static __thread int gInXpcHook = 0;

          #define GS_DIAG_NOTIFY  "xyz.regulad.geoshim.diag"
          #define GS_XPC_NOTIFY   "xyz.regulad.geoshim.xpc"
          #define GS_XPC2_NOTIFY  "xyz.regulad.geoshim.xpc2"

          static void gs_diag_publish(void) {
              static int tok = -1;
              static dispatch_once_t once;
              dispatch_once(&once, ^{ notify_register_check(GS_DIAG_NOTIFY, &tok); });
              if (tok == -1) return;
              uint64_t v = (1ULL << 63)
                         | (uint64_t)(atomic_load(&gDiagEnter) & 0xFFFF)
                         | ((uint64_t)(atomic_load(&gDiagSpoof) & 0xFFFF) << 16)
                         | ((uint64_t)(atomic_load(&gDiagThrow) & 0xFFFF) << 32);
              notify_set_state(tok, v);
          }

          static void gs_xpc_publish(void) {
              static int tok1 = -1, tok2 = -1;
              static dispatch_once_t once;
              dispatch_once(&once, ^{
                  notify_register_check(GS_XPC_NOTIFY, &tok1);
                  notify_register_check(GS_XPC2_NOTIFY, &tok2);
              });
              if (tok1 != -1) {
                  uint32_t hits = atomic_load(&gXpcHits);
                  uint64_t v1 = (hits ? (1ULL << 63) : 0ULL)
                              | (uint64_t)(hits & 0xFFFF)
                              | ((uint64_t)(atomic_load(&gXpcBlobLen) & 0xFFFF) << 16)
                              | ((uint64_t)(atomic_load(&gXpcOff1) & 0xFFF) << 32)
                              | ((uint64_t)(atomic_load(&gXpcOff2) & 0xFFF) << 44)
                              | ((uint64_t)(atomic_load(&gXpcFnMask) & 0x3) << 56)
                              | ((uint64_t)(atomic_load(&gXpcFlags) & 0x3) << 58);
                  notify_set_state(tok1, v1);
              }
              if (tok2 != -1) {
                  uint64_t v2 = (1ULL << 63)
                              | ((uint64_t)(atomic_load(&gXpcHookedMsg) & 1) << 62)
                              | ((uint64_t)(atomic_load(&gXpcHookedNotif) & 1) << 61)
                              | ((uint64_t)(atomic_load(&gHasRealCoord) & 1) << 60)
                              | ((uint64_t)(atomic_load(&gXpcDblKey) & 1) << 59)
                              | (uint64_t)(atomic_load(&gXpcMsgCalls) & 0xFFFFFF)
                              | ((uint64_t)(atomic_load(&gXpcNotifCalls) & 0xFFFFFF) << 24);
                  notify_set_state(tok2, v2);
              }
          }

          static void gs_diag_inc(_Atomic uint32_t *c) { atomic_fetch_add(c, 1); gs_diag_publish(); }

          static inline double gs_bswap_double(uint64_t raw) {
              uint64_t sw = __builtin_bswap64(raw);
              double d;
              memcpy(&d, &sw, 8);
              return d;
          }

          static void gs_scan_xpc_blob(const uint8_t *p, size_t len, uint32_t fnBit) {
              if (!p || len < 16 || !atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) return;
              double rlat = gLastRealLat, rlon = gLastRealLon;
              if (fabs(rlat) < 0.05 && fabs(rlon) < 0.05) return;
              size_t lim = len > 4096 ? 4096 : len;
              uint32_t off1 = 0xFFF, off2 = 0xFFF, isBE = 0;
              for (size_t off = 0; off + 16 <= lim; off += 4) {
                  double d0, d1;
                  memcpy(&d0, p + off, 8);
                  memcpy(&d1, p + off + 8, 8);
                  bool mLE = (fabs(d0 - rlat) < 0.05 && fabs(d1 - rlon) < 0.05);
                  bool mBE = false;
                  if (!mLE) {
                      uint64_t u0, u1;
                      memcpy(&u0, p + off, 8);
                      memcpy(&u1, p + off + 8, 8);
                      double b0 = gs_bswap_double(u0), b1 = gs_bswap_double(u1);
                      mBE = (fabs(b0 - rlat) < 0.05 && fabs(b1 - rlon) < 0.05);
                  }
                  if (mLE || mBE) {
                      if (off1 == 0xFFF) { off1 = (uint32_t)off; if (mBE) isBE = 1; }
                      else if (off >= off1 + 16 && off2 == 0xFFF) { off2 = (uint32_t)off; break; }
                  }
              }
              if (off1 != 0xFFF) {
                  uint32_t isBP = (len >= 6 && memcmp(p, "bplist", 6) == 0) ? 1 : 0;
                  atomic_fetch_add(&gXpcHits, 1);
                  atomic_store(&gXpcBlobLen, (uint32_t)(len & 0xFFFF));
                  atomic_store(&gXpcOff1, off1);
                  atomic_store(&gXpcOff2, off2);
                  atomic_fetch_or(&gXpcFnMask, fnBit);
                  atomic_store(&gXpcFlags, (isBP ? 1u : 0u) | (isBE ? 2u : 0u));
                  gs_xpc_publish();
              }
          }

          static void gs_scan_xpc_dict(xpc_object_t dict, int depth, uint32_t fnBit) {
              if (!dict || depth > 3) return;
              if (xpc_get_type(dict) != XPC_TYPE_DICTIONARY) return;
              xpc_dictionary_apply(dict, ^bool(const char *key, xpc_object_t val) {
                  (void)key;
                  if (!val) return true;
                  xpc_type_t t = xpc_get_type(val);
                  if (t == XPC_TYPE_DATA) {
                      gs_scan_xpc_blob((const uint8_t *)xpc_data_get_bytes_ptr(val), xpc_data_get_length(val), fnBit);
                  } else if (t == XPC_TYPE_DICTIONARY) {
                      gs_scan_xpc_dict(val, depth + 1, fnBit);
                  } else if (t == XPC_TYPE_DOUBLE && atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) {
                      double d = xpc_double_get_value(val);
                      if (fabs(d - gLastRealLat) < 0.05 && fabs(gLastRealLat) > 0.05) {
                          atomic_store(&gXpcDblKey, 1);
                      }
                  }
                  return true;
              });
          }

          static void (*gOrigXpcSendMsg)(xpc_connection_t, xpc_object_t) = NULL;
          static void (*gOrigXpcSendNotif)(xpc_connection_t, xpc_object_t) = NULL;

          static void gs_xpc_send_msg(xpc_connection_t conn, xpc_object_t msg) {
              if (!gInXpcHook) {
                  gInXpcHook = 1;
                  uint32_t n = atomic_fetch_add(&gXpcMsgCalls, 1) + 1;
                  gs_scan_xpc_dict(msg, 0, 1);
                  if ((n & 31) == 1) gs_xpc_publish();
                  gInXpcHook = 0;
              }
              if (gOrigXpcSendMsg) gOrigXpcSendMsg(conn, msg);
          }

          static void gs_xpc_send_notif(xpc_connection_t conn, xpc_object_t msg) {
              if (!gInXpcHook) {
                  gInXpcHook = 1;
                  uint32_t n = atomic_fetch_add(&gXpcNotifCalls, 1) + 1;
                  gs_scan_xpc_dict(msg, 0, 2);
                  if ((n & 31) == 1) gs_xpc_publish();
                  gInXpcHook = 0;
              }
              if (gOrigXpcSendNotif) gOrigXpcSendNotif(conn, msg);
          }

          __attribute__((constructor)) static void gs_diag_init(void) {
              gInXpcHook = 1;
              gs_diag_publish();
              MSHookFunction((void *)xpc_connection_send_message, (void *)gs_xpc_send_msg, (void **)&gOrigXpcSendMsg);
              if (gOrigXpcSendMsg) atomic_store(&gXpcHookedMsg, 1);
              void *notifSym = dlsym(RTLD_DEFAULT, "xpc_connection_send_notification");
              if (notifSym) {
                  MSHookFunction(notifSym, (void *)gs_xpc_send_notif, (void **)&gOrigXpcSendNotif);
                  if (gOrigXpcSendNotif) atomic_store(&gXpcHookedNotif, 1);
              }
              gs_xpc_publish();
              gInXpcHook = 0;
          }'''
          assert tx.count(old_anchor) == 1
          tx = tx.replace(old_anchor, diag_block, 1)

          old_fn = '''static void gs_encodeWithCoder(id self, SEL _cmd, NSCoder *coder) {
              @try {
                  GSLocationFactory *factory = [GSLocationFactory shared];
                  if (factory.active && [self isKindOfClass:[CLLocation class]]) {
                      CLLocation *real = (CLLocation *)self;

                      // Only rewrite plausible position fixes. Region/visit archiving and
                      // other internal round-trips of a CLLocation with an invalid
                      // coordinate are left alone.
                      if (CLLocationCoordinate2DIsValid(real.coordinate)) {
                          [factory noteRealLocation:real];
                          CLLocation *fake = [factory spoofedLocationFromReal:real];
                          if (fake && gEncodeWithCoderOrig) {
                              if (GEOSHIM_DEBUG_BUILD) {
                                  GSLog(@"locationd: encode %f,%f -> %f,%f",
                                        real.coordinate.latitude, real.coordinate.longitude,
                                        fake.coordinate.latitude, fake.coordinate.longitude);
                              }
                              ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(fake, _cmd, coder);
                              return;
                          }
                      }
                  }
              } @catch (NSException *e) {
                  GSLog(@"locationd: encodeWithCoder substitution failed: %@", e);
              }

              if (gEncodeWithCoderOrig) {
                  ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(self, _cmd, coder);
              }
          }'''

          new_fn = '''static void gs_encodeWithCoder(id self, SEL _cmd, NSCoder *coder) {
              gs_diag_inc(&gDiagEnter);
              @try {
                  GSLocationFactory *factory = [GSLocationFactory shared];
                  if (factory.active && [self isKindOfClass:[CLLocation class]]) {
                      CLLocation *real = (CLLocation *)self;

                      // Only rewrite plausible position fixes. Region/visit archiving and
                      // other internal round-trips of a CLLocation with an invalid
                      // coordinate are left alone.
                      if (CLLocationCoordinate2DIsValid(real.coordinate)) {
                          gLastRealLat = real.coordinate.latitude;
                          gLastRealLon = real.coordinate.longitude;
                          atomic_store_explicit(&gHasRealCoord, 1, memory_order_release);
                          [factory noteRealLocation:real];
                          CLLocation *fake = [factory spoofedLocationFromReal:real];
                          if (fake && gEncodeWithCoderOrig) {
                              gs_diag_inc(&gDiagSpoof);
                              if (GEOSHIM_DEBUG_BUILD) {
                                  GSLog(@"locationd: encode %f,%f -> %f,%f",
                                        real.coordinate.latitude, real.coordinate.longitude,
                                        fake.coordinate.latitude, fake.coordinate.longitude);
                              }
                              ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(fake, _cmd, coder);
                              return;
                          }
                      }
                  }
              } @catch (NSException *e) {
                  gs_diag_inc(&gDiagThrow);
                  GSLog(@"locationd: encodeWithCoder substitution failed: %@", e);
              }

              if (gEncodeWithCoderOrig) {
                  ((void (*)(id, SEL, NSCoder *))gEncodeWithCoderOrig)(self, _cmd, coder);
              }
          }'''
          assert tx.count(old_fn) == 1
          tx = tx.replace(old_fn, new_fn, 1)
          open("Tweak.x", "w").write(tx)

          m = open("cli/main.m").read()
          old_json_anchor = "static int commandStatusJSON(void) {"
          diag_fn = '''static void printEncodeDiag(void) {
              int tok = -1;
              if (notify_register_check("xyz.regulad.geoshim.diag", &tok) == NOTIFY_STATUS_OK) {
                  uint64_t v = 0;
                  notify_get_state(tok, &v);
                  notify_cancel(tok);
                  printf("  encode hook: diag_alive=%u calls=%llu spoofed=%llu threw=%llu\\n",
                         (unsigned)((v >> 63) & 1),
                         (unsigned long long)(v & 0xFFFF),
                         (unsigned long long)((v >> 16) & 0xFFFF),
                         (unsigned long long)((v >> 32) & 0xFFFF));
              }
              int t2 = -1;
              if (notify_register_check("xyz.regulad.geoshim.xpc2", &t2) == NOTIFY_STATUS_OK) {
                  uint64_t v2 = 0;
                  notify_get_state(t2, &v2);
                  notify_cancel(t2);
                  printf("  xpc probe:   alive=%u msg_hook=%u notif_hook=%u real_seen=%u dbl_key=%u msg_calls=%llu notif_calls=%llu\\n",
                         (unsigned)((v2 >> 63) & 1),
                         (unsigned)((v2 >> 62) & 1),
                         (unsigned)((v2 >> 61) & 1),
                         (unsigned)((v2 >> 60) & 1),
                         (unsigned)((v2 >> 59) & 1),
                         (unsigned long long)(v2 & 0xFFFFFF),
                         (unsigned long long)((v2 >> 24) & 0xFFFFFF));
              }
              int t1 = -1;
              if (notify_register_check("xyz.regulad.geoshim.xpc", &t1) == NOTIFY_STATUS_OK) {
                  uint64_t v1 = 0;
                  notify_get_state(t1, &v1);
                  notify_cancel(t1);
                  printf("  xpc match:   hits=%llu fn=%u bplist=%u be=%u blob_len=%llu off1=%llu off2=%llu\\n",
                         (unsigned long long)(v1 & 0xFFFF),
                         (unsigned)((v1 >> 56) & 0x3),
                         (unsigned)((v1 >> 58) & 1),
                         (unsigned)((v1 >> 59) & 1),
                         (unsigned long long)((v1 >> 16) & 0xFFFF),
                         (unsigned long long)((v1 >> 32) & 0xFFF),
                         (unsigned long long)((v1 >> 44) & 0xFFF));
              }
          }

          ''' + old_json_anchor
          assert m.count(old_json_anchor) == 1
          m = m.replace(old_json_anchor, diag_fn, 1)

          old_visit = '''        printf("  visit hook:      %s\\n", (st & GS_STATUS_VISIT_HOOK) ? "installed" : "missing");'''
          new_visit = old_visit + '''
                  printEncodeDiag();'''
          assert m.count(old_visit) == 1
          m = m.replace(old_visit, new_visit, 1)
          open("cli/main.m", "w").write(m)

          mk = open("Makefile").read()
          mk = re.sub(r'(?m)^(\s*\w+_LIBRARIES\s*=.*)$',
                      lambda mm: re.sub(r'\bsandy\b', '', mm.group(1)), mk)
          mk = re.sub(r'(?m)^\s*SUBPROJECTS\s*\+=\s*prefs\s*\n', '', mk)
          open("Makefile", "w").write(mk)

          ctl = open("control").read()
          ctl = re.sub(r'(?m)^Depends:.*$', 'Depends: ellekit', ctl)
          open("control", "w").write(ctl)

          shutil.rmtree("layout/Library/PreferenceLoader", ignore_errors=True)

          assert plistlib.load(open("GeoShim.plist", "rb")) == {"Filter": {"Executables": ["locationd"]}}
          assert "gs_xpc_send_msg" in open("Tweak.x").read()
          assert "xpc probe:" in open("cli/main.m").read()
          print("patch ok")
          PY

      - name: Setup RootHide Theos (macOS + Xcode)
        run: |
          brew install ldid dpkg xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Build .deb (debug build)
        run: |
          export THEOS="$HOME/theos"
          make package ARCHS=arm64e

      - name: Verify ABI, package, diagnostics
        run: |
          python3 - << 'PY'
          import glob, os, struct, sys
          cands = []
          for pat in ("**/GeoShim.dylib", "**/geoshim"):
              cands += glob.glob(os.path.join(".theos/obj", pat), recursive=True)
          files = [p for p in cands if os.path.isfile(p)]
          if not files:
              sys.exit("no built binaries found")
          bad = []
          for p in files:
              magic, cputype, subtype = struct.unpack("<III", open(p, "rb").read(12))
              print(f"{p}: cputype=0x{cputype:08x} cpusubtype=0x{subtype:08x}")
              if cputype != 0x0100000C or not (subtype & 0x80000000):
                  bad.append(p)
          if bad:
              sys.exit("old arm64e ABI: " + ", ".join(bad))
          print("OK: arm64e ptrauth ABI")
          PY
          DEB=$(ls packages/*.deb | head -n 1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Package Version Architecture Depends
          [ "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64e" ] || { echo "bad package arch"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E 'GeoShim\.dylib$|/geoshim$'
          rm -rf /tmp/debx && dpkg-deb -x "$DEB" /tmp/debx
          strings /tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.dylib | grep -q "regulad.geoshim.xpc" || { echo "xpc probe missing in dylib"; exit 1; }
          strings /tmp/debx/usr/local/bin/geoshim | grep -q "xpc probe:" || { echo "xpc output missing in cli"; exit 1; }
          python3 -c 'import plistlib; p=plistlib.load(open("/tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.plist","rb")); assert p=={"Filter":{"Executables":["locationd"]}}, p; print("filter ok")'

      - name: Save .deb file
        uses: actions/upload-artifact@v4
        with:
          name: geoshim-deb-${{ matrix.os }}
          path: packages/*.deb
          if-no-files-found: error

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: geoshim-deb-*
          merge-multiple: true
          path: dist

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          DEB=$(ls dist/*.deb 2>/dev/null | head -n 1)
          if [ -z "$DEB" ]; then echo "no .deb produced"; exit 1; fi
          cp "$DEB" dist/geoshim-latest.deb
          gh release view latest-build >/dev/null 2>&1 || \
            gh release create latest-build --title "GeoShim latest build" --notes "Automated build ${GITHUB_SHA}"
          gh release upload latest-build dist/geoshim-latest.deb --clobber
