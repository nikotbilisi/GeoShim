name: Build GeoShim RootHide

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

concurrency:
  group: geoshim-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Patch package with full iOS 18 IPC/XPC/Mach rewriter v3
        run: |
          python3 - << 'PY'
          import re, plistlib, shutil

          with open("GeoShim.plist", "wb") as f:
              plistlib.dump({"Filter": {"Executables": ["locationd"]}}, f)

          tx = open("Tweak.x").read()
          tx = re.sub(r'#\s*(?:import|include)\s*[<"]libSandy\.h[>"]', '', tx)
          with open("GSConfig.m", "a") as f:
              f.write('\nint libSandy_applyProfile(const char *profileName) { (void)profileName; return 0; }\n')

          with open("GSCommon.h", "a") as f:
              f.write(r'''
          #ifndef GSLOG_DIAG_OVERRIDE
          #define GSLOG_DIAG_OVERRIDE
          #import <Foundation/Foundation.h>
          #import <os/log.h>
          #include <stdio.h>
          static inline void GSLogToOSLog(NSString *m) {
              static os_log_t gslog;
              static dispatch_once_t gs_once;
              dispatch_once(&gs_once, ^{ gslog = os_log_create("xyz.regulad.geoshim", "tweak"); });
              os_log_fault(gslog, "%{public}s", m.UTF8String);
          }
          #undef GSLog
          #define GSLog(fmt, ...) do { NSString *_gsm = [NSString stringWithFormat:@"[GeoShim] " fmt, ##__VA_ARGS__]; NSLog(@"%@", _gsm); GSLogToOSLog(_gsm); } while (0)
          #endif
          ''')

          old_anchor = "static IMP gEncodeWithCoderOrig = NULL;"
          xpc_rewriter = old_anchor + r'''

          // --- GeoShim iOS 18 Total IPC Rewriter v3 (XPC + Pipe + Session + CFMessagePort + dispatch_mach) ---
          #include <notify.h>
          #include <dispatch/dispatch.h>
          #include <CoreFoundation/CoreFoundation.h>
          #include <mach/mach.h>
          #include <mach/message.h>
          #include <unistd.h>
          #include <stdatomic.h>
          #include <stdbool.h>
          #include <stdint.h>
          #include <stdlib.h>
          #include <string.h>
          #include <math.h>
          #include <dlfcn.h>
          #include <substrate.h>
          #if __has_include(<xpc/xpc.h>)
          #include <xpc/xpc.h>
          #else
          typedef id xpc_object_t;
          typedef xpc_object_t xpc_connection_t;
          typedef const struct _xpc_type_s *xpc_type_t;
          typedef void (^xpc_handler_t)(xpc_object_t object);
          extern const struct _xpc_type_s _xpc_type_dictionary;
          extern const struct _xpc_type_s _xpc_type_array;
          extern const struct _xpc_type_s _xpc_type_data;
          extern const struct _xpc_type_s _xpc_type_double;
          extern const struct _xpc_type_s _xpc_type_shmem;
          #define XPC_TYPE_DICTIONARY (&_xpc_type_dictionary)
          #define XPC_TYPE_ARRAY (&_xpc_type_array)
          #define XPC_TYPE_DATA (&_xpc_type_data)
          #define XPC_TYPE_DOUBLE (&_xpc_type_double)
          #define XPC_TYPE_SHMEM (&_xpc_type_shmem)
          extern xpc_type_t xpc_get_type(xpc_object_t obj);
          extern bool xpc_dictionary_apply(xpc_object_t xdict, bool (^applier)(const char *key, xpc_object_t value));
          extern bool xpc_array_apply(xpc_object_t xarray, bool (^applier)(size_t index, xpc_object_t value));
          extern const void *xpc_data_get_bytes_ptr(xpc_object_t xdata);
          extern size_t xpc_data_get_length(xpc_object_t xdata);
          extern double xpc_double_get_value(xpc_object_t xdouble);
          extern void xpc_dictionary_set_data(xpc_object_t xdict, const char *key, const void *bytes, size_t length);
          extern void xpc_dictionary_set_double(xpc_object_t xdict, const char *key, double value);
          extern void xpc_array_set_data(xpc_object_t xarray, size_t index, const void *bytes, size_t length);
          extern void xpc_array_set_double(xpc_object_t xarray, size_t index, double value);
          extern void xpc_connection_send_message(xpc_connection_t conn, xpc_object_t msg);
          extern void xpc_connection_send_message_with_reply(xpc_connection_t conn, xpc_object_t msg, dispatch_queue_t q, xpc_handler_t h);
          #endif

          #define GS_DEG2RAD (3.14159265358979323846 / 180.0)

          static _Atomic uint32_t gDiagEnter = 0;
          static _Atomic uint32_t gDiagSpoof = 0;
          static _Atomic uint32_t gDiagThrow = 0;

          static double gLastRealLat = 0.0, gLastRealLon = 0.0;
          static _Atomic uint32_t gHasRealCoord = 0;
          static double gCandRealLat = 0.0, gCandRealLon = 0.0;
          static int gCandRealCount = 0;

          static _Atomic uint32_t gCachedActive = 0;
          static double gCachedFakeLat = 0.0, gCachedFakeLon = 0.0;
          static CFAbsoluteTime gCachedFakeTs = 0.0;

          static CFAbsoluteTime gBootTime = 0.0;
          static uint32_t gDaemonPid = 0;

          static _Atomic uint32_t gXpcHookedMsg = 0;
          static _Atomic uint32_t gXpcHookedNotif = 0;
          static _Atomic uint32_t gXpcHookedReply = 0;
          static _Atomic uint32_t gXpcHookedSync = 0;
          static _Atomic uint32_t gHookedPipe = 0;
          static _Atomic uint32_t gHookedCfmp = 0;
          static _Atomic uint32_t gHookedDmach = 0;
          static _Atomic uint32_t gHookedSess = 0;

          static _Atomic uint32_t gXpcBlobsRewritten = 0;
          static _Atomic uint32_t gXpcPairsRewritten = 0;
          static _Atomic uint32_t gXpcNonAdjRewritten = 0;
          static _Atomic uint32_t gXpcDblRewritten = 0;
          static _Atomic uint32_t gXpcRadRewritten = 0;
          static _Atomic uint32_t gXpcFloatRewritten = 0;
          static _Atomic uint32_t gXpcShmemSeen = 0;
          static _Atomic uint32_t gXpcTotalCalls = 0;

          static _Atomic uint32_t gIpcPostLeak = 0;
          static _Atomic uint32_t gIpcPipeRewritten = 0;
          static _Atomic uint32_t gIpcCfmpRewritten = 0;
          static _Atomic uint32_t gIpcDmachInHits = 0;
          static _Atomic uint32_t gIpcDmachOolHits = 0;
          static _Atomic uint32_t gIpcSessRewritten = 0;
          static _Atomic uint32_t gAnchorFlips = 0;

          static __thread int gInXpcHook = 0;

          #define GS_DIAG_NOTIFY "xyz.regulad.geoshim.diag"
          #define GS_REAL_NOTIFY "xyz.regulad.geoshim.real"
          #define GS_XPC_NOTIFY  "xyz.regulad.geoshim.xpc"
          #define GS_XPC2_NOTIFY "xyz.regulad.geoshim.xpc2"
          #define GS_XPC3_NOTIFY "xyz.regulad.geoshim.xpc3"
          #define GS_XPC4_NOTIFY "xyz.regulad.geoshim.xpc4"
          #define GS_PROC_NOTIFY "xyz.regulad.geoshim.proc"

          static void gs_set_state(const char *name, int *tok, uint64_t val) {
              int prev = gInXpcHook;
              gInXpcHook = 1;
              if (*tok == -1) notify_register_check(name, tok);
              if (*tok != -1) notify_set_state(*tok, val);
              gInXpcHook = prev;
          }

          static void gs_diag_publish(void) {
              static int tok = -1, rtok = -1, ptok = -1;
              uint64_t v = (1ULL << 63)
                         | (uint64_t)(atomic_load(&gDiagEnter) & 0xFFFF)
                         | ((uint64_t)(atomic_load(&gDiagSpoof) & 0xFFFF) << 16)
                         | ((uint64_t)(atomic_load(&gDiagThrow) & 0xFFFF) << 32);
              gs_set_state(GS_DIAG_NOTIFY, &tok, v);
              if (atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) {
                  int32_t ilat = (int32_t)llround(gLastRealLat * 10000.0);
                  int32_t ilon = (int32_t)llround(gLastRealLon * 10000.0);
                  uint64_t rv = ((uint64_t)(uint32_t)ilat) | (((uint64_t)(uint32_t)ilon) << 32);
                  gs_set_state(GS_REAL_NOTIFY, &rtok, rv);
              }
              uint32_t up = gBootTime > 0.0 ? (uint32_t)(CFAbsoluteTimeGetCurrent() - gBootTime) : 0;
              uint64_t pv = ((uint64_t)gDaemonPid) | (((uint64_t)up) << 32);
              gs_set_state(GS_PROC_NOTIFY, &ptok, pv);
          }

          static void gs_xpc_publish(void) {
              static int tok = -1, tok2 = -1, tok3 = -1, tok4 = -1, ptok = -1;
              uint64_t v = (1ULL << 63)
                         | ((uint64_t)(atomic_load(&gXpcHookedMsg) & 1) << 62)
                         | ((uint64_t)(atomic_load(&gXpcHookedNotif) & 1) << 61)
                         | ((uint64_t)(atomic_load(&gXpcHookedReply) & 1) << 60)
                         | ((uint64_t)(atomic_load(&gXpcHookedSync) & 1) << 59)
                         | ((uint64_t)(atomic_load(&gHookedPipe) & 1) << 58)
                         | ((uint64_t)(atomic_load(&gHookedCfmp) & 1) << 57)
                         | ((uint64_t)(atomic_load(&gHookedDmach) & 1) << 56)
                         | ((uint64_t)(atomic_load(&gHookedSess) & 1) << 55)
                         | ((uint64_t)(atomic_load(&gXpcBlobsRewritten) & 0xFFFFF) << 20)
                         | (uint64_t)(atomic_load(&gXpcPairsRewritten) & 0xFFFFF);
              gs_set_state(GS_XPC_NOTIFY, &tok, v);

              uint64_t v2 = (uint64_t)(atomic_load(&gXpcNonAdjRewritten) & 0xFFFF)
                          | ((uint64_t)(atomic_load(&gXpcDblRewritten) & 0xFFFF) << 16)
                          | ((uint64_t)(atomic_load(&gXpcRadRewritten) & 0xFFFF) << 32)
                          | ((uint64_t)(atomic_load(&gXpcFloatRewritten) & 0xFFFF) << 48);
              gs_set_state(GS_XPC2_NOTIFY, &tok2, v2);

              uint64_t v3 = (uint64_t)(atomic_load(&gIpcPostLeak) & 0xFFFF)
                          | ((uint64_t)(atomic_load(&gIpcPipeRewritten) & 0xFFFF) << 16)
                          | ((uint64_t)(atomic_load(&gIpcCfmpRewritten) & 0xFFFF) << 32)
                          | ((uint64_t)(atomic_load(&gIpcDmachInHits) & 0xFFFF) << 48);
              gs_set_state(GS_XPC3_NOTIFY, &tok3, v3);

              uint64_t v4 = (uint64_t)(atomic_load(&gIpcDmachOolHits) & 0xFFFF)
                          | ((uint64_t)(atomic_load(&gAnchorFlips) & 0xFFFF) << 16)
                          | ((uint64_t)(atomic_load(&gXpcShmemSeen) & 0xFFFF) << 32)
                          | ((uint64_t)(atomic_load(&gIpcSessRewritten) & 0xFFFF) << 48);
              gs_set_state(GS_XPC4_NOTIFY, &tok4, v4);

              uint32_t up = gBootTime > 0.0 ? (uint32_t)(CFAbsoluteTimeGetCurrent() - gBootTime) : 0;
              uint64_t pv = ((uint64_t)gDaemonPid) | (((uint64_t)up) << 32);
              gs_set_state(GS_PROC_NOTIFY, &ptok, pv);
          }

          static void gs_diag_inc(_Atomic uint32_t *c) { atomic_fetch_add(c, 1); gs_diag_publish(); }

          static inline double gs_bswap_d(uint64_t raw) {
              uint64_t sw = __builtin_bswap64(raw);
              double d;
              memcpy(&d, &sw, 8);
              return d;
          }

          static inline uint64_t gs_d_to_be(double d) {
              uint64_t u;
              memcpy(&u, &d, 8);
              return __builtin_bswap64(u);
          }

          static inline float gs_bswap_f(uint32_t raw) {
              uint32_t sw = __builtin_bswap32(raw);
              float f;
              memcpy(&f, &sw, 4);
              return f;
          }

          static inline uint32_t gs_f_to_be(float f) {
              uint32_t u;
              memcpy(&u, &f, 4);
              return __builtin_bswap32(u);
          }

          static inline bool gs_is_already_fake(double lat, double lon, double flat, double flon) {
              return fabs(lat - flat) < 0.002 && fabs(lon - flon) < 0.002;
          }

          static void gs_note_live_real_coord(double lat, double lon, double flat, double flon, bool hasFake) {
              if (!isfinite(lat) || !isfinite(lon) || fabs(lat) > 90.0 || fabs(lon) > 180.0) return;
              if (fabs(lat) < 0.1 && fabs(lon) < 0.1) return;
              if (atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) {
                  // Ignore coordinates that are actually our own spoofed target when target is far from real
                  if (hasFake && (fabs(flat - gLastRealLat) > 0.08 || fabs(flon - gLastRealLon) > 0.08)) {
                      if (fabs(lat - flat) < 0.05 && fabs(lon - flon) < 0.05) {
                          atomic_fetch_add(&gAnchorFlips, 1);
                          return;
                      }
                  }
                  // Reject single stray geofence/region jumps > 2 deg unless 3 consecutive fresh fixes agree
                  if (fabs(lat - gLastRealLat) > 2.0 || fabs(lon - gLastRealLon) > 2.0) {
                      atomic_fetch_add(&gAnchorFlips, 1);
                      if (fabs(lat - gCandRealLat) < 0.5 && fabs(lon - gCandRealLon) < 0.5) {
                          gCandRealCount++;
                          if (gCandRealCount < 3) return;
                      } else {
                          gCandRealLat = lat; gCandRealLon = lon; gCandRealCount = 1;
                          return;
                      }
                  }
                  gCandRealCount = 0;
              }
              gLastRealLat = lat;
              gLastRealLon = lon;
              atomic_store_explicit(&gHasRealCoord, 1, memory_order_release);
          }

          // Fast read-only leak detector (excludes already-fake coordinates)
          static bool gs_buf_has_unpatched_real(const uint8_t *src, size_t len,
                                                double rlat, double rlon,
                                                double flat, double flon) {
              if (!src || len < 8) return false;
              size_t lim = len > 262144 ? 262144 : len;
              double rlatRad = rlat * GS_DEG2RAD, rlonRad = rlon * GS_DEG2RAD;
              double flatRad = flat * GS_DEG2RAD, flonRad = flon * GS_DEG2RAD;
              bool checkRad = (fabs(rlatRad) > 0.01 || fabs(rlonRad) > 0.01);
              bool hasLatLE = false, hasLonLE = false;
              bool hasLatBE = false, hasLonBE = false;

              for (size_t off = 0; off + 8 <= lim; off++) {
                  double d0;
                  memcpy(&d0, src + off, 8);
                  if (isfinite(d0)) {
                      if (off + 16 <= lim) {
                          double d1;
                          memcpy(&d1, src + off + 8, 8);
                          if (isfinite(d1)) {
                              if (fabs(d0 - rlat) < 1.5 && fabs(d1 - rlon) < 1.5 &&
                                  !gs_is_already_fake(d0, d1, flat, flon)) {
                                  return true;
                              }
                              if (checkRad && fabs(d0 - rlatRad) < 0.025 && fabs(d1 - rlonRad) < 0.025 &&
                                  !(fabs(d0 - flatRad) < 0.0001 && fabs(d1 - flonRad) < 0.0001)) {
                                  return true;
                              }
                          }
                      }
                      if (fabs(d0 - rlat) < 0.5 && !(fabs(d0 - flat) < 0.002 && fabs(rlat - flat) > 0.002)) hasLatLE = true;
                      if (fabs(d0 - rlon) < 0.5 && !(fabs(d0 - flon) < 0.002 && fabs(rlon - flon) > 0.002)) hasLonLE = true;
                  }
                  uint64_t u0;
                  memcpy(&u0, src + off, 8);
                  double b0 = gs_bswap_d(u0);
                  if (isfinite(b0)) {
                      if (off + 16 <= lim) {
                          uint64_t u1;
                          memcpy(&u1, src + off + 8, 8);
                          double b1 = gs_bswap_d(u1);
                          if (isfinite(b1)) {
                              if (fabs(b0 - rlat) < 1.5 && fabs(b1 - rlon) < 1.5 &&
                                  !gs_is_already_fake(b0, b1, flat, flon)) {
                                  return true;
                              }
                              if (checkRad && fabs(b0 - rlatRad) < 0.025 && fabs(b1 - rlonRad) < 0.025 &&
                                  !(fabs(b0 - flatRad) < 0.0001 && fabs(b1 - flonRad) < 0.0001)) {
                                  return true;
                              }
                          }
                      }
                      if (fabs(b0 - rlat) < 0.5 && !(fabs(b0 - flat) < 0.002 && fabs(rlat - flat) > 0.002)) hasLatBE = true;
                      if (fabs(b0 - rlon) < 0.5 && !(fabs(b0 - flon) < 0.002 && fabs(rlon - flon) > 0.002)) hasLonBE = true;
                  }
                  float f0, f1;
                  memcpy(&f0, src + off, 4);
                  memcpy(&f1, src + off + 4, 4);
                  if (isfinite(f0) && isfinite(f1) &&
                      fabs((double)f0 - rlat) < 0.25 && fabs((double)f1 - rlon) < 0.25 &&
                      !gs_is_already_fake((double)f0, (double)f1, flat, flon)) {
                      return true;
                  }
              }
              if (fabs(rlat) > 1.0 && fabs(rlon) > 1.0) {
                  if ((hasLatLE && hasLonLE) || (hasLatBE && hasLonBE)) return true;
              }
              return false;
          }

          static uint32_t gs_patch_buf_inplace(uint8_t *buf, size_t len,
                                               double rlat, double rlon,
                                               double flat, double flon,
                                               bool *outNonAdj, bool *outRad, bool *outF32) {
              if (!buf || len < 8) return 0;
              size_t lim = len > 262144 ? 262144 : len;
              double rlatRad = rlat * GS_DEG2RAD, rlonRad = rlon * GS_DEG2RAD;
              double flatRad = flat * GS_DEG2RAD, flonRad = flon * GS_DEG2RAD;
              uint64_t flatBE = gs_d_to_be(flat), flonBE = gs_d_to_be(flon);
              uint64_t flatRadBE = gs_d_to_be(flatRad), flonRadBE = gs_d_to_be(flonRad);
              float flatF = (float)flat, flonF = (float)flon;
              uint32_t flatFBE = gs_f_to_be(flatF), flonFBE = gs_f_to_be(flonF);
              bool checkRad = (fabs(rlatRad) > 0.01 || fabs(rlonRad) > 0.01);

              uint32_t adjPairs = 0, radPairs = 0, f32Pairs = 0, nonAdjVals = 0;

              // Pass 1: Adjacent pairs (LE/BE double degrees, LE/BE double radians, LE/BE float32 degrees)
              for (size_t off = 0; off + 8 <= lim; off++) {
                  if (off + 16 <= lim) {
                      double d0, d1;
                      memcpy(&d0, buf + off, 8);
                      memcpy(&d1, buf + off + 8, 8);
                      if (isfinite(d0) && isfinite(d1)) {
                          if (fabs(d0 - rlat) < 1.5 && fabs(d1 - rlon) < 1.5) {
                              if (!gs_is_already_fake(d0, d1, flat, flon)) {
                                  memcpy(buf + off, &flat, 8);
                                  memcpy(buf + off + 8, &flon, 8);
                                  adjPairs++;
                                  off += 15;
                                  continue;
                              }
                          }
                          if (checkRad && fabs(d0 - rlatRad) < 0.025 && fabs(d1 - rlonRad) < 0.025) {
                              if (!(fabs(d0 - flatRad) < 0.0001 && fabs(d1 - flonRad) < 0.0001)) {
                                  memcpy(buf + off, &flatRad, 8);
                                  memcpy(buf + off + 8, &flonRad, 8);
                                  radPairs++;
                                  off += 15;
                                  continue;
                              }
                          }
                      }
                      uint64_t u0, u1;
                      memcpy(&u0, buf + off, 8);
                      memcpy(&u1, buf + off + 8, 8);
                      double b0 = gs_bswap_d(u0), b1 = gs_bswap_d(u1);
                      if (isfinite(b0) && isfinite(b1)) {
                          if (fabs(b0 - rlat) < 1.5 && fabs(b1 - rlon) < 1.5) {
                              if (!gs_is_already_fake(b0, b1, flat, flon)) {
                                  memcpy(buf + off, &flatBE, 8);
                                  memcpy(buf + off + 8, &flonBE, 8);
                                  adjPairs++;
                                  off += 15;
                                  continue;
                              }
                          }
                          if (checkRad && fabs(b0 - rlatRad) < 0.025 && fabs(b1 - rlonRad) < 0.025) {
                              if (!(fabs(b0 - flatRad) < 0.0001 && fabs(b1 - flonRad) < 0.0001)) {
                                  memcpy(buf + off, &flatRadBE, 8);
                                  memcpy(buf + off + 8, &flonRadBE, 8);
                                  radPairs++;
                                  off += 15;
                                  continue;
                              }
                          }
                      }
                  }
                  float f0, f1;
                  memcpy(&f0, buf + off, 4);
                  memcpy(&f1, buf + off + 4, 4);
                  if (isfinite(f0) && isfinite(f1) &&
                      fabs((double)f0 - rlat) < 0.25 && fabs((double)f1 - rlon) < 0.25 &&
                      !gs_is_already_fake((double)f0, (double)f1, flat, flon)) {
                      memcpy(buf + off, &flatF, 4);
                      memcpy(buf + off + 4, &flonF, 4);
                      f32Pairs++;
                      off += 7;
                      continue;
                  }
                  uint32_t fu0, fu1;
                  memcpy(&fu0, buf + off, 4);
                  memcpy(&fu1, buf + off + 4, 4);
                  float bf0 = gs_bswap_f(fu0), bf1 = gs_bswap_f(fu1);
                  if (isfinite(bf0) && isfinite(bf1) &&
                      fabs((double)bf0 - rlat) < 0.25 && fabs((double)bf1 - rlon) < 0.25 &&
                      !gs_is_already_fake((double)bf0, (double)bf1, flat, flon)) {
                      memcpy(buf + off, &flatFBE, 4);
                      memcpy(buf + off + 4, &flonFBE, 4);
                      f32Pairs++;
                      off += 7;
                      continue;
                  }
              }

              // Pass 2: Non-adjacent LE/BE doubles ONLY if BOTH unpatched lat AND unpatched lon still remain
              if (fabs(rlat) > 1.0 && fabs(rlon) > 1.0) {
                  bool remLatLE = false, remLonLE = false, remLatBE = false, remLonBE = false;
                  for (size_t off = 0; off + 8 <= lim; off++) {
                      double d;
                      memcpy(&d, buf + off, 8);
                      if (isfinite(d)) {
                          if (fabs(d - rlat) < 0.5 && !(fabs(d - flat) < 0.002 && fabs(rlat - flat) > 0.002)) remLatLE = true;
                          if (fabs(d - rlon) < 0.5 && !(fabs(d - flon) < 0.002 && fabs(rlon - flon) > 0.002)) remLonLE = true;
                      }
                      uint64_t u;
                      memcpy(&u, buf + off, 8);
                      double b = gs_bswap_d(u);
                      if (isfinite(b)) {
                          if (fabs(b - rlat) < 0.5 && !(fabs(b - flat) < 0.002 && fabs(rlat - flat) > 0.002)) remLatBE = true;
                          if (fabs(b - rlon) < 0.5 && !(fabs(b - flon) < 0.002 && fabs(rlon - flon) > 0.002)) remLonBE = true;
                      }
                  }
                  if ((remLatLE && remLonLE) || (remLatBE && remLonBE)) {
                      for (size_t off = 0; off + 8 <= lim; off++) {
                          if (remLatLE && remLonLE) {
                              double d;
                              memcpy(&d, buf + off, 8);
                              if (isfinite(d)) {
                                  if (fabs(d - rlat) < 0.5 && !(fabs(d - flat) < 0.002 && fabs(rlat - flat) > 0.002)) {
                                      memcpy(buf + off, &flat, 8);
                                      nonAdjVals++;
                                      off += 7;
                                      continue;
                                  }
                                  if (fabs(d - rlon) < 0.5 && !(fabs(d - flon) < 0.002 && fabs(rlon - flon) > 0.002)) {
                                      memcpy(buf + off, &flon, 8);
                                      nonAdjVals++;
                                      off += 7;
                                      continue;
                                  }
                              }
                          }
                          if (remLatBE && remLonBE) {
                              uint64_t u;
                              memcpy(&u, buf + off, 8);
                              double b = gs_bswap_d(u);
                              if (isfinite(b)) {
                                  if (fabs(b - rlat) < 0.5 && !(fabs(b - flat) < 0.002 && fabs(rlat - flat) > 0.002)) {
                                      memcpy(buf + off, &flatBE, 8);
                                      nonAdjVals++;
                                      off += 7;
                                      continue;
                                  }
                                  if (fabs(b - rlon) < 0.5 && !(fabs(b - flon) < 0.002 && fabs(rlon - flon) > 0.002)) {
                                      memcpy(buf + off, &flonBE, 8);
                                      nonAdjVals++;
                                      off += 7;
                                      continue;
                                  }
                              }
                          }
                      }
                  }
              }

              if (outNonAdj) *outNonAdj = (nonAdjVals > 0);
              if (outRad) *outRad = (radPairs > 0);
              if (outF32) *outF32 = (f32Pairs > 0);
              return adjPairs + radPairs + f32Pairs + (nonAdjVals + 1) / 2;
          }

          static uint8_t *gs_make_patched_blob(const uint8_t *src, size_t len,
                                               double rlat, double rlon,
                                               double flat, double flon,
                                               uint32_t *outPairs, bool *outNonAdj,
                                               bool *outRad, bool *outF32) {
              if (!src || len < 8) return NULL;
              if (!gs_buf_has_unpatched_real(src, len, rlat, rlon, flat, flon)) return NULL;
              uint8_t *buf = (uint8_t *)malloc(len);
              if (!buf) return NULL;
              memcpy(buf, src, len);
              uint32_t total = gs_patch_buf_inplace(buf, len, rlat, rlon, flat, flon, outNonAdj, outRad, outF32);
              if (total == 0) { free(buf); return NULL; }
              if (outPairs) *outPairs = total;
              return buf;
          }

          typedef struct { char *key; uint8_t *buf; size_t len; } gs_dict_patch_t;
          typedef struct { gs_dict_patch_t items[64]; int count; } gs_dict_patch_list_t;
          typedef struct { char *key; double val; } gs_dbl_patch_t;
          typedef struct { gs_dbl_patch_t items[32]; int count; bool hasLat; bool hasLon; } gs_dbl_patch_list_t;
          typedef struct { size_t idx; uint8_t *buf; size_t len; } gs_arr_patch_t;
          typedef struct { gs_arr_patch_t items[64]; int count; } gs_arr_patch_list_t;
          typedef struct { size_t idx; double val; } gs_adbl_patch_t;
          typedef struct { gs_adbl_patch_t items[32]; int count; bool hasLat; bool hasLon; } gs_adbl_patch_list_t;

          static bool gs_xpc_obj_has_leak(xpc_object_t obj, int depth,
                                          double rlat, double rlon, double flat, double flon) {
              if (!obj || depth > 16) return false;
              xpc_type_t t = xpc_get_type(obj);
              __block bool found = false;
              if (t == XPC_TYPE_DICTIONARY) {
                  xpc_dictionary_apply(obj, ^bool(const char *key, xpc_object_t val) {
                      (void)key;
                      if (!val || found) return false;
                      xpc_type_t vt = xpc_get_type(val);
                      if (vt == XPC_TYPE_DATA) {
                          const uint8_t *p = (const uint8_t *)xpc_data_get_bytes_ptr(val);
                          size_t len = xpc_data_get_length(val);
                          if (gs_buf_has_unpatched_real(p, len, rlat, rlon, flat, flon)) { found = true; return false; }
                      } else if (vt == XPC_TYPE_DICTIONARY || vt == XPC_TYPE_ARRAY) {
                          if (gs_xpc_obj_has_leak(val, depth + 1, rlat, rlon, flat, flon)) { found = true; return false; }
                      }
                      return true;
                  });
              } else if (t == XPC_TYPE_ARRAY) {
                  xpc_array_apply(obj, ^bool(size_t idx, xpc_object_t val) {
                      (void)idx;
                      if (!val || found) return false;
                      xpc_type_t vt = xpc_get_type(val);
                      if (vt == XPC_TYPE_DATA) {
                          const uint8_t *p = (const uint8_t *)xpc_data_get_bytes_ptr(val);
                          size_t len = xpc_data_get_length(val);
                          if (gs_buf_has_unpatched_real(p, len, rlat, rlon, flat, flon)) { found = true; return false; }
                      } else if (vt == XPC_TYPE_DICTIONARY || vt == XPC_TYPE_ARRAY) {
                          if (gs_xpc_obj_has_leak(val, depth + 1, rlat, rlon, flat, flon)) { found = true; return false; }
                      }
                      return true;
                  });
              }
              return found;
          }

          static bool gs_rewrite_xpc_obj(xpc_object_t obj, int depth,
                                         double rlat, double rlon,
                                         double flat, double flon) {
              if (!obj || depth > 16) return false;
              xpc_type_t t = xpc_get_type(obj);
              bool changed = false;
              if (t == XPC_TYPE_DICTIONARY) {
                  gs_dict_patch_list_t dlist;
                  memset(&dlist, 0, sizeof(dlist));
                  gs_dict_patch_list_t *dp = &dlist;

                  gs_dbl_patch_list_t dbllist;
                  memset(&dbllist, 0, sizeof(dbllist));
                  gs_dbl_patch_list_t *dblp = &dbllist;

                  __block bool childChanged = false;
                  xpc_dictionary_apply(obj, ^bool(const char *key, xpc_object_t val) {
                      if (!val) return true;
                      xpc_type_t vt = xpc_get_type(val);
                      if (vt == XPC_TYPE_DATA && key && dp->count < 64) {
                          const uint8_t *p = (const uint8_t *)xpc_data_get_bytes_ptr(val);
                          size_t len = xpc_data_get_length(val);
                          uint32_t pairs = 0;
                          bool nonAdj = false, rad = false, f32 = false;
                          uint8_t *patched = gs_make_patched_blob(p, len, rlat, rlon, flat, flon, &pairs, &nonAdj, &rad, &f32);
                          if (patched) {
                              char *kcopy = strdup(key);
                              if (kcopy) {
                                  dp->items[dp->count].key = kcopy;
                                  dp->items[dp->count].buf = patched;
                                  dp->items[dp->count].len = len;
                                  dp->count++;
                                  atomic_fetch_add(&gXpcBlobsRewritten, 1);
                                  atomic_fetch_add(&gXpcPairsRewritten, pairs);
                                  if (nonAdj) atomic_fetch_add(&gXpcNonAdjRewritten, 1);
                                  if (rad) atomic_fetch_add(&gXpcRadRewritten, 1);
                                  if (f32) atomic_fetch_add(&gXpcFloatRewritten, 1);
                              } else {
                                  free(patched);
                              }
                          }
                      } else if (vt == XPC_TYPE_DOUBLE && key && dblp->count < 32) {
                          double dv = xpc_double_get_value(val);
                          if (isfinite(dv) && fabs(dv - rlat) < 0.5 && !(fabs(dv - flat) < 0.002 && fabs(rlat - flat) > 0.002)) {
                              char *kcopy = strdup(key);
                              if (kcopy) { dblp->items[dblp->count].key = kcopy; dblp->items[dblp->count].val = flat; dblp->count++; dblp->hasLat = true; }
                          } else if (isfinite(dv) && fabs(dv - rlon) < 0.5 && !(fabs(dv - flon) < 0.002 && fabs(rlon - flon) > 0.002)) {
                              char *kcopy = strdup(key);
                              if (kcopy) { dblp->items[dblp->count].key = kcopy; dblp->items[dblp->count].val = flon; dblp->count++; dblp->hasLon = true; }
                          }
                      } else if (vt == XPC_TYPE_SHMEM) {
                          atomic_fetch_add(&gXpcShmemSeen, 1);
                      } else if (vt == XPC_TYPE_DICTIONARY || vt == XPC_TYPE_ARRAY) {
                          if (gs_rewrite_xpc_obj(val, depth + 1, rlat, rlon, flat, flon)) {
                              childChanged = true;
                          }
                      }
                      return true;
                  });
                  for (int i = 0; i < dlist.count; i++) {
                      xpc_dictionary_set_data(obj, dlist.items[i].key, dlist.items[i].buf, dlist.items[i].len);
                      free(dlist.items[i].key);
                      free(dlist.items[i].buf);
                      changed = true;
                  }
                  for (int i = 0; i < dbllist.count; i++) {
                      if (dbllist.hasLat && dbllist.hasLon) {
                          xpc_dictionary_set_double(obj, dbllist.items[i].key, dbllist.items[i].val);
                          atomic_fetch_add(&gXpcDblRewritten, 1);
                          changed = true;
                      }
                      free(dbllist.items[i].key);
                  }
                  if (childChanged) changed = true;
              } else if (t == XPC_TYPE_ARRAY) {
                  gs_arr_patch_list_t alist;
                  memset(&alist, 0, sizeof(alist));
                  gs_arr_patch_list_t *ap = &alist;

                  gs_adbl_patch_list_t adlist;
                  memset(&adlist, 0, sizeof(adlist));
                  gs_adbl_patch_list_t *adp = &adlist;

                  __block bool childChanged = false;
                  xpc_array_apply(obj, ^bool(size_t idx, xpc_object_t val) {
                      if (!val) return true;
                      xpc_type_t vt = xpc_get_type(val);
                      if (vt == XPC_TYPE_DATA && ap->count < 64) {
                          const uint8_t *p = (const uint8_t *)xpc_data_get_bytes_ptr(val);
                          size_t len = xpc_data_get_length(val);
                          uint32_t pairs = 0;
                          bool nonAdj = false, rad = false, f32 = false;
                          uint8_t *patched = gs_make_patched_blob(p, len, rlat, rlon, flat, flon, &pairs, &nonAdj, &rad, &f32);
                          if (patched) {
                              ap->items[ap->count].idx = idx;
                              ap->items[ap->count].buf = patched;
                              ap->items[ap->count].len = len;
                              ap->count++;
                              atomic_fetch_add(&gXpcBlobsRewritten, 1);
                              atomic_fetch_add(&gXpcPairsRewritten, pairs);
                              if (nonAdj) atomic_fetch_add(&gXpcNonAdjRewritten, 1);
                              if (rad) atomic_fetch_add(&gXpcRadRewritten, 1);
                              if (f32) atomic_fetch_add(&gXpcFloatRewritten, 1);
                          }
                      } else if (vt == XPC_TYPE_DOUBLE && adp->count < 32) {
                          double dv = xpc_double_get_value(val);
                          if (isfinite(dv) && fabs(dv - rlat) < 0.5 && !(fabs(dv - flat) < 0.002 && fabs(rlat - flat) > 0.002)) {
                              adp->items[adp->count].idx = idx; adp->items[adp->count].val = flat; adp->count++; adp->hasLat = true;
                          } else if (isfinite(dv) && fabs(dv - rlon) < 0.5 && !(fabs(dv - flon) < 0.002 && fabs(rlon - flon) > 0.002)) {
                              adp->items[adp->count].idx = idx; adp->items[adp->count].val = flon; adp->count++; adp->hasLon = true;
                          }
                      } else if (vt == XPC_TYPE_SHMEM) {
                          atomic_fetch_add(&gXpcShmemSeen, 1);
                      } else if (vt == XPC_TYPE_DICTIONARY || vt == XPC_TYPE_ARRAY) {
                          if (gs_rewrite_xpc_obj(val, depth + 1, rlat, rlon, flat, flon)) {
                              childChanged = true;
                          }
                      }
                      return true;
                  });
                  for (int i = 0; i < alist.count; i++) {
                      xpc_array_set_data(obj, alist.items[i].idx, alist.items[i].buf, alist.items[i].len);
                      free(alist.items[i].buf);
                      changed = true;
                  }
                  for (int i = 0; i < adlist.count; i++) {
                      if (adlist.hasLat && adlist.hasLon) {
                          xpc_array_set_double(obj, adlist.items[i].idx, adlist.items[i].val);
                          atomic_fetch_add(&gXpcDblRewritten, 1);
                          changed = true;
                      }
                  }
                  if (childChanged) changed = true;
              }
              return changed;
          }

          static bool gs_refresh_fake_coord(double rlat, double rlon, double *outFlat, double *outFlon) {
              @autoreleasepool {
                  @try {
                      GSLocationFactory *factory = [GSLocationFactory shared];
                      bool active = factory && factory.active;
                      atomic_store_explicit(&gCachedActive, active ? 1 : 0, memory_order_release);
                      if (!active) return false;
                      CFAbsoluteTime now = CFAbsoluteTimeGetCurrent();
                      if (now - gCachedFakeTs >= 0.5 || gCachedFakeTs == 0.0) {
                          CLLocation *dummy = [[CLLocation alloc] initWithLatitude:rlat longitude:rlon];
                          CLLocation *fake = [factory spoofedLocationFromReal:dummy];
                          if (!fake || !CLLocationCoordinate2DIsValid(fake.coordinate)) return false;
                          gCachedFakeLat = fake.coordinate.latitude;
                          gCachedFakeLon = fake.coordinate.longitude;
                          gCachedFakeTs = now;
                      }
                      *outFlat = gCachedFakeLat;
                      *outFlon = gCachedFakeLon;
                      return true;
                  } @catch (NSException *e) {
                      (void)e;
                      return false;
                  }
              }
          }

          static bool gs_handle_outbound_xpc(xpc_object_t msg) {
              if (!msg || !atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) return false;
              double rlat = gLastRealLat, rlon = gLastRealLon;
              if (fabs(rlat) < 0.05 && fabs(rlon) < 0.05) return false;
              double flat = 0.0, flon = 0.0;
              if (!gs_refresh_fake_coord(rlat, rlon, &flat, &flon)) return false;
              bool did = gs_rewrite_xpc_obj(msg, 0, rlat, rlon, flat, flon);
              if (did && gs_xpc_obj_has_leak(msg, 0, rlat, rlon, flat, flon)) {
                  atomic_fetch_add(&gIpcPostLeak, 1);
              }
              uint32_t n = atomic_fetch_add(&gXpcTotalCalls, 1) + 1;
              if (did || (n & 63) == 1) gs_xpc_publish();
              return did;
          }

          // Pure lock-free C catch-all below XPC/NSXPC/dispatch_mach (zero ObjC, zero malloc, zero notify calls)
          typedef mach_msg_header_t *(*gs_dmm_get_msg_fn)(void *dmsg, size_t *size_ptr);
          static gs_dmm_get_msg_fn gDmmGetMsg = NULL;

          static void gs_handle_outbound_dmach(void *dmsg) {
              if (!dmsg || !gDmmGetMsg) return;
              if (!atomic_load_explicit(&gCachedActive, memory_order_acquire)) return;
              if (!atomic_load_explicit(&gHasRealCoord, memory_order_acquire)) return;
              double rlat = gLastRealLat, rlon = gLastRealLon;
              double flat = gCachedFakeLat, flon = gCachedFakeLon;
              if ((fabs(rlat) < 0.05 && fabs(rlon) < 0.05) || (fabs(flat) < 0.0001 && fabs(flon) < 0.0001)) return;

              size_t sz = 0;
              mach_msg_header_t *hdr = gDmmGetMsg(dmsg, &sz);
              if (!hdr || sz < sizeof(mach_msg_header_t) + 16) return;
              if (hdr->msgh_size >= sizeof(mach_msg_header_t) && hdr->msgh_size < sz) {
                  sz = hdr->msgh_size;
              }
              uint8_t *base = (uint8_t *)hdr;
              size_t off = sizeof(mach_msg_header_t);

              if (hdr->msgh_bits & MACH_MSGH_BITS_COMPLEX) {
                  if (off + sizeof(mach_msg_body_t) > sz) return;
                  const mach_msg_body_t *body = (const mach_msg_body_t *)(base + off);
                  uint32_t dcnt = body->msgh_descriptor_count;
                  if (dcnt > 256) dcnt = 256;
                  off += sizeof(mach_msg_body_t);
                  for (uint32_t i = 0; i < dcnt; i++) {
                      if (off + sizeof(mach_msg_type_descriptor_t) > sz) { off = sz; break; }
                      uint8_t dtype = ((const mach_msg_type_descriptor_t *)(base + off))->type;
                      if (dtype == MACH_MSG_PORT_DESCRIPTOR) {
                          off += sizeof(mach_msg_port_descriptor_t);
                      } else if (dtype == MACH_MSG_OOL_DESCRIPTOR || dtype == MACH_MSG_OOL_VOLATILE_DESCRIPTOR) {
                          if (off + sizeof(mach_msg_ool_descriptor_t) > sz) { off = sz; break; }
                          const mach_msg_ool_descriptor_t *ool = (const mach_msg_ool_descriptor_t *)(base + off);
                          if ((uintptr_t)ool->address > 0x10000 && ool->size >= 16 && ool->size <= 262144) {
                              if (gs_buf_has_unpatched_real((const uint8_t *)ool->address, ool->size, rlat, rlon, flat, flon)) {
                                  atomic_fetch_add(&gIpcDmachOolHits, 1);
                              }
                          }
                          off += sizeof(mach_msg_ool_descriptor_t);
                      } else if (dtype == MACH_MSG_OOL_PORTS_DESCRIPTOR) {
                          off += sizeof(mach_msg_ool_ports_descriptor_t);
                      }
          #ifdef MACH_MSG_GUARDED_PORT_DESCRIPTOR
                      else if (dtype == MACH_MSG_GUARDED_PORT_DESCRIPTOR) {
                          off += sizeof(mach_msg_guarded_port_descriptor_t);
                      }
          #endif
                      else {
                          off = sz;
                          break;
                      }
                  }
              }

              if (off < sz && (sz - off) >= 16) {
                  if (gs_buf_has_unpatched_real(base + off, sz - off, rlat, rlon, flat, flon)) {
                      bool na = false, rad = false, f32 = false;
                      uint32_t patched = gs_patch_buf_inplace(base + off, sz - off, rlat, rlon, flat, flon, &na, &rad, &f32);
                      if (patched > 0) {
                          atomic_fetch_add(&gIpcDmachInHits, 1);
                      }
                  }
              }
          }

          static void (*gOrigXpcSendMsg)(xpc_connection_t, xpc_object_t) = NULL;
          static void (*gOrigXpcSendNotif)(xpc_connection_t, xpc_object_t) = NULL;
          static void (*gOrigXpcSendReply)(xpc_connection_t, xpc_object_t, dispatch_queue_t, xpc_handler_t) = NULL;
          static void *(*gOrigXpcSendSync)(void *, void *) = NULL;

          static int (*gOrigXpcPipeReply)(void *) = NULL;
          static int (*gOrigXpcPipeSimple)(void *, void *) = NULL;
          static int (*gOrigXpcPipeRoutine)(void *, void *, void **) = NULL;
          static int (*gOrigXpcPipeRoutineFlags)(void *, void *, void **, uint64_t) = NULL;

          static int (*gOrigXpcSessSend)(void *, void *) = NULL;
          static void (*gOrigXpcSessAsync)(void *, void *, void *) = NULL;
          static void *(*gOrigXpcSessSync)(void *, void *, void **) = NULL;

          static SInt32 (*gOrigCFMPSend)(CFMessagePortRef, SInt32, CFDataRef, CFTimeInterval, CFTimeInterval, CFStringRef, CFDataRef *) = NULL;

          static void (*gOrigDmachSend)(void *, void *, mach_msg_option_t) = NULL;
