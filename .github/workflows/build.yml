                      r = int(14 + 12 * tx + 6 * ty)
                      g = int(112 + 78 * (1.0 - ty) + 25 * tx)
                      b = int(235 - 35 * ty)
                      dx_r = (x - cx) / (size * 0.34)
                      dy_r = (y - tip_y) / (size * 0.12)
                      dr = math.hypot(dx_r, dy_r)
                      if 0.78 <= dr <= 0.96:
                          r = int(r * 0.65 + 255 * 0.35)
                          g = int(g * 0.65 + 255 * 0.35)
                          b = int(b * 0.65 + 255 * 0.35)
                      dx = x - cx
                      dy = y - cy
                      dist = math.hypot(dx, dy)
                      in_pin = dist <= r_head
                      if not in_pin and y >= cy and y <= tip_y:
                          frac = (y - cy) / (tip_y - cy)
                          half_w = r_head * (1.0 - frac) * 0.96
                          if abs(dx) <= half_w:
                              in_pin = True
                      if in_pin and dist >= r_hole:
                          r, g, b = 255, 255, 255
                      row.extend((max(0, min(255, r)), max(0, min(255, g)), max(0, min(255, b)), 255))
                  rows.append(bytes(row))
              raw = b"".join(rows)
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)
              ihdr = struct.pack(">IIBBBBB", size, size, 8, 6, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw, 9)) + chunk(b"IEND", b"")
              with open(out_path, "wb") as f:
                  f.write(png)

