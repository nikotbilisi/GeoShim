name: Build GeoShim RootHide
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup RootHide Theos
        run: |
          brew install ldid dpkg xz
          export THEOS="$HOME/theos"
          git clone --recursive https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"
          curl -fsSL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o sdk.tar.xz
          tar -xf sdk.tar.xz -C "$THEOS/sdks"

      - name: Build .deb
        run: |
          export THEOS="$HOME/theos"
          export PATH="/opt/homebrew/bin:/usr/local/bin:$THEOS/bin:$PATH"
          make package FINALPACKAGE=1

      - name: Save .deb file
        uses: actions/upload-artifact@v4
        with:
          name: geoshim-roothide-deb
          path: packages/*.deb
