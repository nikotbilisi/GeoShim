name: Build VCam DEB Packages (Zero-SpringBoard Hardened)

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish artifacts to GitHub Release"
        type: boolean
        default: false
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]

# Least-privilege by default; elevate to contents:write only in publish.
permissions:
  contents: read

concurrency:
  group: vcam-build-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: "16.5"
  # Concrete theos/sdks release tag (never /releases/latest/download/)
  SDK_RELEASE_TAG: "master-146e41f"
  # Verified SHA-256 of iPhoneOS16.5.sdk.tar.xz (17,446,920 bytes)
  SDK_SHA256: "5e0fd3f01266cce4ce012d4a99b38eb56578fca40d09edc81cd83dee958202fb"
  THEOS_REPO: "https://github.com/roothide/theos.git"
  # Verified roothide/theos master HEAD commit SHA
  THEOS_COMMIT: "958fea4f779943505b15b93c88bb4db8d97b346d"
  STRICT_CFLAGS: "-Wall -Wextra -Werror -Wno-unused-parameter -Wno-deprecated-declarations"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Fast pre-flight checks: toolchain pinning, schema/security lint & C11 tests
  # ---------------------------------------------------------------------------
  lint-and-test:
    name: Lint Configs & Run Host C11 Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate toolchain pins, layout, plists, control & maintainer scripts
        run: |
          python3 - << 'PY'
          import os, plistlib, re, sys

          # 0. Enforce immutable pinned Theos commit SHA & SDK release tag + SHA-256
          theos_commit = os.environ.get("THEOS_COMMIT", "")
          sdk_tag = os.environ.get("SDK_RELEASE_TAG", "")
          sdk_sha256 = os.environ.get("SDK_SHA256", "")
          if not re.fullmatch(r"[0-9a-f]{40}", theos_commit):
              sys.exit(f"THEOS_COMMIT must be a pinned 40-char lowercase hex SHA (got {theos_commit!r})")
          if not sdk_tag or sdk_tag == "latest":
              sys.exit(f"SDK_RELEASE_TAG must be a concrete release tag, not {sdk_tag!r}")
          if not re.fullmatch(r"[0-9a-f]{64}", sdk_sha256):
              sys.exit(f"SDK_SHA256 must be a pinned 64-char lowercase hex SHA-256 (got {sdk_sha256!r})")

          required_files = [
              "Makefile",
              "control",
              "hook/Makefile",
              "hook/vcam.plist",
              "hook/Tweak.x",
              "daemon/Makefile",
              "daemon/com.tinysweet.vcamd.plist",
              "daemon/entitlements.plist",
              "daemon/vcamd.m",
              "app/Makefile",
              "app/entitlements.plist",
              "app/Resources/Info.plist",
              "app/main.m",
              "layout/DEBIAN/postinst",
              "layout/DEBIAN/prerm",
              "layout/DEBIAN/postrm",
              "include/vcam_abi.h",
              "tests/Makefile",
              "tests/test_vcam_abi.c",
          ]
          missing = [p for p in required_files if not os.path.isfile(p)]
          if missing:
              sys.exit(f"Missing required project files: {missing}")

          # 1. Strict camera-daemon-only injection filter & required RootHide entitlements
          vcam_plist = plistlib.load(open("hook/vcam.plist", "rb"))
          daemon_plist = plistlib.load(open("daemon/com.tinysweet.vcamd.plist", "rb"))
          daemon_ent = plistlib.load(open("daemon/entitlements.plist", "rb"))
          app_ent = plistlib.load(open("app/entitlements.plist", "rb"))
          app_info = plistlib.load(open("app/Resources/Info.plist", "rb"))
          assert vcam_plist == {
              "Filter": {"Executables": ["mediaserverd", "cameracaptured"]}
          }, f"Unexpected hook/vcam.plist: {vcam_plist}"
          assert daemon_plist.get("Label") == "com.tinysweet.vcamd"
          assert daemon_plist.get("ProgramArguments") == ["/usr/libexec/vcamd"]

          required_ent_keys = (
              "platform-application",
              "com.apple.private.security.no-sandbox",
              "com.apple.private.security.storage.AppBundles",
              "com.apple.private.security.storage.AppDataContainers",
          )
          for k in required_ent_keys:
              assert daemon_ent.get(k) is True, f"daemon/entitlements.plist missing {k}"
              assert app_ent.get(k) is True, f"app/entitlements.plist missing {k}"

          assert app_info.get("CFBundleIdentifier") == "com.tinysweet.vcamapp"
          assert "CFBundleURLTypes" not in app_info, "Refusing unnecessary CFBundleURLTypes in VCam.app"
          assert not os.path.exists("vcam_menu.plist"), "SpringBoard injection must stay removed"

          # 2. Verify RootHide-safe virtual dependency (ellekit | mobilesubstrate)
          ctl = open("control", "r", encoding="utf-8").read()
          assert re.search(r"(?m)^Depends:.*ellekit\s*\|\s*mobilesubstrate", ctl), (
              "control must depend on 'ellekit | mobilesubstrate'"
          )

          # 3. Forbid world-writable chmod (ignoring comments) & /var/mobile/Media leaks
          world_writable_chmod = re.compile(
              r"\bchmod\b[^\n]*(?:\b0?[0-7]?777\b|\b[ugo]*a\+[rwx]*w\b|\bo\+[rwx]*w\b)"
          )
          for script_path in ("layout/DEBIAN/postinst", "layout/DEBIAN/prerm", "layout/DEBIAN/postrm"):
              raw_lines = open(script_path, "r", encoding="utf-8").read().splitlines()
              active_code = "\n".join(
                  ln for ln in raw_lines if not ln.lstrip().startswith("#")
              )
              if world_writable_chmod.search(active_code):
                  sys.exit(f"Refusing world-writable chmod in {script_path}")
              if "/var/mobile/Media" in active_code:
                  sys.exit(f"Refusing jailbreak-detection leak path in {script_path}")

          print("Toolchain pins, zero-SpringBoard filters, entitlements & security lint passed.")
          PY

      - name: Run host-side C11 unit tests (notifyd ABI, VFR PTS, NV12/P010 seqlock & heartbeat)
        run: |
          make -C tests test CFLAGS="-std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined"

  # ---------------------------------------------------------------------------
  # 2. Build RootHide (arm64e) and Rootless (arm64 + arm64e) packages in parallel
  #    on Apple Silicon (macos-15) with content-addressed Theos & SDK cache
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.scheme }} DEB
    needs: lint-and-test
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: roothide
            archs: "arm64e"
            required_slices: "arm64e"
            expected_deb_arch: "iphoneos-arm64e"
            expected_daemon_bin: "/usr/libexec/vcamd"
            dylib_dir: "Library/MobileSubstrate/DynamicLibraries"
            bin_dir: "usr/libexec"
            daemon_dir: "Library/LaunchDaemons"
            app_dir: "Applications/VCam.app"
            out_name: "vcam-roothide.deb"
          - scheme: rootless
            archs: "arm64 arm64e"
            required_slices: "arm64,arm64e"
            expected_deb_arch: "iphoneos-arm64"
            expected_daemon_bin: "/var/jb/usr/libexec/vcamd"
            dylib_dir: "var/jb/Library/MobileSubstrate/DynamicLibraries"
            bin_dir: "var/jb/usr/libexec"
            daemon_dir: "var/jb/Library/LaunchDaemons"
            app_dir: "var/jb/Applications/VCam.app"
            out_name: "vcam-rootless.deb"

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Cache Homebrew bottles
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-ldid-dpkg-make-v2

      - name: Install build tools (ldid, dpkg, gnu-make)
        shell: bash
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1
          export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
          brew install ldid dpkg make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Cache pinned RootHide Theos & verified iPhoneOS SDK
        id: cache-theos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/theos
          key: theos-${{ env.THEOS_COMMIT }}-sdk-${{ env.SDK_VERSION }}-${{ env.SDK_RELEASE_TAG }}-${{ env.SDK_SHA256 }}

      - name: Setup pinned RootHide Theos & verified iPhoneOS ${{ env.SDK_VERSION }} SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/theos"
          git init "$HOME/theos"
          git -C "$HOME/theos" remote add origin "${THEOS_REPO}"
          git -C "$HOME/theos" fetch --depth 1 origin "${THEOS_COMMIT}"
          git -C "$HOME/theos" checkout --detach FETCH_HEAD
          test "$(git -C "$HOME/theos" rev-parse HEAD)" = "${THEOS_COMMIT}"
          git -C "$HOME/theos" submodule update --init --recursive --depth 1

          mkdir -p "$HOME/theos/sdks"
          SDK_ARCHIVE="/tmp/sdk-${SDK_VERSION}.tar.xz"
          curl -fL "https://github.com/theos/sdks/releases/download/${SDK_RELEASE_TAG}/iPhoneOS${SDK_VERSION}.sdk.tar.xz" \
            -o "$SDK_ARCHIVE"
          echo "${SDK_SHA256}  ${SDK_ARCHIVE}" | shasum -a 256 -c -
          tar -xf "$SDK_ARCHIVE" -C "$HOME/theos/sdks"
          test -d "$HOME/theos/sdks/iPhoneOS${SDK_VERSION}.sdk"

      - name: Build ${{ matrix.scheme }} DEB with strict -Werror flags
        shell: bash
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          mkdir -p dist

          make clean
          rm -rf packages .theos
          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME="${{ matrix.scheme }}" \
            ARCHS="${{ matrix.archs }}" \
            ADDITIONAL_CFLAGS="${STRICT_CFLAGS}" \
            ADDITIONAL_OBJCFLAGS="${STRICT_CFLAGS}" \
            -j"$(sysctl -n hw.ncpu)"

          DEB_SRC=$(find packages -maxdepth 1 -name '*.deb' | sort | head -n 1)
          test -f "$DEB_SRC"
          cp "$DEB_SRC" "dist/${{ matrix.out_name }}"
          (cd dist && shasum -a 256 "${{ matrix.out_name }}" > "${{ matrix.out_name }}.sha256")

      - name: Verify Mach-O slices, embedded ldid entitlements, thin-hook isolation & plists
        shell: bash
        env:
          DEB_PATH: "dist/${{ matrix.out_name }}"
          EXPECTED_ARCH: "${{ matrix.expected_deb_arch }}"
          EXPECTED_DAEMON_BIN: "${{ matrix.expected_daemon_bin }}"
          REQUIRED_SLICES: "${{ matrix.required_slices }}"
          DYLIB_REL_DIR: "${{ matrix.dylib_dir }}"
          BIN_REL_DIR: "${{ matrix.bin_dir }}"
          DAEMON_REL_DIR: "${{ matrix.daemon_dir }}"
          APP_REL_DIR: "${{ matrix.app_dir }}"
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os, plistlib, re, shutil, struct, subprocess, sys, tempfile

          def check_required_slices(path, required):
              if not os.path.isfile(path):
                  sys.exit(f"Missing expected Mach-O binary: {path}")
              with open(path, "rb") as f:
                  data = f.read(4096)
              magic_le = struct.unpack("<I", data[:4])[0]
              magic_be = struct.unpack(">I", data[:4])[0]
              slices = []
              is_fat = False
              if magic_le == 0xFEEDFACF:
                  _, cputype, subtype = struct.unpack("<III", data[:12])
                  slices.append((cputype, subtype))
              elif magic_be == 0xCAFEBABE:
                  is_fat = True
                  _, nfat = struct.unpack(">II", data[:8])
                  for i in range(nfat):
                      off = 8 + i * 20
                      cputype, subtype = struct.unpack(">II", data[off:off + 8])
                      slices.append((cputype, subtype))
              elif magic_be == 0xCAFEBABF:
                  is_fat = True
                  _, nfat = struct.unpack(">II", data[:8])
                  for i in range(nfat):
                      off = 8 + i * 32
                      cputype, subtype = struct.unpack(">II", data[off:off + 8])
                      slices.append((cputype, subtype))
              else:
                  sys.exit(f"{path}: unexpected Mach-O magic")

              found = set()
              for c, s in slices:
                  if c == 0x0100000C:
                      base_sub = s & 0x00FFFFFF
                      has_ptrauth = (s & 0x80000000) != 0
                      if base_sub == 0 and not has_ptrauth:
                          found.add("arm64")
                      elif base_sub == 2 and has_ptrauth:
                          found.add("arm64e")

              missing = required - found
              print(f"{path}: fat={is_fat} slices={[(hex(c), hex(s)) for c, s in slices]} parsed={sorted(found)}")
              if missing:
                  sys.exit(f"{path}: missing required Mach-O slice(s): {sorted(missing)}")
              return is_fat

          def check_embedded_entitlements(path, is_fat, required_slices, required_keys):
              # Never call `lipo -thin` on a non-fat (thin 0xFEEDFACF) Mach-O binary.
              with tempfile.TemporaryDirectory() as tmpdir:
                  targets = []
                  if is_fat:
                      for arch_name in sorted(required_slices):
                          thin_path = os.path.join(tmpdir, f"slice_{arch_name}")
                          subprocess.check_call(["lipo", "-thin", arch_name, path, "-output", thin_path])
                          targets.append((arch_name, thin_path))
                  else:
                      targets.append((",".join(sorted(required_slices)), path))

                  for label, bin_path in targets:
                      raw_ent = subprocess.check_output(["ldid", "-e", bin_path])
                      if not raw_ent.strip():
                          sys.exit(f"{path} ({label}): empty embedded entitlements from ldid -e")
                      parsed = plistlib.loads(raw_ent)
                      for key in required_keys:
                          if parsed.get(key) is not True:
                              sys.exit(f"{path} ({label}): missing embedded entitlement {key!r} (got {parsed})")
                      print(f"{path} ({label}): embedded entitlements OK ({sorted(parsed.keys())})")

          deb_path = os.environ["DEB_PATH"]
          expected_arch = os.environ["EXPECTED_ARCH"]
          expected_daemon_bin = os.environ["EXPECTED_DAEMON_BIN"]
          required_slices = {s.strip() for s in os.environ["REQUIRED_SLICES"].split(",") if s.strip()}
          dylib_rel_dir = os.environ["DYLIB_REL_DIR"]
          bin_rel_dir = os.environ["BIN_REL_DIR"]
          daemon_rel_dir = os.environ["DAEMON_REL_DIR"]
          app_rel_dir = os.environ["APP_REL_DIR"]

          arch = subprocess.check_output(["dpkg-deb", "-f", deb_path, "Architecture"], text=True).strip()
          deps = subprocess.check_output(["dpkg-deb", "-f", deb_path, "Depends"], text=True).strip()
          postinst = subprocess.check_output(["dpkg-deb", "-I", deb_path, "postinst"], text=True)
          prerm = subprocess.check_output(["dpkg-deb", "-I", deb_path, "prerm"], text=True)
          postrm = subprocess.check_output(["dpkg-deb", "-I", deb_path, "postrm"], text=True)
          print(f"{deb_path}: Architecture={arch} | Depends={deps}")
          if arch != expected_arch:
              sys.exit(f"{deb_path}: expected Architecture={expected_arch}, got {arch}")

          bad_chmod = re.compile(r"\bchmod\b[^\n]*(?:\b0?[0-7]?777\b|\b[ugo]*a\+[rwx]*w\b|\bo\+[rwx]*w\b)")
          for name, body in (("postinst", postinst), ("prerm", prerm), ("postrm", postrm)):
              active = "\n".join(ln for ln in body.splitlines() if not ln.lstrip().startswith("#"))
              if bad_chmod.search(active):
                  sys.exit(f"{deb_path}: world-writable chmod detected in {name}")
          if "launchctl" not in postinst or "uicache -p" not in postinst:
              sys.exit(f"{deb_path}: launchctl/uicache -p missing in postinst")
          if "launchctl bootout" not in prerm:
              sys.exit(f"{deb_path}: launchctl bootout missing in prerm")
          if "uicache -u com.tinysweet.vcamapp" not in postrm:
              sys.exit(f"{deb_path}: bundle-ID uicache -u missing in postrm")

          extract_dir = "/tmp/verify_" + os.path.basename(deb_path)
          shutil.rmtree(extract_dir, ignore_errors=True)
          subprocess.check_call(["dpkg-deb", "-x", deb_path, extract_dir])

          # 1. Verify ALL required Mach-O slices & embedded ldid entitlements per slice
          dylib_base = os.path.join(extract_dir, dylib_rel_dir)
          vcam_dylib = os.path.join(dylib_base, "vcam.dylib")
          vcamd_bin = os.path.join(extract_dir, bin_rel_dir, "vcamd")
          vcam_app_bin = os.path.join(extract_dir, app_rel_dir, "VCam")

          check_required_slices(vcam_dylib, required_slices)
          vcamd_fat = check_required_slices(vcamd_bin, required_slices)
          app_fat = check_required_slices(vcam_app_bin, required_slices)

          req_ent_keys = (
              "platform-application",
              "com.apple.private.security.no-sandbox",
              "com.apple.private.security.storage.AppBundles",
              "com.apple.private.security.storage.AppDataContainers",
          )
          check_embedded_entitlements(vcamd_bin, vcamd_fat, required_slices, req_ent_keys)
          check_embedded_entitlements(vcam_app_bin, app_fat, required_slices, req_ent_keys)

          # 2. Enforce thin-hook isolation & zero SpringBoard injection
          assert not os.path.exists(os.path.join(dylib_base, "vcam_menu.dylib")), (
              "SpringBoard injection dylib should not be present!"
          )
          otool_out = subprocess.check_output(["otool", "-L", vcam_dylib], text=True)
          for forbidden in (
              "AVFoundation.framework",
              "AVFAudio.framework",
              "AudioToolbox.framework",
              "CoreImage.framework",
              "VideoToolbox.framework",
              "Metal.framework",
              "UIKit.framework",
          ):
              if forbidden in otool_out:
                  sys.exit(f"vcam.dylib links {forbidden}; decoding/rendering/UI must stay out of cameracaptured!")

          # 3. Parse binary plists safely (Theos FINALPACKAGE=1 converts XML to bplist00)
          vcam_plist = plistlib.load(open(os.path.join(dylib_base, "vcam.plist"), "rb"))
          daemon_plist = plistlib.load(
              open(os.path.join(extract_dir, daemon_rel_dir, "com.tinysweet.vcamd.plist"), "rb")
          )
          app_info = plistlib.load(open(os.path.join(extract_dir, app_rel_dir, "Info.plist"), "rb"))
          assert vcam_plist == {"Filter": {"Executables": ["mediaserverd", "cameracaptured"]}}
          assert daemon_plist.get("Label") == "com.tinysweet.vcamd"
          assert daemon_plist.get("ProgramArguments") == [expected_daemon_bin], (
              f"Unexpected ProgramArguments: {daemon_plist.get('ProgramArguments')}"
          )
          assert app_info.get("CFBundleIdentifier") == "com.tinysweet.vcamapp"
          assert "CFBundleURLTypes" not in app_info

          # 4. Ensure rootless packages never leak files outside var/jb or double-nest var/jb/var/jb
          if dylib_rel_dir.startswith("var/jb/"):
              for top_dir in ("Library", "Applications", "usr"):
                  assert not os.path.exists(os.path.join(extract_dir, top_dir)), (
                      f"Rootless DEB leaked /{top_dir} outside var/jb!"
                  )
              assert not os.path.exists(os.path.join(extract_dir, "var/jb/var/jb")), (
                  "Rootless DEB double-nested /var/jb/var/jb!"
              )

          print("ALL MACH-O SLICES, EMBEDDED ENTITLEMENTS, ISOLATION, VCAM.APP & LAUNCHDAEMON CHECKS PASSED")
          PY

      - name: Upload DEB & SHA256 artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vcam-${{ matrix.scheme }}-deb
          path: |
            dist/${{ matrix.out_name }}
            dist/${{ matrix.out_name }}.sha256
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. Publish GitHub Release (NEVER runs on pull_request; merge-multiple: false)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: build
    if: >-
      !cancelled() &&
      needs.build.result == 'success' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
      )
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download built DEB artifacts without fan-in overwrite
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: vcam-*-deb
          merge-multiple: false
          path: artifacts_in

      - name: Unpack-verify DEBs, validate SHA256 & publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p release_out

          for pkg in vcam-roothide.deb vcam-rootless.deb; do
            deb_src=$(find artifacts_in -name "$pkg" | sort | head -n 1)
            sha_src=$(find artifacts_in -name "${pkg}.sha256" | sort | head -n 1)
            test -n "$deb_src" && test -f "$deb_src"
            test -n "$sha_src" && test -f "$sha_src"
            cp "$deb_src" "release_out/$pkg"
            cp "$sha_src" "release_out/${pkg}.sha256"
          done

          cd release_out
          sha256sum -c vcam-roothide.deb.sha256
          sha256sum -c vcam-rootless.deb.sha256
          cat vcam-roothide.deb.sha256 vcam-rootless.deb.sha256 > SHA256SUMS.txt

          # Final pre-release unpack + layout & metadata verification
          rm -rf /tmp/pubcheck_rh /tmp/pubcheck_rl
          dpkg-deb -x vcam-roothide.deb /tmp/pubcheck_rh
          dpkg-deb -x vcam-rootless.deb /tmp/pubcheck_rl

          test "$(dpkg-deb -f vcam-roothide.deb Architecture)" = "iphoneos-arm64e"
          test "$(dpkg-deb -f vcam-rootless.deb Architecture)" = "iphoneos-arm64"

          for f in \
            Library/MobileSubstrate/DynamicLibraries/vcam.dylib \
            Library/MobileSubstrate/DynamicLibraries/vcam.plist \
            usr/libexec/vcamd \
            Library/LaunchDaemons/com.tinysweet.vcamd.plist \
            Applications/VCam.app/VCam \
            Applications/VCam.app/Info.plist; do
            test -f "/tmp/pubcheck_rh/$f"
            test -f "/tmp/pubcheck_rl/var/jb/$f"
          done
          test ! -e /tmp/pubcheck_rl/Library
          test ! -e /tmp/pubcheck_rl/Applications
          test ! -e /tmp/pubcheck_rl/usr
          test ! -e /tmp/pubcheck_rl/var/jb/var/jb

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
            TITLE="VCam iOS ${RELEASE_TAG}"
            PRERELEASE_FLAG=""
          else
            RELEASE_TAG="latest-build"
            TITLE="VCam iOS Rolling Build (RootHide + Rootless)"
            PRERELEASE_FLAG="--prerelease"
          fi

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release create "$RELEASE_TAG" \
              --title "$TITLE" \
              --notes "Automated macOS arm64e build (${GITHUB_SHA})" \
              $PRERELEASE_FLAG
          fi

          gh release upload "$RELEASE_TAG" \
            vcam-roothide.deb \
            vcam-rootless.deb \
            SHA256SUMS.txt \
            --clobber
