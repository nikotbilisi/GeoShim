name: Build GeoShim RootHide

on:
  workflow_dispatch:
  push:

concurrency:
  group: geoshim-build
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Patch package (daemon-only, no Preferences bundle, no libSandy)
        run: |
          python3 - << 'PY'
          import re, plistlib, shutil

          # 1. Фильтр: только демон locationd
          with open("GeoShim.plist", "wb") as f:
              plistlib.dump({"Filter": {"Executables": ["locationd"]}}, f)

          # 2. Заглушка символа libSandy (твик больше её не линкует)
          tx = open("Tweak.x").read()
          tx = re.sub(r'#\s*(?:import|include)\s*[<"]libSandy\.h[>"]', '', tx)
          open("Tweak.x", "w").write(tx)
          with open("GSConfig.m", "a") as f:
              f.write('\nint libSandy_applyProfile(const char *profileName) { (void)profileName; return 0; }\n')

          # 3. Makefile: без -lsandy и без сабпроекта prefs
          mk = open("Makefile").read()
          mk = re.sub(r'(?m)^(\s*\w+_LIBRARIES\s*=.*)$',
                      lambda m: re.sub(r'\bsandy\b', '', m.group(1)), mk)
          mk = re.sub(r'(?m)^\s*SUBPROJECTS\s*\+=\s*prefs\s*\n', '', mk)
          open("Makefile", "w").write(mk)

          # 4. control: только ellekit
          ctl = open("control").read()
          ctl = re.sub(r'(?m)^Depends:.*$', 'Depends: ellekit', ctl)
          open("control", "w").write(ctl)

          # 5. Мёртвый пункт в Настройках убираем
          shutil.rmtree("layout/Library/PreferenceLoader", ignore_errors=True)

          assert plistlib.load(open("GeoShim.plist", "rb")) == {"Filter": {"Executables": ["locationd"]}}
          mk2 = open("Makefile").read()
          assert not re.search(r'(?m)^\s*\w+_LIBRARIES\s*=.*\bsandy\b', mk2)
          assert "SUBPROJECTS += prefs" not in mk2
          assert "libsandy" not in open("control").read().lower()
          assert "libSandy_applyProfile" in open("GSConfig.m").read()
          print("patch ok")
          PY

      - name: Setup RootHide Theos (macOS + Xcode)
        run: |
          brew install ldid dpkg xz make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          mkdir -p "$HOME/theos/sdks"
          curl -fL https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"

      - name: Build .deb
        run: |
          export THEOS="$HOME/theos"
          make package ARCHS=arm64e

      - name: Verify arm64e ABI and package contents
        run: |
          python3 - << 'PY'
          import glob, os, struct, sys
          cands = []
          for pat in ("**/GeoShim.dylib", "**/geoshim"):
              cands += glob.glob(os.path.join(".theos/obj", pat), recursive=True)
          files = [p for p in cands if os.path.isfile(p)]
          if not files:
              sys.exit("no built binaries found")
          bad = []
          for p in files:
              magic, cputype, subtype = struct.unpack("<III", open(p, "rb").read(12))
              print(f"{p}: magic=0x{magic:08x} cputype=0x{cputype:08x} cpusubtype=0x{subtype:08x}")
              if cputype != 0x0100000C or not (subtype & 0x80000000):
                  bad.append(p)
          if bad:
              sys.exit("old arm64e ABI: " + ", ".join(bad))
          print("OK: arm64e ptrauth ABI")
          PY
          DEB=$(ls packages/*.deb | head -n 1)
          echo "deb: $DEB"
          dpkg-deb -f "$DEB" Package Version Architecture Depends
          [ "$(dpkg-deb -f "$DEB" Architecture)" = "iphoneos-arm64e" ] || { echo "bad package arch"; exit 1; }
          dpkg-deb -c "$DEB" | grep -E 'GeoShim\.dylib$|/geoshim$'
          rm -rf /tmp/debx && dpkg-deb -x "$DEB" /tmp/debx
          python3 -c 'import plistlib; p=plistlib.load(open("/tmp/debx/Library/MobileSubstrate/DynamicLibraries/GeoShim.plist","rb")); assert p=={"Filter":{"Executables":["locationd"]}}, p; print("filter ok")'

      - name: Save .deb file
        uses: actions/upload-artifact@v4
        with:
          name: geoshim-deb-${{ matrix.os }}
          path: packages/*.deb
          if-no-files-found: error
